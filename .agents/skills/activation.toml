[meta]
version = 2
source_of_truth = "repository"

[coverage]
required_primary_subjects = [
  "repository-governance",
  "change-lifecycle",
  "skill-portfolio",
  "quality-gates",
  "adoption-profile",
]
single_owner_subjects = [
  "repository-governance",
  "change-lifecycle",
  "skill-portfolio",
  "quality-gates",
  "adoption-profile",
]

[[skill]]
id = "ethos-repository-governance"
path = ".agents/skills/ethos-repository-governance/SKILL.md"
package_manifest = ".agents/skills/ethos-repository-governance/package.toml"
subject = "repository-governance"
operation = "govern"
authority = "primary"
lifecycle = "active"
subjects = ["repository-governance", "ethos", "adoption", "changed-scope"]
path_globs = [
  "AGENTS.md",
  "CONTRIBUTING.md",
  "README.md",
  ".ethos/**",
  "distributions/**",
  "docs/governance/product-design-contract.md",
  "src/ethos/repository/audit*.py",
  "tests/unit/audit/**",
  "rules/**",
  "schemas/**",
]
intent_tokens = ["ethos", "governance", "proof", "adoption", "skills"]
pre_reads = ["AGENTS.md", "docs/governance/playbooks-and-skills.md"]
during_rules = [
  "treat skills as projections over repository truth",
  "use ETHOS command JSON as machine evidence",
]
post_checks = [
  "ethos plan --changed --json",
  "ethos status --json",
]
boundary = "workflow-package-projection"

[[skill]]
id = "ethos-change-lifecycle"
path = ".agents/skills/ethos-change-lifecycle/SKILL.md"
package_manifest = ".agents/skills/ethos-change-lifecycle/package.toml"
subject = "change-lifecycle"
operation = "prove"
authority = "primary"
lifecycle = "active"
subjects = [
  "change-lifecycle",
  "status",
  "plan",
  "prove",
  "land",
  "publish",
  "evidence",
]
path_globs = [
  "src/**",
  "docs/**",
  "system/**",
  "openspec/**",
  "evidence/**",
  "tests/**",
]
intent_tokens = [
  "status",
  "plan",
  "prove",
  "land",
  "publish",
  "readiness",
  "evidence",
  "change",
  "loop",
]
pre_reads = ["AGENTS.md", "rules/mutation.md", "system/axioms.md"]
during_rules = [
  "read the decision verdict; never assume success",
  "dry-run readiness is not executed proof",
]
post_checks = ["ethos status --json"]
boundary = "workflow-package-projection"

[[skill]]
id = "ethos-skill-portfolio-governance"
path = ".agents/skills/ethos-skill-portfolio-governance/SKILL.md"
package_manifest = ".agents/skills/ethos-skill-portfolio-governance/package.toml"
subject = "skill-portfolio"
operation = "govern"
authority = "primary"
lifecycle = "active"
subjects = [
  "skill-portfolio",
  "skills",
  "meta-skills",
  "activation",
  "projection-drift",
]
path_globs = [
  ".agents/skills/**",
  "rules/skills.md",
  "docs/governance/playbooks-and-skills.md",
  "system/schemas/kernel/skill-*.schema.json",
  "src/ethos/assistants/**",
  "src/ethos/contracts/skill/activation.py",
  "tests/unit/assistants/**",
  "tests/unit/cli/test_contracts.py",
]
intent_tokens = [
  "skill",
  "skills",
  "meta-skill",
  "playbook",
  "activation",
  "projection",
  "skill creator",
]
pre_reads = [
  "AGENTS.md",
  "rules/skills.md",
  "docs/governance/playbooks-and-skills.md",
]
during_rules = [
  "add a skill only for repeated repository-specific procedure",
  "keep SKILL.md narrow and put executable checks in scripts",
]
post_checks = [
  "ethos prove --gate playbooks-v2 --json",
  "ethos plan --changed --json",
]
requires = ["ethos-repository-governance"]
boundary = "workflow-package-projection"

[[skill]]
id = "ethos-quality-gate-governance"
path = ".agents/skills/ethos-quality-gate-governance/SKILL.md"
package_manifest = ".agents/skills/ethos-quality-gate-governance/package.toml"
subject = "quality-gates"
operation = "prove"
authority = "primary"
lifecycle = "active"
subjects = [
  "quality-gates",
  "ci",
  "lint",
  "format",
  "types",
  "docstrings",
  "coverage",
  "config",
]
path_globs = [
  ".config/**",
  ".github/workflows/**",
  ".gitlab-ci.yml",
  ".pre-commit-config.yaml",
  "pyproject.toml",
  "uv.lock",
  "pytest.ini",
  "ruff.toml",
  "system/tools.toml",
  "system/quality-*.toml",
  "tools/ci/**",
  "src/ethos/repository/policy/gates.py",
  "tests/unit/governance/**",
  "tests/architecture/**",
]
intent_tokens = [
  "quality",
  "gate",
  "ci",
  "lint",
  "format",
  "ruff",
  "ty",
  "coverage",
  "docstring",
]
pre_reads = [
  "AGENTS.md",
  "rules/evidence.md",
  "docs/governance/product-design-contract.md",
]
during_rules = [
  "provider files invoke owner scripts instead of copying policy",
  "proof default floor must include the active quality floor",
]
post_checks = [
  "tools/ci/scripts/run-python-lint.sh",
  "tools/ci/scripts/run-config-lint.sh",
  "tools/ci/scripts/run-shell-lint.sh",
  "ethos prove --gate repository-audit --json",
  "ethos prove --json",
]
requires = ["ethos-change-lifecycle"]
boundary = "workflow-package-projection"

[[skill]]
id = "ethos-adoption-profile-governance"
path = ".agents/skills/ethos-adoption-profile-governance/SKILL.md"
package_manifest = ".agents/skills/ethos-adoption-profile-governance/package.toml"
subject = "adoption-profile"
operation = "adopt"
authority = "primary"
lifecycle = "active"
subjects = [
  "adoption-profile",
  "adoption",
  "profile",
  "adapter",
  "external-repository",
  "adopter-boundary",
]
path_globs = [
  "docs/architecture/adoption-profiles.md",
  "docs/architecture/fleet-and-adopters.md",
  "src/ethos/repository/adoption/**",
  "src/ethos/repository/profile*.py",
  "openspec/specs/adapters/**",
  "openspec/specs/repository-governance/**",
  "tests/unit/adoption/**",
]
intent_tokens = [
  "adopt",
  "adoption",
  "profile",
  "adapter",
  "adopter-boundary",
  "other repository",
  "external repo",
]
pre_reads = [
  "AGENTS.md",
  "docs/architecture/adoption-profiles.md",
  "docs/architecture/fleet-and-adopters.md",
]
during_rules = [
  "profile changes proof depth and adapters, not command semantics",
  "durable adopter truth must be promoted into tracked repository surfaces",
]
post_checks = [
  "ethos prove --root <repo> --full --json",
  "ethos status --json",
]
requires = ["ethos-repository-governance"]
boundary = "workflow-package-projection"
