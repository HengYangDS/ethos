schema_version = 2
id = "ethos-adoption-profile-governance"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = ["SKILL.md"]
exclude = [".DS_Store"]
required_sections = ["When to Use", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:d53fb7203fcd9dec676858de87e51d9e1521df7794cfbe2184778a7f2a82ea15"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.adopt"
kind = "command_mutation_guarded"
command = ["ethos", "adopt", "--json"]
guard = "read-only unless --apply and --authorize are present; apply requires explicit head-bound authorization"

[[capability]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]

[[capability]]
id = "ethos.playbooks.check"
kind = "command_readonly"
command = ["ethos", "playbooks", "check", "--mode", "v2-strict", "--json"]

[[capability]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]

[[capability]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--json"]
