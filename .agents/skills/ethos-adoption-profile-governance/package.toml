guard = "read-only unless --apply and --authorize are present; apply requires explicit head-bound authorization"

[[capability]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]

[[capability]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--root", "<repo>", "--full", "--json"]
