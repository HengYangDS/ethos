schema_version = 2
id = "ethos-change-lifecycle"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = [
  "SKILL.md",
  "scripts/readiness.py",
  "references/verdicts-and-gaps.md",
]
required_sections = ["When to Use", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:10d1480c90380fc8d7e2d1028fd9a94405006ceefbfbfc8ea9fd533b1a6be729"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]

[[capability]]
id = "ethos.plan"
kind = "command_readonly"
command = ["ethos", "plan", "--changed", "--json"]

[[capability]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--json"]

[[capability]]
id = "ethos.land"
kind = "command_mutation_guarded"
command = ["ethos", "land", "--json"]
guard = "ethos lane prewrite before land; land verdict gates the candidate fast-forward"

[[capability]]
id = "ethos.publish"
kind = "command_mutation_guarded"
command = ["ethos", "publish", "--json"]
guard = "local readiness is read-only; proposal mutation requires an immutable request, exact HEAD, live peer observations, and explicit authorization"
