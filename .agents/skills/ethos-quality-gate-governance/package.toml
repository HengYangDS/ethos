schema_version = 2
id = "ethos-quality-gate-governance"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = [
  "SKILL.md",
  "scripts/quality_audit.py",
  "references/gate-design.md",
]
exclude = [".DS_Store"]
required_sections = ["When to Use", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:1f71dbd5cdf9a5513ba824effa843b71925440dffc0afaa4ea47a1fcfe20a6a4"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.quality.types"
kind = "command_readonly"
command = ["ethos", "quality", "types", "--json"]

[[capability]]
id = "ethos.quality.docstrings"
kind = "command_readonly"
command = ["ethos", "quality", "docstrings", "--json"]

[[capability]]
id = "ethos.quality.module-layout"
kind = "command_readonly"
command = ["ethos", "quality", "module-layout", "--json"]

[[capability]]
id = "ethos.quality.coverage"
kind = "command_readonly"
command = ["ethos", "quality", "coverage", "--json"]

[[capability]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--execute", "--json"]

[[capability]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]
