schema_version = 2
id = "ethos-repository-governance"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = [
  "SKILL.md",
  "scripts/govern_check.py",
  "references/governance-map.md",
]
exclude = [".DS_Store"]
required_sections = ["When to Use", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:6c7d40dd5bc418d6963c6f2437c41cbf33ad8c01cb6d4f499cf51c762596130b"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]

[[capability]]
id = "ethos.plan"
kind = "command_readonly"
command = ["ethos", "plan", "--changed"]

[[capability]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--json"]

[[capability]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]
