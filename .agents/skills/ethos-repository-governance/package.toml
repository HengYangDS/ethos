schema_version = 2
id = "ethos-repository-governance"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = [
  "SKILL.md",
  "scripts/govern_check.py",
  "references/governance-map.md",
]
exclude = [".DS_Store"]
required_sections = ["When to Use", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:ae977d01321e8299deab37b649c9f20d4b9d0f54e56f78d016d7e5c4ba2ab2c8"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]

[[capability]]
id = "ethos.plan"
kind = "command_readonly"
command = ["ethos", "plan", "--changed", "--json"]

[[capability]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--json"]

[[capability]]
id = "repository.govern-check"
kind = "script_readonly"
command = ["scripts/govern_check.py", "--root", "."]
