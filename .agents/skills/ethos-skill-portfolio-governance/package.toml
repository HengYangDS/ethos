schema_version = 2
id = "ethos-skill-portfolio-governance"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = [
  "SKILL.md",
  "scripts/portfolio_audit.py",
  "references/portfolio-design.md",
]
exclude = [".DS_Store"]
required_sections = ["When to Use", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:c0dcf24f9f21a6d0952b98348219cb06c015e4baac85290ba2ee318228287d6b"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.playbooks.check"
kind = "command_readonly"
command = ["ethos", "playbooks", "check", "--mode", "v2-strict", "--json"]

[[capability]]
id = "ethos.playbooks.route"
kind = "command_readonly"
command = ["ethos", "playbooks", "route", "--changed", "--json"]

[[capability]]
id = "ethos.quality.projection-drift"
kind = "command_readonly"
command = ["ethos", "quality", "projection-drift", "--json"]

[[capability]]
id = "ethos.prove.playbooks-v2"
kind = "command_proof"
command = ["ethos", "prove", "--execute", "--gate", "playbooks-v2", "--json"]
