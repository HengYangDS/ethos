schema = "ethos-ci-template-consistency-v1"
owner = "ethos-quality-gate-governance"
[[projection]]
provider = "github"
kind = "cue"
projection = ".github/workflows/ci.yml"
required_owner_scripts = [
  "noxfile.py",
  "tools/ci/repository_hygiene.py",
]
[[projection]]
provider = "gitlab"
kind = "cue"
projection = ".gitlab-ci.yml"
required_owner_scripts = [
  "noxfile.py",
  "tools/ci/repository_hygiene.py",
]
[[forge_surface]]
provider = "github"
kind = "issue"
projection = ".github/ISSUE_TEMPLATE/task.md"
required_sections = ["subject", "intent", "contract", "acceptance", "evidence"]

[[forge_surface]]
provider = "github"
kind = "change"
projection = ".github/PULL_REQUEST_TEMPLATE.md"
required_sections = ["summary", "evidence", "governance"]

[[forge_surface]]
provider = "gitlab"
kind = "issue"
projection = ".gitlab/issue_templates/task.md"
required_sections = ["subject", "intent", "contract", "acceptance", "evidence"]

[[forge_surface]]
provider = "gitlab"
kind = "change"
projection = ".gitlab/merge_request_templates/default.md"
required_sections = ["summary", "evidence", "governance"]

[compiler]
source = ".config/ci/pipeline.cue"
supply = { config = ".config/mise/config.toml", lock = ".config/mise/mise.lock" }
inputs = { gate_registry = "system/repository-gates.toml", mise = ".config/mise/config.toml" }

# Generated supply binding, not an independent source signature or version selector.
# Refresh only from native generation; ordinary CI checks never acquire this material.
# The official mise executables of the bound version, digests from its SHASUMS256.txt.
[bootstrap]
version = "2026.11.14"

[bootstrap.executables]
linux-arm64 = "7bd3b2d5ffff077a7662ba186c09600e5b40c1eee9df0c264ed67642ce0a8698"
linux-x64 = "6fa596291e9758106f761fea4f8e7fac6c3e7ff4714d5c0b9a76e16068db14f6"
macos-arm64 = "ad39dddb61236cc546ecbd0294aa3fc72a5ae7f1f8c7e6dc6fd4211f99eb3b79"
macos-x64 = "7f38115f28c6cef9d344bc528670d1033d24a9385455013768e78ad6203d9791"
