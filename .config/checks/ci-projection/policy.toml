macos-arm64 = "8b9b3459f331bde1e7b830d829dddd7cda5a558063103e451fba9f976e91acdb"
macos-x64 = "a502913a19b7e2284ed9aa1f349434245929f0cd3ae53acfd300b0ad28043c71"
windows-arm64 = "4c3a5dd008ffceb0a002bae72817f3e4a9e945ed2db7d276d06f34f286f3e92d"
