macos-arm64 = "f3bb0e8cbe0217a0b52444ecc0042364563ddd1de0490313bb7e702ecab41a14"
macos-x64 = "9ec18c3684856ee5973ede3ba4f22ca962d29965f812af7622fe06b6516adb1f"
