macos-arm64 = "005b32b9c22ca9cb63ff9d35c74b3abe69c433e9ca655fea288ba3dcbe7e4918"
macos-x64 = "158cd8124bc1108efa6588679b87031c970f592230b618e11c409b55c58e7b27"
windows-arm64 = "e7a1d0bfea13eb19bdfa4d56eb26e7626eeacd180346717f338595975b11e9e9"
