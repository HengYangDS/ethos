schema = "ethos-ci-template-consistency-v1"
owner = "ethos-quality-gate-governance"
[[projection]]
provider = "github"
kind = "cue"
projection = ".github/workflows/ci.yml"
emulator_tool = "act"
emulator_event = "workflow_dispatch"
emulator_job = "quality"
emulator_image = "ghcr.io/catthehacker/ubuntu@sha256:62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf"
emulator_timeout_seconds = 1800
forbidden_log_patterns = [
  "(?:^|[ >])DeprecationWarning:",
  "(?:^|[ >])WARNING:",
]
required_owner_scripts = [
  "tools/ci/scripts/bootstrap-python.sh",
  "tools/ci/scripts/mise-install.sh",
  "noxfile.py",
  "tools/ci/repository_hygiene.py",
  "tools/ci/scripts/run-secrets-scan.sh",
  "tools/ci/scripts/run-head-bound-proof.sh",
]
[[projection]]
provider = "gitlab"
kind = "cue"
projection = ".gitlab-ci.yml"
emulator_tool = "gitlab-ci-local"
emulator_event = "pipeline"
emulator_job = "ethos:verify"
emulator_timeout_seconds = 1800
forbidden_log_patterns = [
  "(?:^|[ >])DeprecationWarning:",
  "(?:^|[ >])WARNING:",
]
required_owner_scripts = [
  "tools/ci/scripts/bootstrap-python.sh",
  "tools/ci/scripts/mise-install.sh",
  "noxfile.py",
  "tools/ci/repository_hygiene.py",
  "tools/ci/scripts/run-secrets-scan.sh",
  "tools/ci/scripts/run-head-bound-proof.sh",
]
[evidence]
local_github_emulator_dir = "build/evidence/local-ci/github"
local_gitlab_emulator_dir = "build/evidence/local-ci/gitlab"
hosted_status_claim_boundary = "local emulators MUST NOT claim hosted provider status"

[[forge_surface]]
provider = "github"
kind = "issue"
projection = ".github/ISSUE_TEMPLATE/task.md"
required_sections = ["subject", "intent", "contract", "acceptance", "evidence"]

[[forge_surface]]
provider = "github"
kind = "change"
projection = ".github/PULL_REQUEST_TEMPLATE.md"
required_sections = ["summary", "evidence", "governance"]

[[forge_surface]]
provider = "gitlab"
kind = "issue"
projection = ".gitlab/issue_templates/task.md"
required_sections = ["subject", "intent", "contract", "acceptance", "evidence"]

[[forge_surface]]
provider = "gitlab"
kind = "change"
projection = ".gitlab/merge_request_templates/default.md"
required_sections = ["summary", "evidence", "governance"]

[compiler]
source = ".config/ci/pipeline.cue"
supply = { config = ".config/mise/config.toml", lock = ".config/mise/mise.lock" }
inputs = { gate_registry = "system/gates.toml", node = ".config/mise/config.toml" }

# Generated supply binding, not an independent source signature or version selector.
# Refresh only from native generation; ordinary CI checks never acquire this material.
[bootstrap]
version = "2026.10.8"
sha256 = "891db2f217ec3d64768167f655a8afc925983969711286408f60ec3e5fd77525"
