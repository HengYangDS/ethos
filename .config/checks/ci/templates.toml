schema = "ethos-ci-template-consistency-v1"
owner = "ethos-quality-gate-governance"
[[projection]]
provider = "github"
template = ".config/ci/templates/hosted/github-actions.yml"
projection = ".github/workflows/ci.yml"
emulator_tool = "act"
emulator_event = "workflow_dispatch"
emulator_job = "quality"
emulator_image = "catthehacker/ubuntu:act-latest"
provider_specific_owner_scripts = { "tools/ci/scripts/run-actionlint.sh" = "GitHub workflow syntax is a GitHub-native property." }
forbidden_log_patterns = [
  "(?:^|[ >])DeprecationWarning:",
  "(?:^|[ >])WARNING:",
]
required_owner_scripts = [
  "tools/ci/scripts/bootstrap-python.sh",
  "tools/ci/scripts/run-config-lint.sh",
  "tools/ci/scripts/run-json-schema-check.sh",
  "tools/ci/scripts/run-shell-lint.sh",
  "tools/ci/scripts/run-markdown-lint.sh",
  "tools/ci/scripts/run-prose-check.sh",
  "tools/ci/scripts/run-import-linter.sh",
  "tools/ci/scripts/run-dependency-hygiene.sh",
  "tools/ci/scripts/run-docstring-coverage.sh",
  "tools/ci/scripts/run-module-layout.sh",
  "tools/ci/scripts/run-python-vulnerability-audit.sh",
  "tools/ci/scripts/run-repository-hygiene.sh",
  "tools/ci/scripts/run-product-boundary.sh",
  "tools/ci/scripts/run-secrets-scan.sh",
  "tools/ci/scripts/install-lychee.sh",
  "tools/ci/scripts/run-head-bound-proof.sh",
  "tools/ci/scripts/run-ci-template-check.sh",
  "tools/ci/scripts/run-actionlint.sh",
  "tools/ci/scripts/run-format-selection.sh",
  "tools/ci/scripts/run-architecture-projection-drift.sh",
  "tools/ci/scripts/run-runbook-registry-check.sh",
  "tools/ci/scripts/run-release-supply-chain.sh",
  "tools/ci/scripts/run-hosted-provider-observation.sh",
]
[[projection]]
provider = "gitlab"
template = ".config/ci/templates/hosted/gitlab-ci.yml"
projection = ".gitlab-ci.yml"
emulator_tool = "gitlab-ci-local"
emulator_event = "pipeline"
emulator_job = "ethos:lint"
emulator_image = "python:3.14"
provider_specific_owner_scripts = { "tools/ci/scripts/run-node-compatibility.sh" = "GitLab owns the explicit Node compatibility matrix; GitHub package proof covers the canonical npm artifact once.", "tools/ci/scripts/run-python-tests.sh" = "GitHub verify reaches the same test owner through the single HEAD-bound proof; GitLab exposes the owner as a native job." }
forbidden_log_patterns = [
  "(?:^|[ >])DeprecationWarning:",
  "(?:^|[ >])WARNING:",
]
required_owner_scripts = [
  "tools/ci/scripts/bootstrap-python.sh",
  "tools/ci/scripts/run-node-compatibility.sh",
  "tools/ci/scripts/run-config-lint.sh",
  "tools/ci/scripts/run-json-schema-check.sh",
  "tools/ci/scripts/run-shell-lint.sh",
  "tools/ci/scripts/run-markdown-lint.sh",
  "tools/ci/scripts/run-prose-check.sh",
  "tools/ci/scripts/run-import-linter.sh",
  "tools/ci/scripts/run-dependency-hygiene.sh",
  "tools/ci/scripts/run-docstring-coverage.sh",
  "tools/ci/scripts/run-module-layout.sh",
  "tools/ci/scripts/run-python-vulnerability-audit.sh",
  "tools/ci/scripts/run-repository-hygiene.sh",
  "tools/ci/scripts/run-product-boundary.sh",
  "tools/ci/scripts/run-secrets-scan.sh",
  "tools/ci/scripts/install-lychee.sh",
  "tools/ci/scripts/run-python-tests.sh",
  "tools/ci/scripts/run-head-bound-proof.sh",
  "tools/ci/scripts/run-ci-template-check.sh",
  "tools/ci/scripts/run-format-selection.sh",
  "tools/ci/scripts/run-architecture-projection-drift.sh",
  "tools/ci/scripts/run-runbook-registry-check.sh",
  "tools/ci/scripts/run-release-supply-chain.sh",
  "tools/ci/scripts/run-hosted-provider-observation.sh",
]
[evidence]
local_github_emulator_dir = "build/evidence/local-ci/github"
local_gitlab_emulator_dir = "build/evidence/local-ci/gitlab"
hosted_status_claim_boundary = "local emulators MUST NOT claim hosted provider status"

[[forge_surface]]
provider = "github"
kind = "issue"
projection = ".github/ISSUE_TEMPLATE/task.md"
required_sections = ["subject", "intent", "contract", "acceptance", "evidence"]

[[forge_surface]]
provider = "github"
kind = "change"
projection = ".github/PULL_REQUEST_TEMPLATE.md"
required_sections = ["summary", "evidence", "governance"]

[[forge_surface]]
provider = "gitlab"
kind = "issue"
projection = ".gitlab/issue_templates/task.md"
required_sections = ["subject", "intent", "contract", "acceptance", "evidence"]

[[forge_surface]]
provider = "gitlab"
kind = "change"
projection = ".gitlab/merge_request_templates/default.md"
required_sections = ["summary", "evidence", "governance"]
