# coverage.py config — owned by .config/checks/coverage/ (not pyproject.toml).
# CI and ETHOS proof invoke this file through tools/ci/scripts/run-python-tests.sh.
[run]
branch = True
source =
    packages/ethos/src/ethos
    packages/ethos-core/src/ethos_core
omit =
    */__pycache__/*

[report]
show_missing = True
skip_covered = False
fail_under = 95
precision = 2
exclude_also =
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    raise NotImplementedError
    except BaseException as exc:
