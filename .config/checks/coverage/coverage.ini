# coverage.py config — owned by .config/checks/coverage/ (not pyproject.toml).
# CI and ETHOS proof invoke this file through the repository Nox test sessions.
[run]
branch = True
patch = subprocess
source =
    src/ethos
omit =
    */__pycache__/*

[report]
show_missing = True
skip_covered = False
precision = 2
exclude_also =
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    raise NotImplementedError
    except BaseException as exc:
