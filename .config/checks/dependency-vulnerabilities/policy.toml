owner = "ethos-quality-gate-governance"
summary = "Native uv and npm audits cover both declared dependency locks."
runner = "uv run --frozen --offline python -m nox -s vulnerabilities"
timeout_seconds = 120

# Optional [[dispositions]] accept exact advisory/artifact risk, not clean audits.
# Identity fields: ecosystem (npm), advisory_url, package, version, integrity, nodes,
# lock_sha256. Authorization fields: scope, owner, approval_ref,
# host (exact native hostname), rationale, expires_at (native TOML offset datetime).
# For inBundle nodes without a child integrity, integrity binds the containing
# independently locked artifact reached through native inBundle ownership.
# Local-development requires exact host, lock, nodes and expiry; it never covers CI.
# Production-release can authorize the exact artifact across hosts and lock placements.
# Native adverse findings remain visible; no aggregate-name exclusions.
# Without a disposition, a finding that no official stable release fixes is reported,
# not blocking: every locked npm artifact that ships it (the bundling package for an
# inBundle component) already is its registry latest release, or a Python advisory's
# native fix versions name no newer stable release. Fixable or unobserved findings block.
