rationale = "Accepted by the owner on 2026-11-18 for this repository's own lock, which lock_sha256 binds: the record matches no other repository's lock, and it stops matching when this lock changes, so a supply move reads it again. The advisory names every picomatch release through 4.0.7 and no release fixes it. markdownlint-cli2 0.24.1 reaches picomatch 2.3.2 through globby, fast-glob and micromatch 4.0.8, each the registry's latest, and micromatch accepts the 2.x line alone, so no upgrade removes the artifact. The lock holds two more copies that the advisory names and this record does not cover: picomatch 4.0.7, the registry's latest, and the 4.0.5 that npm 12.2.3 bundles; each is reported and does not block while the release that owns it is the registry's latest. The artifact ships in the product: the Markdown lint gate runs it as a local command over the file names and the lint configuration of the governed repository that it judges, and it serves no request. Remove this record when a release fixes the advisory or the chain no longer holds the artifact."
expires_at = 2026-12-03T00:00:00+08:00

