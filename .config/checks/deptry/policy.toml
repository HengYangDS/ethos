schema = "ethos-deptry-policy-v1"
owner = "ethos-quality-gate-governance"
summary = "Dependency hygiene validates the sole Python distribution."
runner = "uv run --frozen --offline python -m nox -s dependencies"

[[package]]
id = "ethos"
root = "src/ethos"
config = "pyproject.toml"
known_first_party = ["ethos", "noxfile"]
package_module_name_map = [
  "cel-expr-python=cel_expr_python",
  "nodejs-wheel-binaries=nodejs_wheel",
  "pyyaml=yaml",
]
