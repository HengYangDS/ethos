# Docstring coverage policy for ETHOS public product surfaces.
# Owned by .config/checks/docstrings/; CI invokes the ETHOS quality command.

paths = ["packages/ethos/src", "packages/ethos-core/src"]
fail_under = 95
skip_private = true
skip_init = false

# Keep the first gate intentional and non-noisy: product-visible commands,
# explicit public exports, and package boundary docstrings must explain intent.
surface_kinds = ["cli_command", "explicit_export", "package_boundary"]
exclude_roots = ["tests", "examples", "docs", "var", "build", "dist", ".venv"]
