schema = "ethos-format-selection-v1"
owner = "ethos-quality-gate-governance"
summary = "Fail-closed executable-carrier admission audit."
runner = "uv run --frozen --offline python -m nox -s format_selection"

[source_budget]
cross_check = { command = "scc", args = ["--no-cocomo", "--no-complexity", "--by-file", "--format", "json2", "--exclude-file=__never__", "--count-as", "c4:md,mmd:md", "."], timeout_seconds = 30, tolerance = { python_total = 2000, global_total = 3000 } }
terminal = { python_product = 40000, python_tests = 33000, python_tools = 4000, python_other = 200, global_total = 85000 }
aggregates = { python_total = ["python_product", "python_tests", "python_tools", "python_other"], global_total = ["python_product", "python_tests", "python_tools", "python_other", "markdown", "shell", "js", "toml", "yaml", "json", "ini", "diagram"] }
immutable_record_roots = ["evidence/", "openspec/changes/archive/"]
line_width = 100

[[format]]
extensions = [".lock", ".json", ".yaml", ".yml"]
carrier = "Dependency resolution evidence"
owner = "ecosystem-native package manager"
execution = "package-manager-specific verification"
truth_boundary = "generated dependency resolution, not hand-authored source"
[[format.budget]]
category = "dependency_resolution"
paths = [
  "*.lock",
  "**/*.lock",
  "*-lock.json",
  "**/*-lock.json",
  "*-lock.yaml",
  "**/*-lock.yaml",
  "*-lock.yml",
  "**/*-lock.yml",
  "npm-shrinkwrap.json",
  "**/npm-shrinkwrap.json",
]
accounting = "generated_evidence"

[[ownership]]
id = "official-openspec"
priority = 100
paths = ["openspec/config.yaml", "openspec/specs/**", "openspec/changes/*/**"]
exclude_paths = ["openspec/changes/archive/**"]
format_owner = "official-openspec"
format_command = "openspec owner-native mutation"
format_check = "uv run --frozen --offline python -m nox -s format_check"
validation_owner = "official-openspec"
validation_command = "ethos prove --gate openspec --json"
semantic_companions = ["markdownlint-cli2", "repository-hygiene"]
mutation_policy = "official-owner-only"

[[ownership]]
id = "archived-openspec-yaml"
priority = 100
paths = ["openspec/changes/archive/**/*.yaml", "openspec/changes/archive/**/*.yml"]
format_owner = "immutable-carrier"
format_command = "not-applicable:immutable"
format_check = "uv run --frozen --offline python -m nox -s repository_hygiene"
validation_owner = "repository-hygiene"
validation_command = "uv run --frozen --offline python -m nox -s repository_hygiene"
semantic_companions = ["official-openspec-history"]
mutation_policy = "forbidden"

[[ownership]]
id = "ruff"
extensions = [".py", ".pyi"]
format_owner = "ruff"
format_command = "uv run --frozen --offline python -m nox -s format -- python"
format_check = "uv run --frozen --offline python -m nox -s lint"
validation_owner = "ruff"
validation_command = "uv run --frozen --offline python -m nox -s lint"
mutation_policy = "native-formatter"

[[ownership]]
id = "markdownlint-cli2"
extensions = [".md"]
format_owner = "markdownlint-cli2"
format_command = "uv run --frozen --offline python -m nox -s format -- markdown"
format_check = "uv run --frozen --offline python -m nox -s markdown_lint"
validation_owner = "markdownlint-cli2"
validation_command = "uv run --frozen --offline python -m nox -s markdown_lint"
mutation_policy = "native-formatter"

[[ownership]]
id = "taplo"
extensions = [".toml"]
format_owner = "taplo"
format_command = "uv run --frozen --offline python -m nox -s format -- config"
format_check = "uv run --frozen --offline python -m nox -s config_quality"
validation_owner = "taplo"
validation_command = "uv run --frozen --offline python -m nox -s config_quality"
mutation_policy = "native-formatter"

[[ownership]]
id = "yaml"
extensions = [".yaml", ".yml"]
format_owner = "prettier"
format_command = "uv run --frozen --offline python -m nox -s format -- config"
format_check = "uv run --frozen --offline python -m nox -s config_quality"
validation_owner = "yamllint"
validation_command = "uv run --frozen --offline python -m nox -s config_quality"
mutation_policy = "native-formatter"

[[ownership]]
id = "canonical-json"
extensions = [".json"]
format_owner = "python-stdlib-json"
format_command = "uv run --frozen --offline python -m nox -s format -- config"
format_check = "uv run --frozen --offline python -m nox -s config_quality"
validation_owner = "python-stdlib-json"
validation_command = "uv run --frozen --offline python -m nox -s config_quality"
mutation_policy = "canonical-serializer"

[[ownership]]
id = "shell"
extensions = [".sh", ".bash", ".zsh"]
format_owner = "shfmt"
format_command = "uv run --frozen --offline python -m nox -s format -- shell"
format_check = "uv run --frozen --offline python -m nox -s shell_lint"
validation_owner = "shellcheck"
validation_command = "uv run --frozen --offline python -m nox -s shell_lint"
mutation_policy = "native-formatter"

[[ownership]]
id = "structured-ini"
extensions = [".ini", ".cfg"]
format_owner = "repository-canonical-text"
format_command = "uv run --frozen --offline python -m nox -s format -- hygiene"
format_check = "uv run --frozen --offline python -m nox -s repository_hygiene"
validation_owner = "tool-native-parser"
validation_command = "uv run --frozen --offline python -m nox -s config_quality"
mutation_policy = "canonical-text"

[[ownership]]
id = "uv-lock"
paths = ["uv.lock"]
format_owner = "uv"
format_command = "uv lock"
format_check = "uv lock --check"
validation_owner = "uv"
validation_command = "uv lock --check"
mutation_policy = "package-manager-only"

[[ownership]]
id = "npm-distribution"
extensions = [".js", ".mjs", ".cjs"]
format_owner = "prettier"
format_command = "uv run --frozen --offline python -m nox -s format -- javascript"
format_check = "uv run --frozen --offline python -m nox -s javascript_lint"
validation_owner = "prettier"
validation_command = "uv run --frozen --offline python -m nox -s javascript_lint"
semantic_companions = ["npm run test:npm"]
mutation_policy = "native-formatter"

[[ownership]]
id = "architecture-projection"
extensions = [".c4", ".mmd"]
format_owner = "architecture-generator"
format_command = "uv run --frozen --offline python -m nox -s architecture_projection"
format_check = "uv run --frozen --offline python -m nox -s architecture_projection"
validation_owner = "architecture-generator"
validation_command = "uv run --frozen --offline python -m nox -s architecture_projection"
mutation_policy = "generator-only"

[[ownership]]
id = "svg-assets"
extensions = [".svg"]
format_owner = "svgo"
format_command = "uv run --frozen --offline python -m nox -s format -- svg"
format_check = "uv run --frozen --offline python -m nox -s svg_lint"
validation_owner = "svgo"
validation_command = "uv run --frozen --offline python -m nox -s svg_lint"
mutation_policy = "native-formatter"

[[ownership]]
id = "png-assets"
extensions = [".png"]
format_owner = "source-binary"
format_command = "not-applicable:binary-source"
format_check = "uv run --frozen --offline python -m nox -s asset_validation"
validation_owner = "pillow"
validation_command = "uv run --frozen --offline python -m nox -s asset_validation"
mutation_policy = "source-or-generator"

[[ownership]]
id = "repository-hygiene"
paths = ["LICENSE", ".gitignore", "**/.gitignore", "**/.gitkeep", "**/.shellcheckrc"]
format_owner = "repository-canonical-text"
format_command = "uv run --frozen --offline python -m nox -s format -- hygiene"
format_check = "uv run --frozen --offline python -m nox -s repository_hygiene"
validation_owner = "repository-hygiene"
validation_command = "uv run --frozen --offline python -m nox -s repository_hygiene"
mutation_policy = "canonical-text"

[[format]]
extensions = [".py", ".pyi"]
carrier = "Python source"
owner = "ruff.toml"
execution = "uv run --frozen --offline python -m nox -s lint"
truth_boundary = "source"
budget = [
  { category = "python_product", paths = ["src/ethos/*"], measure = "python_ast", comment_prefixes = ["#"] },
  { category = "python_tests", paths = ["tests/*", "*/tests/*"], measure = "python_ast", comment_prefixes = ["#"] },
  { category = "python_tools", paths = ["tools/*"], measure = "python_ast", comment_prefixes = ["#"] },
  { category = "python_other", measure = "python_ast", comment_prefixes = ["#"] },
]

[[format]]
extensions = [".svg", ".png"]
carrier = "Brand presentation asset"
owner = "assets/brand/"
execution = "uv run --frozen --offline python -m nox -s format_selection"
truth_boundary = "repository-owned public presentation projection"

[[format]]
extensions = [".md"]
carrier = "Markdown"
owner = ".config/checks/markdown/.markdownlint-cli2.yaml"
execution = "uv run --frozen --offline python -m nox -s markdown_lint"
truth_boundary = "human docs and plans"
budget = [{ category = "markdown" }]

[[format]]
extensions = [".toml"]
carrier = "TOML"
owner = ".config/checks/taplo/taplo.toml"
execution = "uv run --frozen --offline python -m nox -s config_quality"
truth_boundary = "hand-authored config"
budget = [{ category = "toml", measure = "structured", baseline_measure = "lines", baseline_comment_prefixes = ["#"] }]

[[format]]
extensions = [".yml", ".yaml"]
carrier = "YAML"
owner = ".config/checks/yaml/yamllint.yaml"
execution = "uv run --frozen --offline python -m nox -s config_quality"
truth_boundary = "ecosystem-native projections only"
budget = [{ category = "yaml", measure = "structured", baseline_measure = "lines", baseline_comment_prefixes = ["#"] }]

[[format]]
extensions = [".json"]
carrier = "JSON"
owner = ".config/checks/json/format.toml"
execution = "uv run --frozen --offline python -m nox -s config_quality"
truth_boundary = "machine output, schemas, and external standards"
budget = [{ category = "json", measure = "structured", baseline_measure = "lines" }]

[[format]]
extensions = [".jsonl"]
carrier = "JSONL"
owner = "system/formats.toml"
execution = "report-only"
truth_boundary = "generated append-only streams, not tracked source of truth"

[[format]]
extensions = [".sh", ".bash", ".zsh"]
shebangs = ["sh", "bash", "zsh"]
carrier = "Shell"
owner = ".config/checks/shell/.shellcheckrc"
execution = "uv run --frozen --offline python -m nox -s shell_lint"
truth_boundary = "runner adapter scripts"
budget = [{ category = "shell", comment_prefixes = ["#"] }]

[[format]]
extensions = [".ini", ".cfg"]
carrier = "INI"
owner = "tool-native config owner"
execution = "tool-specific gate"
truth_boundary = "tool-native config"
budget = [{ category = "ini", measure = "structured", baseline_measure = "lines", baseline_comment_prefixes = ["#", ";"] }]

[[format]]
extensions = [".js", ".mjs", ".cjs"]
carrier = "JavaScript module"
owner = "npm distribution surface"
execution = "npm run test:npm"
truth_boundary = "distribution adapter"
budget = [{ category = "js", comment_prefixes = ["//"] }]

[[format]]
extensions = [".c4"]
carrier = "LikeC4 model"
owner = ".config/checks/architecture/projection.toml"
execution = "uv run --frozen --offline python -m nox -s architecture_projection"
truth_boundary = "architecture source projection input"
budget = [{ category = "diagram", comment_prefixes = ["#", "//", "%%"] }]

[[format]]
extensions = [".mmd"]
carrier = "Mermaid diagram"
owner = ".config/checks/architecture/projection.toml"
execution = "uv run --frozen --offline python -m nox -s architecture_projection"
truth_boundary = "generated architecture projection output"
budget = [{ category = "diagram", comment_prefixes = ["#", "//", "%%"] }]

[policy]
forbid_tracked_extensions = [".pickle", ".pkl", ".joblib"]
unregistered_extension = "block"
jsonl_allowed_roots = ["build/", ".ethos/state/"]
yaml_allowed_roots = [
  ".github/",
  ".gitlab-ci.yml",
  ".config/ci/",
  ".config/checks/",
  "openspec/",
  ".pre-commit-config.yaml",
]

[policy.extension_paths]
".ini" = { roots = [".config/"] }
".json" = { roots = [
  "system/schemas/",
  "system/openspec/",
  "tests/fixtures/",
  "evidence/",
  "distributions/npm/",
], files = [
  "package.json",
  "package-lock.json",
] }
".mjs" = { roots = ["distributions/npm/"] }
".c4" = { roots = [".config/checks/architecture/models/"] }
".mmd" = { roots = ["docs/architecture/_generated/"] }
".svg" = { roots = ["assets/brand/"] }
".png" = { roots = ["assets/brand/"] }
