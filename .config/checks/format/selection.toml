schema = "ethos-format-selection-v1"
owner = "ethos-quality-gate-governance"
summary = "Fail-closed executable-carrier admission audit."
runner = "tools/ci/scripts/run-format-selection.sh"

[source_budget]
aggregates = { python_total = ["python_product", "python_tests", "python_tools", "python_other"], global_total = ["python_product", "python_tests", "python_tools", "python_other", "shell", "js", "toml", "yaml", "json", "ini", "jinja", "diagram"] }

[[format]]
extensions = [".py", ".pyi"]
carrier = "Python source"
owner = ".config/checks/ruff/ruff.toml"
execution = "tools/ci/scripts/run-python-lint.sh"
truth_boundary = "source"
budget = [
  { category = "python_product", paths = ["packages/*/src/*"], measure = "python_ast", comment_prefixes = ["#"] },
  { category = "python_tests", paths = ["tests/*", "*/tests/*"], measure = "python_ast", comment_prefixes = ["#"] },
  { category = "python_tools", paths = ["tools/*"], measure = "python_ast", comment_prefixes = ["#"] },
  { category = "python_other", measure = "python_ast", comment_prefixes = ["#"] },
]

[[format]]
extensions = [".md"]
carrier = "Markdown"
owner = ".config/checks/markdown/.markdownlint-cli2.yaml"
execution = "tools/ci/scripts/run-markdown-lint.sh"
truth_boundary = "human docs and plans"

[[format]]
extensions = [".toml"]
carrier = "TOML"
owner = ".config/checks/taplo/taplo.toml"
execution = "tools/ci/scripts/run-config-lint.sh"
truth_boundary = "hand-authored config"
budget = [{ category = "toml", comment_prefixes = ["#"] }]

[[format]]
extensions = [".yml", ".yaml"]
carrier = "YAML"
owner = ".config/checks/yaml/yamllint.yaml"
execution = "tools/ci/scripts/run-config-lint.sh"
truth_boundary = "ecosystem-native projections only"
budget = [{ category = "yaml", comment_prefixes = ["#"] }]

[[format]]
extensions = [".json"]
carrier = "JSON"
owner = ".config/checks/json/format.toml"
execution = "tools/ci/scripts/run-config-lint.sh"
truth_boundary = "machine output, schemas, and external standards"
budget = [{ category = "json" }]

[[format]]
extensions = [".jsonl"]
carrier = "JSONL"
owner = "system/formats.toml"
execution = "report-only"
truth_boundary = "generated append-only streams, not tracked source of truth"

[[format]]
extensions = [".sh", ".bash", ".zsh"]
carrier = "Shell"
owner = ".config/checks/shell/.shellcheckrc"
execution = "tools/ci/scripts/run-shell-lint.sh"
truth_boundary = "runner adapter scripts"
budget = [{ category = "shell", comment_prefixes = ["#"] }]

[[format]]
extensions = [".ini", ".cfg"]
carrier = "INI"
owner = "tool-native config owner"
execution = "tools/ci/scripts/run-config-lint.sh or tool-specific gate"
truth_boundary = "tool-native config"
budget = [{ category = "ini", comment_prefixes = ["#", ";"] }]

[[format]]
extensions = [".lock"]
carrier = "Lockfile"
owner = "ecosystem-native package manager"
execution = "package-manager-specific verification"
truth_boundary = "dependency resolution evidence"

[[format]]
extensions = [".js", ".mjs", ".cjs"]
carrier = "JavaScript module"
owner = "npm distribution surface"
execution = "npm run test:npm"
truth_boundary = "distribution adapter"
budget = [{ category = "js", comment_prefixes = ["//"] }]

[[format]]
extensions = [".c4"]
carrier = "LikeC4 model"
owner = ".config/checks/architecture/projection.toml"
execution = "tools/ci/scripts/run-architecture-projection-drift.sh"
truth_boundary = "architecture source projection input"
budget = [{ category = "diagram", comment_prefixes = ["#", "//", "%%"] }]

[[format]]
extensions = [".mmd"]
carrier = "Mermaid diagram"
owner = ".config/checks/architecture/projection.toml"
execution = "tools/ci/scripts/run-architecture-projection-drift.sh"
truth_boundary = "generated architecture projection output"
budget = [{ category = "diagram", comment_prefixes = ["#", "//", "%%"] }]

[[format]]
extensions = [".j2", ".jinja", ".jinja2"]
carrier = "Jinja2 template"
owner = "packages/ethos/src/ethos/repository/adoption/scaffold/templates.py + template_files/manifest.toml"
execution = "tools/ci/scripts/run-python-tests.sh"
truth_boundary = "tracked scaffold declarations compiled through strict typed contexts"
budget = [{ category = "jinja", comment_prefixes = ["#"], comment_wrappers = [["{#", "#}"]] }]

[policy]
forbid_tracked_extensions = [".pickle", ".pkl", ".joblib"]
unregistered_extension = "block"
jsonl_allowed_roots = ["build/", ".ethos/state/"]
yaml_allowed_roots = [
  ".github/",
  ".gitlab-ci.yml",
  ".config/ci/",
  ".config/checks/",
  "openspec/",
  ".pre-commit-config.yaml",
]

[policy.extension_paths]
".ini" = { roots = [".config/"] }
".json" = { roots = [
  "system/schemas/",
  "evidence/parity/",
  "distributions/npm/",
], files = [
  "package.json",
  "package-lock.json",
  "evidence/chronicle/all-work-lanes-convergence-20260716/lane-inventory.json",
  "evidence/chronicle/all-lanes-convergence-replay-20260718/lane-resolution-matrix.json",
  "evidence/chronicle/all-lanes-authorized-closeout-20260718/current-lane-matrix.json",
  "evidence/chronicle/all-lanes-resolution-execution-20260718/lane-resolution-matrix.json",
] }
".j2" = { roots = ["packages/"] }
".mjs" = { roots = ["distributions/npm/"] }
".c4" = { roots = [".config/checks/architecture/models/"] }
".mmd" = { roots = ["docs/architecture/_generated/"] }
