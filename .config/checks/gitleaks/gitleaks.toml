title = "ETHOS gitleaks configuration"

# Secret-scanning policy for the governance runtime. The default gitleaks rule
# set is extended directly so upstream rule improvements flow in.
[extend]
useDefault = true

# Provider tokens have a prefix; legacy credential assignments remain covered
# by the inherited generic-api-key rule. A Git OID is not a provider token.
[[rules]]
id = "sourcegraph-access-token"
description = "Sourcegraph prefixed access token"
regex = '''(?i)\b(sgp_(?:[a-f0-9]{16}|local)_[a-f0-9]{40}|sgp_[a-f0-9]{40})\b'''
entropy = 3
keywords = ["sgp_"]

# A private-class network address in shared content tells every peer that receives it where
# another peer, or other internal infrastructure, lives. The regex is the paradigm's
# private_address pattern, byte for byte: it names address classes, never an address.
[[rules]]
id = "private-network-address"
description = "Private-class network address in shared content"
regex = '''(?i)(?:^|[^0-9a-z._])((?:10(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){2}))(?:$|[^0-9a-z.]|\.(?:$|[^0-9a-z]))|(?:^|[^0-9a-z.:_-])((?:f[cd][0-9a-f]{2}):[0-9a-f:]*[0-9a-f])(?:$|[^0-9a-z.:]|\.(?:$|[^0-9a-z]))|(?://|@)((?:[a-z0-9-]+\.)+(?:local|internal|lan|home\.arpa))(?:$|[^0-9a-z.-]|\.(?:$|[^0-9a-z]))|(?:^|[^0-9a-z._/@-])((?:[a-z0-9-]+\.)+(?:local|internal|lan|home\.arpa)):[0-9]'''
keywords = ["10.", "172.", "192.168", "fc", "fd", ".local", ".internal", ".lan", ".home.arpa"]
