# Import-linter contracts — enforce the terminal architecture invariants.
# Separated from pyproject.toml (SoC). Run: lint-imports --config .config/checks/import-linter/contracts.ini
#
# The single most load-bearing invariant: the pure kernel never depends on the
# product. A package with the wrong import direction is a cycle waiting to form;
# these contracts make the wrong direction a hard failure.

[importlinter]
root_packages =
    ethos_core
    ethos_contracts
    ethos_assistants
    ethos_adapters
    ethos_repository
    ethos

[importlinter:contract:kernel-purity-core]
name = ethos_core is a pure leaf (imports no other ethos package)
type = forbidden
source_modules =
    ethos_core
forbidden_modules =
    ethos_contracts
    ethos_assistants
    ethos_adapters
    ethos_repository
    ethos

[importlinter:contract:kernel-purity-contracts]
name = ethos_contracts is a pure leaf (imports no other ethos package)
type = forbidden
source_modules =
    ethos_contracts
forbidden_modules =
    ethos_core
    ethos_assistants
    ethos_adapters
    ethos_repository
    ethos

[importlinter:contract:layers]
name = ETHOS dependency layers (higher may import lower, never the reverse)
type = layers
layers =
    ethos
    ethos_repository
    ethos_adapters
    ethos_assistants
    ethos_contracts | ethos_core
containers =
