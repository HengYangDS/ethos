# Import-linter contracts — the terminal 2-package architecture.
# Run: lint-imports --config .config/checks/import-linter/contracts.ini
#
# The single load-bearing invariant: the pure kernel never depends on the product.

[importlinter]
root_packages =
    ethos_core
    ethos

[importlinter:contract:kernel-purity-core]
name = ethos_core is a pure leaf (never imports the product)
type = forbidden
source_modules =
    ethos_core
forbidden_modules =
    ethos

[importlinter:contract:layers]
name = ETHOS dependency layers (ethos over ethos_core, never the reverse)
type = layers
layers =
    ethos
    ethos_core
containers =
