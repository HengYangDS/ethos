schema = "ethos-local-state-audit-v1"
owner = "ethos-quality-gate-governance"
runner = "tools/ci/scripts/run-local-state-audit.sh"
summary = "Keep generated and host-local state out of durable repository truth."
output = "build/evidence/local-state/audit.json"

ignored_roots = [
  "build/",
  ".cache/",
  ".ethos/state/",
  "node_modules/",
  ".pytest_cache/",
  ".ruff_cache/",
]

forbidden_tracked_roots = [
  "build/",
  ".cache/",
  ".ethos/state/",
  "node_modules/",
]

allowed_state_placeholders = [
  ".ethos/state/.gitignore",
]
