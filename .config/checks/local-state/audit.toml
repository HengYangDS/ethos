schema = "ethos-local-state-audit-v1"
owner = "ethos-quality-gate-governance"
runner = "tools/ci/scripts/run-local-state-audit.sh"
summary = "Keep generated and host-local state out of durable repository truth."
output = "build/evidence/local-state/audit.json"

semantic_roots = [
  ".cache/local-state/",
  ".ethos/state/",
  "build/runtime/tool-cache/",
  "build/runtime/work/",
  "build/evidence/",
  "build/ethos/",
  "build/artifacts/",
]

ignored_roots = [
  "build/",
  ".cache/",
  ".ethos/state/",
  "node_modules/",
]

denied_root_cache_roots = [
  ".import_linter_cache/",
  ".import-linter-cache/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".mypy_cache/",
  ".tox/",
  ".nox/",
  ".uv-cache/",
]

forbidden_tracked_roots = [
  "build/",
  ".cache/",
  ".ethos/state/",
  "node_modules/",
]

allowed_state_placeholders = [
  ".ethos/state/.gitignore",
]
