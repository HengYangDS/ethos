# Prettier owns spacing, container layout and style.
# Native semantic lint uses YAML to preserve nested rule parameters.
---
globs:
  - "*.md"
  - .agents/**/*.md
  - .github/**/*.md
  - .gitlab/**/*.md
  - distributions/**/*.md
  - docs/**/*.md
  - openspec/**/*.md
  - rules/**/*.md
  - src/**/*.md
  - system/**/*.md
noInlineConfig: true
overrides:
  - filter:
      - openspec/**/*.md
    combine: replace
    config:
      default: false
      MD011: true
      MD014: true
      MD024: { siblings_only: true }
      MD025: true
      MD034: true
      MD040: true
      MD042: true
      MD044: true
      MD045: true
      MD051: true
      MD052: true
      MD053: true
      MD054: true
      MD056: true
      MD059: true
      whitespace: false
      blank_lines: false
      indentation: false
config:
  default: false
  MD001: true
  MD011: true
  MD014: true
  MD024: { siblings_only: true }
  MD025: true
  MD034: true
  MD040: true
  MD042: true
  MD044: true
  MD045: true
  MD051: true
  MD052: true
  MD053: true
  MD054: true
  MD056: true
  MD059: true
  whitespace: false
  blank_lines: false
  indentation: false
