schema = "ethos-mcp-smoke-v1"
owner = "ethos-quality-gate-governance"
runner = "tools/ci/scripts/run-mcp-smoke.sh"
summary = "MCP smoke checks projection configuration only; it does not treat MCP output as repository truth."

[boundary]
claim = "agent projection config is present and locally inspectable"
not_claimed = [
  "MCP server semantic correctness",
  "hosted provider status",
  "repository proof",
]

[[check]]
id = "surface-contract"
path = "system/surfaces.toml"
required_text = "name = \"mcp\""

[[check]]
id = "mcp-doc"
path = "docs/architecture/mcp-server.md"
required_text = "MCP"
