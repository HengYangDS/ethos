# Local command-performance and token-efficiency policy.
#
# Latency is assessed against a same-machine local baseline, not a universal
# millisecond threshold.  Output size remains an absolute contract because it
# is part of the reader experience for both people and agents.
schema_version = 2
latest_path = "build/evidence/quality/performance/latest.json"
baseline_path = "build/evidence/quality/performance/baseline.json"
samples = 5
warmup_samples = 1

[[commands]]
argv = ["status", "--json", "--compact"]
max_json_bytes = 4096
max_token_estimate = 1024
max_cold_regression_ratio = 1.25
max_hot_p95_regression_ratio = 1.25

[[commands]]
argv = ["report", "--json", "--compact"]
max_json_bytes = 6144
max_token_estimate = 1536
max_cold_regression_ratio = 1.25
max_hot_p95_regression_ratio = 1.25
