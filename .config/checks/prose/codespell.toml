owner = "ethos-quality-gate-governance"
summary = "Report-first spelling gate for human-facing docs and current governance surfaces."
runner = "uv run --frozen --offline python -m nox -s prose"
paths = [
  "README.md",
  "CONTRIBUTING.md",
  "AGENTS.md",
  "docs",
  "rules",
  "openspec/specs",
]

[tool.codespell]
# Verified library name used by the semantic-inference evaluation, not a typo.
ignore-words-list = "astroid"
