[pytest]
minversion = 8.0
addopts =
    --strict-config
    --strict-markers
    --import-mode=importlib
cache_dir = build/runtime/tool-cache/pytest
testpaths = tests
pythonpath =
    .
    packages/ethos/src
    packages/ethos-core/src
required_plugins =
    pytest-timeout
    pytest-cov
timeout = 120
timeout_method = thread
markers =
    unit: unit tests for deterministic product logic.
    architecture: repository architecture and boundary tests.
    integration: opt-in integration tests that may touch external providers.
    slow: opt-in slow tests excluded from fast local lanes unless explicitly selected.
    benchmark: opt-in performance benchmarks, never part of the default proof floor.
filterwarnings =
    error::ResourceWarning
