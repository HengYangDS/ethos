[pytest]
minversion = "9.0"
strict = true
addopts = ["--import-mode=importlib", "--numprocesses=auto", "--maxprocesses=12", "--dist=load", "--maxschedchunk=1", "--max-worker-restart=0", "--maxfail=1", "--failed-first", "--tb=short", "--durations=20"]
cache_dir = "build/runtime/tool-cache/pytest"
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
pythonpath = ["../../..", "../../../src"]
required_plugins = ["allure-pytest", "pytest-timeout", "pytest-cov", "pytest-xdist"]
timeout = "600"
faulthandler_timeout = "540"
markers = [
  "unit: unit tests for deterministic product logic.",
  "architecture: repository architecture and boundary tests.",
  "integration: opt-in integration tests that may touch external providers.",
  "slow: opt-in slow tests excluded from fast local lanes unless explicitly selected.",
  "benchmark: opt-in performance benchmarks, never part of the default proof floor.",
]
filterwarnings = ["error"]
