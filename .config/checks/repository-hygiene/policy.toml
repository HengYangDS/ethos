# Repository hygiene policy.
#
# This file owns repo-shape hygiene knobs. The owner script executes this policy;
# CI providers, pre-commit hooks, and local CI are projections over that owner.

max_tracked_bytes = 1048576

text_suffixes = [
  ".cfg",
  ".css",
  ".html",
  ".ini",
  ".js",
  ".json",
  ".md",
  ".py",
  ".pyi",
  ".sh",
  ".toml",
  ".txt",
  ".yaml",
  ".yml",
]
text_names = ["AGENTS.md", "CHANGELOG.md", "CONTRIBUTING.md", "README.md"]

# Host-local desktop residue is not repository truth. These files often hide
# behind global Git ignores, so the gate scans the repository root directly.
root_host_residue = [".DS_Store", "Thumbs.db", "Desktop.ini"]
