# Ruff shared rule payload. The root `ruff.toml` is the Ruff SSOT because Ruff
# resolves path globs relative to the config file location. This file carries only
# reusable rule families and formatter policy.

line-length = 100
target-version = "py312"

# Format IS a quality/determinism gate (user: format 也是质量的一种; 代码确定性很重要).
# ruff format is enforced in CI (ruff format --check) so every file has one canonical
# shape — no formatting drift, deterministic diffs.
[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[lint]
# Broad rule set: raise the quality
# floor and make low-quality code unrepresentable. Correctness + determinism + elegance +
# security + exception hygiene + boolean-trap + private-access + logging.
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "PTH",
  "PT",
  "N",
  "A",
  "ISC",
  "FLY",
  "PERF",
  "TC",
  "TID",
  "PIE",
  "RUF",
  "C90",
  "PL",
  "TRY",
  "FBT",
  "SLF",
  "ARG",
  "PGH",
  "FURB",
  "G",
  "DTZ",
  "EM",
  "LOG",
  "BLE",
  "RSE",
  "SLOT",
  "PIE",
  "INP",
  "T20",
  "YTT",
  "ASYNC",
]
# Ratchet: correctness rules are enforced everywhere. A bounded set of
# pre-existing style/idiom debt is frozen here and must shrink as focused refactors
# dissolve legacy report reducers and wide command handlers. New code gets the full set.
ignore = [
  "PERF401", # manual list-comprehension: junk-drawer modules to be dissolved
  "TRY003",  # long exception messages: pervasive, low-value to reflow now
  "EM101",   # string-literal in exception: idiom churn, dissolves on rewrite
  "EM102",   # f-string in exception: same
  "PLR0913", # too-many-arguments: some command handlers legitimately wide
  "PLC0415", # import-not-at-top: lazy imports are the perf design (surface split)
  "PLR2004", # magic-value-comparison: pervasive in report reducers; ratchet debt
  "PLR0911", # too-many-return-statements: report reducers branch by verdict
  "PLR0912", # too-many-branches: existing report reducers; dissolves on split
  "PLR0915", # too-many-statements: same; C90 complexity already caps the worst
  "BLE001",  # blind-except: temporary defensive adapter debt; reduce case-by-case
  "ARG001",  # unused-function-argument: cyclopts/adapter signatures need the arg
  "ARG002",  # unused-method-argument: same (protocol conformance)
  "FBT001",  # bool positional arg: the CLI flag idiom (emit(result, json_output),
  # called 78x); FBT002/FBT003 stay armed for the worse cases
  "DTZ011", # date.today(): a calendar date (not a timestamp) needs no tz
  "SLF001", # private-member-access: all 410 are in tests reaching product internals;
  # product itself is SLF001-clean. A shrinking whole-repo ratchet (baseline 410) makes
  # the debt visible and bans product regressions, replacing the old blanket tests/** ignore.
  "PLR0402", # "from package import submodule" conflicts with ETHOS concrete-submodule
  # import discipline; module-layout owns that gate.
]

[lint.mccabe]
# Cyclomatic complexity cap — no function may branch beyond this (borrowed from
# the configured product complexity ceiling). Forces decomposition of tangled logic.
max-complexity = 10

[lint.isort]
# One import per line keeps diffs and grep line-addressable. Absolute imports only
# (TID enforces the ban on relative). All current and historical ethos package names
# are treated as first-party so archived evidence and migration fixtures stay stable.
force-single-line = true
known-first-party = [
  "ethos",
  "ethos_adapters",
  "ethos_assistants",
  "ethos_contracts",
  "ethos_core",
  "ethos_quality",
  "ethos_repository",
  "ethos_test",
]

[lint.pydocstyle]
# Google style is the admitted structured-docstring convention. The dedicated
# ETHOS docstring gate owns coverage and signature checks so Ruff does not become
# a second truth center.
convention = "google"
