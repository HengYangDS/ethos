# Ruff configuration — separated from pyproject.toml per separation-of-concerns
# (system/tools.toml decides WHY ruff runs; this file decides HOW).
# Referenced from pyproject.toml via [tool.ruff] extend = ".config/checks/ruff/ruff.toml".

line-length = 100
target-version = "py312"

# Format IS a quality/determinism gate (user: format 也是质量的一种; 代码确定性很重要).
# ruff format is enforced in CI (ruff format --check) so every file has one canonical
# shape — no formatting drift, deterministic diffs.
[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[lint]
# Maximalist rule set toward di-effect's 57-family posture (道: raise the quality
# floor, make low-quality unrepresentable). Correctness + determinism + elegance +
# security + exception hygiene + boolean-trap + private-access + logging.
select = [
    "E", "W", "F", "I", "UP", "B", "SIM",
    "C4", "RET", "PTH", "PT", "N", "A", "ISC", "FLY", "PERF", "TC", "TID", "PIE", "RUF",
    "C90",
    "PL", "TRY", "FBT", "SLF", "ARG", "PGH", "FURB", "G", "DTZ", "EM", "LOG",
    "BLE", "RSE", "SLOT", "PIE", "INP", "T20", "YTT", "ASYNC",
]
# Ratchet: correctness rules enforced everywhere, zero tolerance. A small set of
# pre-existing STYLE/idiom debt is frozen (not permanent — dissolves as modules are
# rewritten during the surface split). New code gets the full set.
ignore = [
    "PERF401",  # manual list-comprehension: junk-drawer modules to be dissolved
    "TRY003",   # long exception messages: pervasive, low-value to reflow now
    "EM101",    # string-literal in exception: idiom churn, dissolves on rewrite
    "EM102",    # f-string in exception: same
    "PLR0913",  # too-many-arguments: some command handlers legitimately wide
    "PLC0415",  # import-not-at-top: lazy imports are the perf design (surface split)
    "PLR2004",  # magic-value-comparison: pervasive in report reducers; ratchet debt
    "PLR0911",  # too-many-return-statements: report reducers branch by verdict
    "PLR0912",  # too-many-branches: existing report reducers; dissolves on split
    "PLR0915",  # too-many-statements: same; C90 complexity already caps the worst
    "BLE001",   # blind-except: DELIBERATE defensive adapter boundaries (see plan.py
                # rule_fact_snapshot — every source is isolated so one failure can't
                # sink the snapshot; each is marked pragma: no cover)
    "ARG001",   # unused-function-argument: cyclopts/adapter signatures need the arg
    "ARG002",   # unused-method-argument: same (protocol conformance)
    "FBT001",   # bool positional arg: the CLI flag idiom (emit(result, json_output),
                # called 78x); FBT002/FBT003 stay armed for the worse cases
    "DTZ011",   # date.today(): a calendar date (not a timestamp) needs no tz
]

[lint.mccabe]
# Cyclomatic complexity cap — no function may branch beyond this (borrowed from
# di-effect's max-complexity=10). Forces decomposition of tangled logic.
max-complexity = 10

[lint.isort]
# Decision §4.3 (see .ethos/quality-regime-decision.md): one import per line, so
# diffs and grep stay clean and import-churn is line-addressable. Absolute imports
# only (TID enforces the ban on relative). All ethos packages are first-party.
force-single-line = true
known-first-party = [
    "ethos",
    "ethos_adapters",
    "ethos_assistants",
    "ethos_contracts",
    "ethos_core",
    "ethos_quality",
    "ethos_repository",
    "ethos_test",
]

# NOTE: per-file-ignores stay in pyproject.toml — ruff resolves their glob paths
# relative to the config file's own directory, so root-relative patterns
# (tests/**, packages/...) only match correctly from the project-root pyproject.
