schema = "ethos-runbook-registry-v1"
owner = "ethos-quality-gate-governance"
registry = "docs/reference/runbook-registry.md"
runner = "uv run --frozen --offline python -m nox -s runbook_registry"

[[entry]]
id = "RUN-CI-TEMPLATES"
command = "uv run --frozen --offline python -m nox -s ci_templates"
category = "provider-projection"
evidence = "JSON stdout"

[[entry]]
id = "RUN-GITHUB-EMULATOR"
command = "ETHOS_LOCAL_EMULATOR_DRY_RUN=1 tools/ci/scripts/run-github-local-emulator.sh doctor"
category = "provider-emulator"
evidence = "build/evidence/local-ci/github/doctor.json"

