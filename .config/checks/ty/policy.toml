# ty type-check gate policy — separated from pyproject.toml (SoC: system/tools.toml
# decides WHY ty runs; this file records the enforcement tiers).
#
# Type checking is the biggest determinism lever. Current two-package topology:
#
#   ZERO-TOLERANCE (must always be 0 diagnostics):
#     - packages/ethos-core
#
#   RATCHET (frozen baseline; may only shrink):
#     - packages/ethos (65 baseline)
#
# The gate (ethos quality types) runs `ty check` per package and compares against
# these baselines: zero-tolerance packages fail on ANY diagnostic; ratchet packages
# fail only if the count exceeds baseline. Baselines are lowered as debt is paid.

[zero_tolerance]
packages = [
  "packages/ethos-core",
]

[ratchet]
"packages/ethos" = 65
