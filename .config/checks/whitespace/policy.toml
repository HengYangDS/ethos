schema_version = 1
id = "structural-whitespace"
owner = "ethos-quality-gate-governance"

[policy]
max_consecutive_blank_lines = 1
forbid_leading_blank_lines = true
forbid_trailing_blank_lines = true

[assets]
shared_extensions = [
  ".c4",
  ".cfg",
  ".css",
  ".html",
  ".ini",
  ".j2",
  ".js",
  ".json",
  ".mjs",
  ".mmd",
  ".rst",
  ".txt",
]
shell_extensions = [".sh"]
shell_filenames = ["pre-commit", "pre-push", "reference-transaction"]
plain_filenames = [".gitattributes", ".gitignore", "LICENSE"]
openspec_markdown_roots = ["openspec/changes/", "openspec/specs/"]

[selection]
excluded_roots = [".agents/skills/", "build/", "evidence/", "openspec/changes/archive/"]
