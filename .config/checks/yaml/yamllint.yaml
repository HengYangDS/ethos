extends: default

rules:
  document-start: disable
  indentation:
    indent-sequences: consistent
  line-length:
    allow-non-breakable-words: true
    max: 160
  new-lines:
    type: unix
  empty-lines:
    max: 1
    max-start: 0
    max-end: 0
  trailing-spaces: enable
  truthy:
    allowed-values: ["false", "no", "off", "on", "true", "yes"]
    check-keys: false
