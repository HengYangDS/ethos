stages:
  - local

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: build/runtime/tool-cache/uv
  ETHOS_LOCAL_PROVIDER_EMULATOR: gitlab-ci-local

ethos:local-owner-gates:
  stage: local
  image: python:3.12
  before_script:
    - tools/ci/scripts/bootstrap-python.sh
  script:
    - tools/ci/scripts/run-local-ci.sh
    - tools/ci/scripts/run-ci-template-check.sh
