---
name: ETHOS CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - 'proposal/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONWARNINGS: error
  UV_LINK_MODE: copy
  UV_CACHE_DIR: build/runtime/tool-cache/uv
  LYCHEE_CACHE_DIR: build/runtime/tool-cache/lychee
  ETHOS_CI_TOOL_CACHE_DIR: build/runtime/tool-cache/ci-tools

jobs:
  host-conformance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.7.0"
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.2"
      - name: Install locked runtimes
        run: npm ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Execute wheel conformance
        run: uv run --frozen python -m nox -s host_conformance
      - name: Upload host conformance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-conformance-${{ matrix.os }}-py${{ matrix.python }}
          path: build/evidence/local-install/smoke.json
          if-no-files-found: error

  quality:
    name: quality gates
    runs-on: [self-hosted, macOS, ARM64, "${{ vars.ETHOS_GITHUB_RUNNER_LABEL }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          # The macOS host globally arms ETHOS ref-transaction hooks. Checkout must
          # establish the immutable CI ref before this job can configure its own
          # governed checkout, so disable only that inherited hook for this action.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.2"
      - name: Bootstrap Python and OpenSpec
        run: tools/ci/scripts/bootstrap-python.sh
      - name: Python lint
        run: uv run --frozen --offline python -m nox -s lint
      - name: Type policy
        run: >-
          tools/ci/scripts/with-python-runtime.sh -- uv run --group dev ethos prove --execute
          --gate python-types --expect-head "$(git rev-parse HEAD)" --json
      - name: Import boundaries
        run: uv run --frozen --offline python -m nox -s import_boundaries
      - name: Dependency hygiene
        run: uv run --frozen --offline python -m nox -s dependencies
      - name: Config lint
        run: uv run --frozen --offline python -m nox -s config_quality
      - name: JSON schema hygiene
        run: uv run --frozen --offline python -m nox -s schemas
      - name: Repository hygiene
        run: uv run --frozen --offline python -m nox -s repository_hygiene
      - name: Product boundary
        run: uv run --frozen --offline python -m nox -s product_boundary
      - name: Shell lint
        run: uv run --frozen --offline python -m nox -s shell_lint
      - name: Docstring coverage
        run: uv run --frozen --offline python -m nox -s docstrings
      - name: Module layout
        run: uv run --frozen --offline python -m nox -s module_layout
      - name: Python vulnerability audit
        run: uv run --frozen --offline python -m nox -s vulnerabilities
      - name: Secrets scan
        run: tools/ci/scripts/run-secrets-scan.sh
      - name: External links
        run: >-
          tools/ci/scripts/install-lychee.sh && tools/ci/scripts/with-python-runtime.sh -- uv run ethos prove --execute
          --gate external-links --expect-head "$(git rev-parse HEAD)" --json
      - name: Markdown lint
        run: uv run --frozen --offline python -m nox -s markdown_lint
      - name: Prose spelling
        run: uv run --frozen --offline python -m nox -s prose
      - name: CI projection drift
        run: uv run --frozen --offline python -m nox -s ci_templates
      - name: GitHub workflow syntax
        run: tools/ci/scripts/run-actionlint.sh
      - name: Format selection boundary
        run: uv run --frozen --offline python -m nox -s format_selection
      - name: Architecture projection drift
        run: uv run --frozen --offline python -m nox -s architecture_projection
      - name: Runbook registry
        run: uv run --frozen --offline python -m nox -s runbook_registry
      - name: Hosted provider observation envelope
        run: tools/ci/scripts/run-hosted-provider-observation.sh

  verify:
    name: repository proof
    runs-on: [self-hosted, macOS, ARM64, "${{ vars.ETHOS_GITHUB_RUNNER_LABEL }}"]
    needs: quality
    env:
      # Two workers bound host pressure while keeping the full proof graph fast.
      ETHOS_TEST_WORKERS: "2"
      # pytest-timeout thread mode ends a timed-out xdist worker with os._exit(1).
      # This macOS-only projection keeps a finite bound while preserving a normal
      # pytest failure and teardown path for diagnosis.
      ETHOS_TEST_TIMEOUT_SECONDS: "300"
      ETHOS_TEST_TIMEOUT_METHOD: "signal"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          # See quality: the source-controlled admission hook is armed after checkout.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.2"
      - name: Bootstrap Python and OpenSpec
        run: tools/ci/scripts/bootstrap-python.sh
      - name: Configure governed checkout
        run: tools/ci/scripts/configure-git-checkout.sh
      - name: Arm write admission
        run: tools/ci/scripts/with-python-runtime.sh -- uv run ethos hook install --json
      - name: OpenSpec strict validation
        run: openspec validate --all --strict --json
      - name: HEAD-bound proof receipt
        run: tools/ci/scripts/run-head-bound-proof.sh
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ethos-proof-receipt
          path: |
            build/evidence/quality/proof/
            build/evidence/quality/readiness/
          if-no-files-found: error

  package:
    name: package artifacts
    runs-on: [self-hosted, macOS, ARM64, "${{ vars.ETHOS_GITHUB_RUNNER_LABEL }}"]
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          # Prevent the runner host's global hook from vetoing the initial checkout.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.2"
      - name: Bootstrap Python and OpenSpec
        run: tools/ci/scripts/bootstrap-python.sh
      - name: Build Python distributions
        run: uv run --frozen --offline python -m nox -s build
      - name: Generate SPDX SBOM
        run: uv run --frozen --offline python -m nox -s supply_chain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: |
            build/artifacts/python/
            build/evidence/release/
