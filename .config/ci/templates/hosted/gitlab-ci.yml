stages:
  - quality
  - verify
  - package

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  LYCHEE_CACHE_DIR: build/cache/lychee
  ETHOS_CI_TOOL_CACHE_DIR: build/cache/ci-tools

cache:
  key: ${CI_PROJECT_PATH_SLUG}
  paths:
    - .uv-cache/
    - build/cache/lychee/
    - build/cache/ci-tools/

# Auto-retry every job on infrastructure failures only (image-pull timeouts to
# Docker Hub, runner crashes, API hiccups) — the runner's egress to external
# registries is intermittently flaky, and a governance gate that goes red on a
# transient pull is noise, not a real breach. Never retries script_failure, so a
# genuine gate breach still fails the pipeline.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure

# The quality stage runs every registered gate so a red gate fails CI — not just a
# subset. Gates: ruff (broad rule families + format), ty (types), import-linter
# (architecture), docstrings, product-boundary/contributor policy, bandit
# (security), gitleaks (secrets), config (TOML/YAML format+lint), shell lint,
# markdown lint, lychee (doc links), provider projection drift, local emulator
# boundaries, format selection, architecture projection, runbook/MCP smoke,
# closeout evidence, local-state, and release supply-chain checks.
# A gate that does not run in CI is not a gate.
.python_setup: &python_setup
  image: python:3.12
  before_script:
    - tools/ci/scripts/bootstrap-python.sh

ethos:lint:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-python-lint.sh

ethos:types:
  <<: *python_setup
  stage: quality
  script:
    # `ethos quality types` enforces EVERY ty policy tier (.config/checks/ty/
    # policy.toml): zero-tolerance packages must be 0 diagnostics, ratchet packages
    # must stay within their baseline (which may only shrink). Fail-closed via the
    # verdict->exit binding, so a breach fails the pipeline.
    - uv run --all-packages --group dev ethos quality types --json

ethos:architecture:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-import-linter.sh

ethos:config:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-config-lint.sh

ethos:hygiene:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-repository-hygiene.sh


ethos:product-boundary:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-product-boundary.sh

ethos:shell:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-shell-lint.sh

ethos:docstrings:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-docstring-coverage.sh


ethos:module-layout:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-module-layout.sh

ethos:security:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-bandit.sh

ethos:secrets:
  <<: *python_setup
  stage: quality
  script:
    # Secret scanning via gitleaks (prebuilt binary installed by the runner).
    # Policy: root .gitleaks.toml. A tracked secret fails the pipeline.
    - tools/ci/scripts/run-secrets-scan.sh
  artifacts:
    when: always
    paths:
      - build/evidence/quality/secrets/

ethos:docs-links:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/install-lychee.sh
    - uv run --package ethos ethos quality markdown-links --json

ethos:markdown:
  <<: *python_setup
  stage: quality
  script:
    # Markdown lint via markdownlint-cli2 (Node CLI installed by the runner on
    # the layer-cached python:3.12 image). Policy: .config/checks/markdown/.
    - tools/ci/scripts/run-markdown-lint.sh

ethos:ci-projections:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-ci-template-check.sh

ethos:github-workflow-syntax:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-actionlint.sh

ethos:format-selection:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-format-selection.sh

ethos:architecture-projection:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-architecture-projection-drift.sh

ethos:runbook-registry:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-runbook-registry-check.sh

ethos:mcp-smoke:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-mcp-smoke.sh

ethos:closeout-evidence-manifest:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-closeout-evidence-manifest.sh

ethos:local-state-audit:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-local-state-audit.sh

ethos:release-supply-chain:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-release-supply-chain.sh

ethos:verify:
  <<: *python_setup
  stage: verify
  script:
    # Make the runner checkout a real governed ETHOS working copy: wire the git
    # identity and signing from .ethos/workspace.toml [commit_policy] and arm
    # write-admission, so the dogfood signature/audit/prove gates and tests see the
    # same setup a developer's checkout has.
    - tools/ci/scripts/configure-git-checkout.sh
    - uv run --package ethos ethos hook install --json
    - openspec --version
    - tools/ci/scripts/run-python-tests.sh
    - openspec validate --all --strict --json
    - uv run --package ethos ethos audit --json
    - uv run --package ethos ethos report --json
    - uv run --package ethos ethos prove --execute --expect-head "$(git rev-parse HEAD)" --json

ethos:npm:
  stage: verify
  # Runs on python:3.12 (kept layer-cached on the runner) with Node installed
  # from nodejs.org, because the node:24 Docker image is unreachable through this
  # runner's registry egress — see tools/ci/scripts/install-node.sh.
  image: python:3.12
  script:
    - tools/ci/scripts/install-node.sh
    - node --version
    - npm --version
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run ethos -- --version
    - npm run test:npm

ethos:package:
  <<: *python_setup
  stage: package
  script:
    - uv build --all-packages
  artifacts:
    when: always
    paths:
      - dist/

ethos:npm-package:
  stage: package
  # See ethos:npm — python:3.12 + install-node.sh avoids the unreachable
  # node:24 image.
  image: python:3.12
  script:
    - tools/ci/scripts/install-node.sh
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run test:npm
