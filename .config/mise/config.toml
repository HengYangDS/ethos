min_version = "2026.11.14"
[settings]
locked = true
# The repository's release age: a version that Mise resolves itself (not exact, not locked) is a
# release at least this old. Every tool below is exact and locked, so the line binds the next
# move that Mise resolves, such as `mise upgrade --bump`; an exact pin typed by hand is not
# checked.
minimum_release_age = "24h"
not_found_system_fallback = false
idiomatic_version_file_enable_tools = []
[tools]
node = "26.13.1"
python = "3.14.10"
uv = "0.13.8"
cue = "0.17.1"
go = "1.27.4"
"github:rhysd/actionlint" = "1.7.12"
"github:boyter/scc" = "4.1.0"
"github:gitleaks/gitleaks" = "8.30.1"
"github:anchore/syft" = "1.57.2"
# Grype publishes no Windows arm64 build; the release run scans on Linux.
"github:anchore/grype" = { version = "0.122.0", os = ["linux", "macos"] }
"github:vale-cli/vale" = "3.27.0"
[tasks.bootstrap]
description = "Synchronize the locked Python environment, native tools, npm packages and test fixtures"
run = [
  'uv sync --locked --no-install-project --group dev --python "{{tools.python.path}}"',
  'uv sync --locked --group dev --python "{{tools.python.path}}"',
  "uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale",
  "uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts",
  "uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .",
]
[tasks.check]
description = "Check formatting and lint findings without changing files"
run = "uv run --frozen python -m nox -s format_check"
[tasks.fix]
description = "Apply the common formatters and safe lint fixes"
run = "uv run --frozen python -m nox -s fix"

# npm's release age, in days: the environment outranks every npm configuration file, so a
# developer's own ~/.npmrc (registry, token, proxy) is still read and cannot loosen the age.
[env]
npm_config_min_release_age = "1"
