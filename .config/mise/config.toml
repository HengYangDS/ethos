min_version = "2026.10.24"
[settings]
locked = true
not_found_system_fallback = false
idiomatic_version_file_enable_tools = []
[tools]
node = "26.13.0"
python = "3.14.10"
cue = "0.17.1"
go = "1.27.3"
"github:rhysd/actionlint" = "1.7.12"
"github:boyter/scc" = "4.1.0"
"github:gitleaks/gitleaks" = "8.30.1"
"github:anchore/syft" = "1.55.0"
"github:vale-cli/vale" = "3.25.1"
[tasks.bootstrap]
description = "Synchronize the locked Python environment, native tools, npm packages and test fixtures"
run = [
  'uv sync --locked --no-install-project --group dev --python "{{tools.python.path}}"',
  'uv sync --locked --group dev --python "{{tools.python.path}}"',
  "uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale",
  "uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts",
  "uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .",
]
[tasks.check]
description = "Check formatting and lint findings without changing files"
run = "uv run --frozen python -m nox -s format_check"
[tasks.fix]
description = "Apply the common formatters and safe lint fixes"
run = "uv run --frozen python -m nox -s fix"
