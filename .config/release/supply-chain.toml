schema = "ethos-release-supply-chain-v1"
owner = "ethos-quality-gate-governance"
runner = ".venv/bin/nox -s supply_chain"
summary = "Syft emits SPDX 2.3 JSON for the exact built Python artifact; provenance remains a provider release concern."
output = "build/evidence/release/supply-chain.json"
sbom = "build/evidence/release/ethos.spdx.json"
artifact_glob = "build/artifacts/python/ethos-*.whl"
tool = "syft"
tool_version = "1.50.0"
format = "spdx-json"

[boundary]
claim = "the exact built wheel has a Syft-generated SPDX 2.3 JSON SBOM"
not_claimed = [
  "remote release published",
  "provenance emitted or signed",
  "SLSA conformance or level",
  "hosted CI passed",
]
