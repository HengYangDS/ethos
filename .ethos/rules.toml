[standards]
json_schema = true
slsa_attestation = "adapter"
in_toto = "attestation-envelope"
spdx = "artifact-metadata-adapter"
cdevents = "event-interchange-adapter"
opentelemetry_semantics = "adapter"
cue = "advanced-compiler"
opa = "policy-adapter"
dagger = "runner-adapter"
temporal = "service-runtime-adapter"
mcp = "agent-projection"

[determinism]
kernel_io = "forbidden"
action_graph = "required"
stable_json = "required"
sqlite_state = "local-only"

[formats]
user_config = "TOML"
machine_output = "JSON"
append_only_events = "JSONL"
local_state = "SQLite"
advanced_compiler = "CUE adapter"

[artifacts]
state_path = ".ethos/state/state.sqlite"
state_tracked_truth = false
durable_evidence_roots = ["docs/evidence", "claims"]
generated_outputs_tracked_truth = false

[quality.code_size]
# Hard rule: effective LOC (AST-computed, excluding blanks/comments/docstrings)
# per file must not exceed hard_effective_max_lines. NEW files get NO exception —
# they are blocked at the hard limit, making an over-large file impossible to land
# (forcing function, principle 2: failure-blocking moves upstream).
# Existing monoliths get a SHRINKING ratchet exception pinned to their current size:
# they may only shrink, never grow, until they drop under the hard limit and the
# exception is removed. Each exception is temporary and tracked toward the target.
hard_effective_max_lines = 400
default_effective_max_lines = 400
# Test files carry broad contract coverage; capped at a looser category limit
# (still bounded to prevent unbounded growth), not the product 400.
test_effective_max_lines = 1200

[[quality.code_size.exception]]
path = "packages/ethos/src/ethos/cli.py"
