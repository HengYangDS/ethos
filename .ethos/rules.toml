[standards]
json_schema = true
slsa_attestation = "adapter"
in_toto = "attestation-envelope"
spdx = "artifact-metadata-adapter"
cdevents = "event-interchange-adapter"
opentelemetry_semantics = "adapter"
cue = "advanced-compiler"
opa = "policy-adapter"
dagger = "runner-adapter"
temporal = "service-runtime-adapter"
mcp = "agent-projection"

[determinism]
kernel_io = "forbidden"
action_graph = "required"
stable_json = "required"
sqlite_state = "local-only"

[formats]
user_config = "TOML"
machine_output = "JSON"
append_only_events = "JSONL"
local_state = "SQLite"
advanced_compiler = "CUE adapter"

[artifacts]
state_path = ".ethos/state/state.sqlite"
state_tracked_truth = false
durable_evidence_roots = ["docs/evidence", "claims"]
generated_outputs_tracked_truth = false

[quality.code_size]
# Role-based effective-LOC limits (AST-computed, excluding blanks/comments/
# docstrings). Adopted from the di-effect module_layout study (see
# .ethos/quality-regime-decision.md §3.1): a flat "every file <=400" rule is crude
# — it forces a command aggregator and a logic module to the same bar. Instead:
#
#   role=logic   (domain/adapters/kernel reducers): soft 400 / hard 600
#   role=surface (CLI command groups / aggregators):  soft 800
#   role=test    (broad contract coverage):           soft/hard 1200
#
# A GLOBAL hard ceiling (global_hard_effective_max_lines) caps every file so a
# "surface" label cannot be an excuse for unbounded growth (forcing function,
# principle 2: failure-blocking moves upstream). NEW files get NO per-file
# exception — they are blocked at their role's hard limit. Existing monoliths keep
# a SHRINKING ratchet exception pinned to current size until they drop under the
# role hard limit. Split triggers (public functions / classes / flat siblings) are
# tracked in the decision doc; the mechanical gate here is size.
global_hard_effective_max_lines = 1200
hard_effective_max_lines = 600
default_effective_max_lines = 400
# Surface role: CLI command modules are legitimately larger thin wiring sheets
# (bind-args -> domain call -> emit), bounded but not held to the logic 400.
surface_effective_max_lines = 800
surface_path_globs = ["packages/ethos/src/ethos/cli.py", "packages/ethos/src/ethos/surface/**"]
# Test files carry broad contract coverage; capped at a looser category limit
# (still bounded to prevent unbounded growth), not the product 400.
test_effective_max_lines = 1200

