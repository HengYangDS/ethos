[standards]
json_schema = true
slsa_attestation = "adapter"
in_toto = "attestation-envelope"
spdx = "artifact-metadata-adapter"
cdevents = "event-interchange-adapter"
opentelemetry_semantics = "adapter"
cue = "advanced-compiler"
opa = "policy-adapter"
dagger = "runner-adapter"
temporal = "service-runtime-adapter"
mcp = "agent-projection"

[determinism]
kernel_io = "forbidden"
action_graph = "required"
stable_json = "required"
sqlite_state = "local-only"

[formats]
user_config = "TOML"
machine_output = "JSON"
append_only_events = "JSONL"
local_state = "SQLite"
advanced_compiler = "CUE adapter"

[artifacts]
state_path = ".ethos/state/state.sqlite"
state_tracked_truth = false
durable_evidence_roots = ["docs/evidence", "claims"]
generated_outputs_tracked_truth = false

[quality.code_size]
# Role-based effective-LOC limits (AST-computed, excluding blanks/comments/
# docstrings). Adopted from ETHOS module-layout policy and system axioms: a flat "every file <=400" rule is crude
# — it forces a command aggregator and a logic module to the same bar. Instead,
# one limit per role, calibrated to the repo's actual effective-LOC distribution
# (each limit sits near the role's p90–p95 so the genuine tail must split while
# cohesive mid-size modules stay whole):
#
#   role=logic   (domain/adapters/kernel reducers):   500
#   role=surface (CLI command groups / aggregators):  750
#   role=test    (broad contract coverage):          1000
#
# There is NO per-file exemption and NO soft/hard split: a governance runtime that
# forbids `# pragma: no cover` cannot ship a size-exemption table either. An
# over-limit file is decomposed into a semantic sub-package (rules/module_layout.md
# §1), never frozen at its current size.
default_effective_max_lines = 500
# Surface role: CLI command modules are legitimately larger thin wiring sheets
# (bind-args -> domain call -> emit), bounded but not held to the logic limit.
surface_effective_max_lines = 800
surface_path_globs = ["packages/ethos/src/ethos/cli.py", "packages/ethos/src/ethos/surface/**"]
# Test files carry broad contract coverage; capped at the same category limit as
# surface (still bounded to prevent unbounded growth), not the product limit.
test_effective_max_lines = 800

[gates.local-state-audit]
command = "tools/ci/scripts/run-local-state-audit.sh"
blocking = true

[[rule]]
id = "local-state-boundary"
risk = "local-state-truth-boundary"
paths = [
  ".config/checks/local-state/**",
  "tools/ci/local_state_audit.py",
  "tools/ci/scripts/run-local-state-audit.sh",
]
requires = ["local-state-audit"]
evidence = ["build/evidence/local-state/audit.json"]

[gates.quality-audit]
command = ".agents/skills/ethos-quality-gate-governance/scripts/quality_audit.py ."
blocking = true

[[rule]]
id = "quality-gate-governance"
risk = "quality-gate-owner-drift"
paths = [
  ".agents/skills/ethos-quality-gate-governance/**",
  ".config/checks/**",
  "tools/ci/scripts/**",
  "system/tools.toml",
]
requires = ["quality-audit"]
evidence = ["quality_gate_audit"]

[gates.skill-portfolio-audit]
command = ".agents/skills/ethos-skill-portfolio-governance/scripts/portfolio_audit.py ."
blocking = true

[[rule]]
id = "skill-portfolio-governance"
risk = "skill-package-projection-drift"
paths = [
  ".agents/skills/**",
  "rules/skills.md",
  "docs/governance/playbooks-and-skills.md",
]
requires = ["skill-portfolio-audit"]
evidence = ["skill_portfolio_audit"]
