[profiles]
active = ["generic"]

[standards]
json_schema = true
slsa_attestation = "adapter"
in_toto = "attestation-envelope"
spdx = "artifact-metadata-adapter"
mcp = "agent-projection"

[determinism]
kernel_io = "forbidden"
transition_plan = "required"
stable_json = "required"
sqlite_state = "local-only"

[formats]
user_config = "TOML"
machine_output = "JSON"
local_state = "SQLite"

[artifacts]
state_path = ".ethos/state/state.sqlite"
state_tracked_truth = false
durable_evidence_roots = ["evidence", "evidence/claims"]
generated_outputs_tracked_truth = false

[quality.code_size]
# Role-based effective-LOC limits (AST-computed, excluding blanks/comments/
# docstrings). Adopted from ETHOS module-layout policy and system axioms: a flat "every file <=400" rule is crude
# — it forces a command aggregator and a logic module to the same bar. Instead,
# one limit per role, calibrated to the repo's actual effective-LOC distribution
# (each limit sits near the role's p90–p95 so the genuine tail must split while
# cohesive mid-size modules stay whole):
#
#   role=logic   (domain/adapters/kernel reducers):  500
#   role=surface (CLI command groups / aggregators): 800
#   role=test    (broad contract coverage):          800
#
# There is NO per-file exemption and NO soft/hard split: a governance runtime that
# forbids `# pragma: no cover` cannot ship a size-exemption table either. An
# over-limit file is decomposed into a semantic sub-package (rules/module_layout.md
# §1), never frozen at its current size.
default_effective_max_lines = 500
# Surface role: CLI command modules are legitimately larger thin wiring sheets
# (bind-args -> domain call -> emit), bounded but not held to the logic limit.
surface_effective_max_lines = 800
surface_path_globs = [
  "src/ethos/cli.py",
  "src/ethos/surface/**",
]
# Test files carry broad contract coverage; capped at the same category limit as
# surface (still bounded to prevent unbounded growth), not the product limit.
test_effective_max_lines = 800

[[rule]]
id = "local-state-boundary"
owner = "repo-local"
authority_ref = ".ethos/rules.toml"
contract_ref = ".ethos/rules.toml"
subject = "local-state-truth-boundary"
severity = "advisory"
stop_condition = "local-state-truth-boundary"
profile_layers = []
path_globs = ["system/policies/generated-artifact-topology.toml", "src/ethos/contracts/artifacts/topology.py", "src/ethos/repository/policy/artifacts.py"]
required_gates = ["generated-artifacts"]
evidence_requirements = ["generated_artifact_topology"]

[[rule]]
id = "quality-gate-governance"
owner = "repo-local"
authority_ref = ".ethos/rules.toml"
contract_ref = ".ethos/rules.toml"
subject = "quality-gate-owner-drift"
severity = "advisory"
stop_condition = "quality-gate-owner-drift"
profile_layers = []
path_globs = [".agents/skills/ethos-quality-gate-governance/**", ".config/checks/**", "tools/ci/scripts/**", "system/tools.toml"]
required_gates = ["repository-audit"]

[[rule]]
id = "skill-portfolio-governance"
owner = "repo-local"
authority_ref = ".ethos/rules.toml"
contract_ref = ".ethos/rules.toml"
subject = "skill-package-projection-drift"
severity = "advisory"
stop_condition = "skill-package-projection-drift"
profile_layers = []
path_globs = [".agents/skills/**", "rules/skills.md", "docs/governance/playbooks-and-skills.md"]
required_gates = ["playbooks-v2"]
