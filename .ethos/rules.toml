[profiles]
active = ["generic"]

[standards]
json_schema = true
slsa_attestation = "adapter"
in_toto = "attestation-envelope"
spdx = "artifact-metadata-adapter"
mcp = "agent-projection"

[determinism]
kernel_io = "forbidden"
transition_plan = "required"
stable_json = "required"
sqlite_state = "local-only"

[formats]
user_config = "TOML"
machine_output = "JSON"
local_state = "SQLite"

[artifacts]
state_tracked_truth = false
generated_outputs_tracked_truth = false

[quality.code_size]
# Product logic and CLI surfaces share one ceiling; transport is not a reason
# to accumulate orchestration. Tests have a separate ceiling for cohesive cases.
# Exceedance requires semantic consolidation, not role reassignment, cosmetic
# compression, per-file exemptions or raising the limit to fit existing files.
default_effective_max_lines = 500
surface_effective_max_lines = 500
surface_path_globs = [
  "src/ethos/cli.py",
  "src/ethos/surface/**",
]
test_effective_max_lines = 800

[[rule]]
id = "local-state-boundary"
owner = "repo-local"
authority_ref = ".ethos/rules.toml"
contract_ref = ".ethos/rules.toml"
subject = "local-state-truth-boundary"
severity = "advisory"
stop_condition = "local-state-truth-boundary"
profile_layers = []
path_globs = ["src/ethos/contracts/artifacts/topology.toml", "src/ethos/contracts/artifacts/topology.py", "src/ethos/repository/policy/artifacts.py"]
required_gates = ["generated-artifacts"]
evidence_requirements = ["generated_artifact_topology"]

[[rule]]
id = "quality-gate-governance"
owner = "repo-local"
authority_ref = ".ethos/rules.toml"
contract_ref = ".ethos/rules.toml"
subject = "quality-gate-owner-drift"
severity = "advisory"
stop_condition = "quality-gate-owner-drift"
profile_layers = []
path_globs = [".agents/skills/ethos-quality-gate-governance/**", ".config/checks/**", "tools/ci/scripts/**", "system/gates.toml"]
required_gates = ["repository-audit"]

[[rule]]
id = "skill-portfolio-governance"
owner = "repo-local"
authority_ref = ".ethos/rules.toml"
contract_ref = ".ethos/rules.toml"
subject = "skill-package-projection-drift"
severity = "advisory"
stop_condition = "skill-package-projection-drift"
profile_layers = []
path_globs = [".agents/skills/**", "rules/skills.md", "docs/governance/skills.md"]
required_gates = ["skills"]
