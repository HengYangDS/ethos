[branch_roles]
release_branch = "main"
accepted_branch = "dev"
candidate_branch = "candidate/dev"
work_branch_prefix = "work/"
submit_branch_prefix = "submit/"

[commit_policy]
# ETHOS-as-adopter binds its own forge identity here so the product code stays
# identity-agnostic. This must match the GitLab account that signs commits, or the
# forge marks them Unverified.
expected_name = "Yang HENG"
expected_email = "heng.yang.ds@hotmail.com"
subject_pattern = "^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\\([a-z0-9-]+\\))?: .+"
signing_required = true
signing_format = "ssh"

[[package]]
name = "ethos-core"
path = "packages/ethos-core"
domains = [
  "kernel",
  "action-graph",
  "state-machine",
  "schemas",
  "contracts",
  "quality",
  "proof-policy",
]

[[package]]
name = "ethos"
path = "packages/ethos"
domains = [
  "cli",
  "ux",
  "adapters",
  "repository-lifecycle",
  "assistants",
  "playbooks",
  "execution",
  "local-state",
  "conformance",
  "fixtures",
]
