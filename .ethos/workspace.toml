[branch_roles]
release_branch = "main"
accepted_branch = "dev"
candidate_branch = "candidate/dev"
work_branch_prefix = "work/"
submit_branch_prefix = "submit/"

[[package]]
name = "ethos-core"
path = "packages/ethos-core"
domains = ["kernel", "action-graph", "state-machine"]

[[package]]
name = "ethos-contracts"
path = "packages/ethos-contracts"
domains = ["schemas", "contracts", "protocols"]

[[package]]
name = "ethos-repository"
path = "packages/ethos-repository"
domains = ["repository-lifecycle", "quality", "evidence", "release"]

[[package]]
name = "ethos-assistants"
path = "packages/ethos-assistants"
domains = ["assistants", "playbooks", "context", "projection"]

[[package]]
name = "ethos-adapters"
path = "packages/ethos-adapters"
domains = ["providers", "workspace-io", "execution", "local-state"]

[[package]]
name = "ethos"
path = "packages/ethos"
domains = ["cli", "ux"]

[[package]]
name = "ethos-test"
path = "packages/ethos-test"
domains = ["conformance", "parity", "fixtures"]
