[branch_roles]
release_branch = "main"
accepted_branch = "dev"
candidate_branch = "candidate/dev"
release_mirror = "accepted_ff"
work_branch_prefix = "work/"
proposal_branch_prefix = "proposal/"
canonical_sibling_worktrees = true

[commit_policy]
# ETHOS is organization-native rather than author-native. The product ships with
# no built-in person as semantic authority; each governed repository declares the
# contributor set, roles, and bot identities it trusts.
subject_pattern = "^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\\([a-z0-9-]+\\))?: .+"
signing_required = true
signing_format = "ssh"
identity_mode = "external"

[[commit_policy.allowed_identities]]
role = "maintainer"
name = "ETHOS Maintainers"
email = "maintainers@example.invalid"

[[commit_policy.allowed_identities]]
role = "team"
name = "ETHOS Contributor Team"
email = "contributors@example.invalid"

[[commit_policy.allowed_identities]]
role = "bot"
name = "ETHOS Automation"
email = "ethos-bot@example.invalid"
