name: ETHOS CI
"on":
  pull_request: null
  push:
    branches:
      - dev
      - main
      - proposal/**
  workflow_dispatch:
    inputs:
      supply_image:
        description: Build the locked Linux ARM64 CI supply image
        required: false
        type: boolean
        default: false
      release_tag:
        description: Qualify and publish this signed pre-release tag
        required: false
        type: string
        default: ""
      release_head:
        description: The exact commit that the release tag signs
        required: false
        type: string
        default: ""
permissions:
  contents: read
env:
  PYTHONWARNINGS: error
  UV_LINK_MODE: copy
  UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
  ETHOS_CI_TOOL_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/ci-tools
jobs:
  supply-image:
    name: locked Linux ARM64 supply
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.supply_image }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check the supply definition
        run: docker buildx build --check --platform linux/arm64 --file .config/ci/supply/Dockerfile --build-context workspace=. .
      - name: Accept the supply offline against this checkout
        run: docker buildx build --platform linux/arm64 --file .config/ci/supply/Dockerfile --target smoke --build-context workspace=. .
      - name: Build the supply image
        run: docker buildx build --platform linux/arm64 --file .config/ci/supply/Dockerfile --target supply --tag ghcr.io/hengyangds/ethos-ci-supply:${{ github.sha }} --load .
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the supply image
        run: docker push ghcr.io/hengyangds/ethos-ci-supply:${{ github.sha }}
      - name: Inspect the published supply image
        run: docker buildx imagetools inspect ghcr.io/hengyangds/ethos-ci-supply:${{ github.sha }}
  host-conformance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Node 26.12.0
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.supply_image && !inputs.release_tag }}
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/runtime/python
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          python-version: ${{ matrix.python }}
      - name: Provision native Python image supply
        run: uv python install --no-bin ${{ matrix.python }}
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Prepare locked native build supply
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B tools/ci/toolchain/native.py --root . --mise vale
      - name: Install locked npm packages
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Execute wheel conformance
        run: uv run --frozen python -m nox -s host_conformance
      - name: Execute npm launcher
        run: uv run --frozen python -B -m tools.ci.toolchain.npm run ethos -- --version
      - name: Execute native npm package tests
        run: uv run --frozen python -m nox -s javascript_tests
      - name: Upload host conformance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-conformance-${{ matrix.os }}-py${{ matrix.python }}
          path: build/evidence/local-install/smoke.json
          if-no-files-found: error
  quality:
    name: quality gates
    runs-on: ubuntu-24.04-arm
    if: ${{ !inputs.supply_image && !inputs.release_tag }}
    env:
      ETHOS_COMMIT_ALLOWED_SIGNERS: ${{ vars.ETHOS_COMMIT_ALLOWED_SIGNERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Prepare locked native tool supply
        run: uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale
      - name: Install locked npm packages
        run: uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Provision test fixture supply
        run: uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: Admit pushed commit range
        if: github.event_name == 'push'
        run: uv run --frozen --offline --no-sync python -B -I -m ethos.cli hook commit-range --target-ref "${{ github.ref }}" --proposed-head "${{ github.sha }}" --remote-head "${{ github.event.before }}" --remote origin --root . --json
      - name: Admit pull request commit range
        if: github.event_name == 'pull_request'
        run: uv run --frozen --offline --no-sync python -B -I -m ethos.cli hook commit-range --target-ref "refs/heads/${{ github.event.pull_request.base.ref }}" --proposed-head "${{ github.event.pull_request.head.sha }}" --remote-head "${{ github.event.pull_request.base.sha }}" --remote origin --root . --json
      - name: HEAD-bound hosted verification receipt
        run: uv run --frozen --offline --no-sync python -m nox -s hosted_verification
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ethos-proof-receipt
          path: |
            build/evidence/quality/proof/
            build/evidence/quality/tests/pytest/junit*.xml
            build/evidence/quality/tests/coverage/coverage.xml
            build/evidence/quality/tests/allure/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions
          if-no-files-found: error
          path: |
            build/artifacts/python/
            build/evidence/release/
  external-links:
    name: external link health
    runs-on: ubuntu-latest
    if: ${{ !inputs.supply_image && !inputs.release_tag }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Prepare locked native tool supply
        run: uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale
      - name: Install locked npm packages
        run: uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Provision test fixture supply
        run: uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: External links
        run: uv run --frozen --offline --no-sync python -m nox -s external_links
      - name: Upload external link observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ethos-external-link-health
          path: build/evidence/quality/external-links/report.json
          if-no-files-found: error
  verify:
    name: repository proof
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ always() && !inputs.supply_image && !inputs.release_tag }}
    steps:
      - name: Require successful hosted execution and artifact publication
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
  package:
    name: package artifacts
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ always() && !inputs.supply_image && !inputs.release_tag }}
    steps:
      - name: Require successful hosted execution and artifact publication
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
  release-platforms:
    name: release runtime ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '' }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      ETHOS_COMMIT_ALLOWED_SIGNERS: ${{ vars.ETHOS_COMMIT_ALLOWED_SIGNERS }}
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/runtime/python
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Prepare locked native build supply
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B tools/ci/toolchain/native.py --root . --mise vale
      - name: Install locked npm packages
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: Build the release wheel its signed tag admits
        run: uv run --frozen python -m nox -s build -- --release --expect-head ${{ inputs.release_head }} --tag ${{ inputs.release_tag }}
      - name: Qualify the release wheel and retain its runtime archive
        run: uv run --frozen python -m nox -s install_smoke -- --release --expect-head ${{ inputs.release_head }} --tag ${{ inputs.release_tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-runtime-${{ matrix.os }}
          path: |
            build/artifacts/release/python/
            build/artifacts/native/
            build/evidence/local-install/release-smoke.json
          if-no-files-found: error
  release-publish:
    name: release publication
    runs-on: ubuntu-latest
    needs: release-platforms
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: build/release/inputs
      - name: Assemble the qualified release assets
        run: uv run --no-project python -B -I tools/ci/delivery/release_assets.py --tag ${{ inputs.release_tag }} --source build/release/inputs --output build/release/out --base-url https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }} --changelog CHANGELOG.md
      - name: Publish the signed pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ inputs.release_tag }} --repo ${{ github.repository }} --prerelease --verify-tag --title "ETHOS ${{ inputs.release_tag }}" --notes-file build/release/out/notes.md build/release/out/assets/*
