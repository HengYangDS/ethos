name: ETHOS CI
"on":
  pull_request: null
  push:
    branches:
      - dev
      - main
      - proposal/**
  schedule:
    - cron: 0 19 * * 6
  workflow_dispatch:
    inputs:
      supply_image:
        description: Build the locked Linux ARM64 CI supply image
        required: false
        type: boolean
        default: false
      release_tag:
        description: Qualify and publish this signed pre-release tag
        required: false
        type: string
        default: ""
      release_head:
        description: The exact commit that the release tag signs
        required: false
        type: string
        default: ""
      journey_tag:
        description: Qualify this published pre-release on the adopter journey alone
        required: false
        type: string
        default: ""
      journey_previous:
        description: Comma-separated earlier published pre-release tags that the journey upgrades from; empty selects the latest earlier published release
        required: false
        type: string
        default: ""
      scan_tag:
        description: Report the binary advisories of this published release's inventories alone
        required: false
        type: string
        default: ""
      qualify_head:
        description: Qualify this exact commit, the head of the dispatching ref, on every platform and Python version
        required: false
        type: string
        default: ""
      windows_legs:
        description: Add the Windows host conformance legs to this run
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/proposal/') || github.event_name == 'pull_request') && format('{0}-{1}', github.workflow, github.ref) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true
env:
  PYTHONWARNINGS: error
  UV_LINK_MODE: copy
  UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
  ETHOS_CI_TOOL_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/ci-tools
jobs:
  supply-image:
    name: locked Linux ARM64 supply
    if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/proposal/')) && inputs.supply_image }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check the supply definition
        run: docker buildx build --check --platform linux/arm64 --file .config/ci/supply/Dockerfile --build-context workspace=. .
      - name: Accept the supply offline against this checkout
        run: docker buildx build --platform linux/arm64 --file .config/ci/supply/Dockerfile --target smoke --build-context workspace=. .
      - name: Build the supply image
        run: docker buildx build --platform linux/arm64 --file .config/ci/supply/Dockerfile --target supply --tag ghcr.io/hengyangds/ethos-ci-supply:${{ github.sha }} --load .
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the supply image
        run: docker push ghcr.io/hengyangds/ethos-ci-supply:${{ github.sha }}
      - name: Inspect the published supply image
        run: docker buildx imagetools inspect ghcr.io/hengyangds/ethos-ci-supply:${{ github.sha }}
  commit-policy:
    name: commit policy
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    timeout-minutes: 20
    env:
      ETHOS_COMMIT_ALLOWED_SIGNERS: ${{ vars.ETHOS_COMMIT_ALLOWED_SIGNERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Prepare locked native tool supply
        run: uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale
      - name: Install locked npm packages
        run: uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Provision test fixture supply
        run: uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: Admit pushed commit range
        if: github.event_name == 'push'
        run: uv run --frozen --offline --no-sync python -B -I -m ethos.cli hook commit-range --target-ref "${{ github.ref }}" --proposed-head "${{ github.sha }}" --remote-head "${{ github.event.before }}" --remote origin --root . --json
      - name: Admit pull request commit range
        if: github.event_name == 'pull_request'
        run: uv run --frozen --offline --no-sync python -B -I -m ethos.cli hook commit-range --target-ref "refs/heads/${{ github.event.pull_request.base.ref }}" --proposed-head "${{ github.event.pull_request.head.sha }}" --remote-head "${{ github.event.pull_request.base.sha }}" --remote origin --root . --json
  host-conformance:
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    if: ${{ !inputs.supply_image && !inputs.release_tag && !inputs.journey_tag && !inputs.scan_tag && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (inputs.qualify_head == '' || inputs.qualify_head == github.sha) }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/runtime/python
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.qualify_head != '') || github.event_name == 'schedule') && '[{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.12","timeout":40},{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.13","timeout":40},{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.14","timeout":40},{"platform":"macos-arm64","runner":"macos-latest","python":"3.12","timeout":40},{"platform":"macos-arm64","runner":"macos-latest","python":"3.13","timeout":40},{"platform":"macos-arm64","runner":"macos-latest","python":"3.14","timeout":40},{"platform":"windows-x64","runner":"windows-latest","python":"3.12","timeout":60},{"platform":"windows-x64","runner":"windows-latest","python":"3.13","timeout":60},{"platform":"windows-x64","runner":"windows-latest","python":"3.14","timeout":60},{"platform":"windows-arm64","runner":"windows-11-arm","python":"cpython-3.14-windows-x86_64-none","timeout":100}]' || inputs.windows_legs && '[{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.12","timeout":40},{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.13","timeout":40},{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.14","timeout":40},{"platform":"macos-arm64","runner":"macos-latest","python":"3.12","timeout":40},{"platform":"windows-x64","runner":"windows-latest","python":"3.12","timeout":60},{"platform":"windows-x64","runner":"windows-latest","python":"3.13","timeout":60},{"platform":"windows-x64","runner":"windows-latest","python":"3.14","timeout":60},{"platform":"windows-arm64","runner":"windows-11-arm","python":"cpython-3.14-windows-x86_64-none","timeout":100}]' || '[{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.12","timeout":40},{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.13","timeout":40},{"platform":"linux-x64","runner":"ubuntu-latest","python":"3.14","timeout":40},{"platform":"macos-arm64","runner":"macos-latest","python":"3.12","timeout":40}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: ${{ matrix.python }}
      - name: Provision native Python image supply
        run: uv python install --no-bin ${{ matrix.python }}
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Prepare locked native build supply
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B tools/ci/toolchain/native.py --root . --mise vale
      - name: Install locked npm packages
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Execute wheel conformance
        run: uv run --frozen python -m nox -s host_conformance
      - name: Declare the components of the kept runtime archive
        if: ${{ contains(fromJSON('["linux-x64 3.14","linux-arm64 3.14","macos-arm64 3.14","windows-x64 3.14","windows-arm64 cpython-3.14-windows-x86_64-none"]'), format('{0} {1}', matrix.platform, matrix.python)) }}
        run: uv run --frozen python -m nox -s supply_chain
      - name: Execute native npm package tests
        run: uv run --frozen python -m nox -s javascript_tests
      - name: Upload host conformance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-conformance-${{ matrix.platform }}-py${{ matrix.python }}
          path: |-
            build/evidence/local-install/smoke.json
            build/evidence/local-install/smoke.events.jsonl
          if-no-files-found: error
  quality:
    name: quality gates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 130
    if: ${{ !inputs.supply_image && !inputs.release_tag && !inputs.journey_tag && !inputs.scan_tag && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (inputs.qualify_head == '' || inputs.qualify_head == github.sha) }}
    env:
      ETHOS_COMMIT_ALLOWED_SIGNERS: ${{ vars.ETHOS_COMMIT_ALLOWED_SIGNERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Prepare locked native tool supply
        run: uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale
      - name: Install locked npm packages
        run: uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Provision test fixture supply
        run: uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: HEAD-bound hosted verification receipt
        run: uv run --frozen --offline --no-sync python -m nox -s hosted_verification
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ethos-proof-receipt
          path: |
            build/evidence/quality/proof/
            build/evidence/quality/tests/pytest/junit*.xml
            build/evidence/quality/tests/coverage/coverage.xml
            build/evidence/quality/tests/allure/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions
          if-no-files-found: error
          path: |
            build/artifacts/python/
            build/evidence/release/
  external-links:
    name: external link health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.supply_image && !inputs.release_tag && !inputs.journey_tag && !inputs.scan_tag && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (inputs.qualify_head == '' || inputs.qualify_head == github.sha) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Prepare locked native tool supply
        run: uv run --frozen python -B -m tools.ci.toolchain.native --root . --mise vale
      - name: Install locked npm packages
        run: uv run --frozen python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Provision test fixture supply
        run: uv run --frozen python -B -I tools/ci/toolchain/fixture_supply.py .
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: External links
        run: uv run --frozen --offline --no-sync python -m nox -s external_links
      - name: Upload external link observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ethos-external-link-health
          path: build/evidence/quality/external-links/report.json
          if-no-files-found: error
  hosted-checks:
    name: hosted checks
    runs-on: ubuntu-latest
    needs:
      - commit-policy
      - host-conformance
      - quality
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (!inputs.supply_image && !inputs.release_tag && !inputs.journey_tag && !inputs.scan_tag)) }}
    timeout-minutes: 5
    steps:
      - name: Require the expected result of every per-push job
        env:
          EXPECTED: ${{ needs.commit-policy.result == ((github.event_name == 'push' || github.event_name == 'pull_request') && 'success' || 'skipped') && needs.host-conformance.result == ((!inputs.supply_image && !inputs.release_tag && !inputs.journey_tag && !inputs.scan_tag && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (inputs.qualify_head == '' || inputs.qualify_head == github.sha)) && 'success' || 'skipped') && needs.quality.result == ((!inputs.supply_image && !inputs.release_tag && !inputs.journey_tag && !inputs.scan_tag && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (inputs.qualify_head == '' || inputs.qualify_head == github.sha)) && 'success' || 'skipped') }}
        run: test "$EXPECTED" = true
      - name: Require the head that the dispatch qualifies
        env:
          QUALIFIED: ${{ inputs.qualify_head == '' || inputs.qualify_head == github.sha }}
        run: test "$QUALIFIED" = true
  release-platforms:
    name: release runtime ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '' }}
    continue-on-error: ${{ !matrix.required }}
    env:
      ETHOS_COMMIT_ALLOWED_SIGNERS: ${{ vars.ETHOS_COMMIT_ALLOWED_SIGNERS }}
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/runtime/python
    strategy:
      fail-fast: false
      matrix:
        host:
          - linux-x64
          - linux-arm64
          - macos-arm64
          - windows-x64
          - windows-arm64
        include:
          - host: linux-x64
            os: ubuntu-latest
            python: "3.14"
            required: true
            emulated: false
          - host: linux-arm64
            os: ubuntu-24.04-arm
            python: "3.14"
            required: true
            emulated: false
          - host: macos-arm64
            os: macos-latest
            python: "3.14"
            required: true
            emulated: false
          - host: windows-x64
            os: windows-latest
            python: "3.14"
            required: false
            emulated: false
          - host: windows-arm64
            os: windows-11-arm
            python: cpython-3.14-windows-x86_64-none
            required: false
            emulated: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: ${{ matrix.python }}
      - name: Provision native Python image supply
        run: uv python install --no-bin ${{ matrix.python }}
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Prepare locked native build supply
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B tools/ci/toolchain/native.py --root . --mise vale
      - name: Install locked npm packages
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Bind operator commit trust
        run: uv run --frozen python -B -m tools.ci.toolchain.commit_trust
      - name: Build the release wheel its signed tag admits
        run: uv run --frozen python -m nox -s build -- --release --expect-head ${{ inputs.release_head }} --tag ${{ inputs.release_tag }}
      - name: Qualify the release wheel and retain its runtime archive
        run: uv run --frozen python -m nox -s install_smoke -- --release --expect-head ${{ inputs.release_head }} --tag ${{ inputs.release_tag }}
      - name: Declare the components of the retained runtime archive
        run: uv run --frozen python -m nox -s supply_chain -- --host ${{ matrix.host }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-runtime-${{ matrix.host }}
          path: |
            build/artifacts/release/python/
            build/artifacts/native/
            build/evidence/local-install/release-smoke.json
            build/evidence/release/runtime.spdx.json
            build/evidence/release/runtime.syft.json
          if-no-files-found: error
  release-publish:
    name: release publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: release-platforms
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: build/release/inputs
      - name: Assemble the qualified release assets
        run: uv run --no-project python -B -I tools/ci/delivery/release_assets.py --tag ${{ inputs.release_tag }} --source build/release/inputs --output build/release/out --base-url https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }} --changelog CHANGELOG.md --expect-head ${{ inputs.release_head }} --required linux-x64,linux-arm64,macos-arm64 --optional windows-x64,windows-arm64
      - name: Attest the release archives and wheels
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |-
            build/release/out/assets/ethos-*.tar.gz
            build/release/out/assets/ethos-*.whl
            build/release/out/assets/ethos-*.spdx.json
            build/release/out/assets/ethos-*.syft.json
      - name: Publish the signed pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ inputs.release_tag }} --repo ${{ github.repository }} --prerelease --verify-tag --title "ETHOS ${{ inputs.release_tag }}" --notes-file build/release/out/notes.md build/release/out/assets/*
  release-binary-scan:
    name: release binary scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: release-publish
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '' && needs.release-publish.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.scan_tag != '')) }}
    continue-on-error: true
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/runtime/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: "3.14"
      - name: Provision native Python image supply
        run: uv python install --no-bin 3.14
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Prepare locked native build supply
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B tools/ci/toolchain/native.py --root . --mise vale
      - name: Install locked npm packages
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Scan the published runtime inventories
        run: uv run --frozen python -m nox -s release_binary_scan -- --tag ${{ inputs.release_tag || inputs.scan_tag }}
      - name: Upload the release binary scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-binary-scan
          path: build/evidence/release-binary-scan/
          if-no-files-found: error
  release-journey:
    name: release journey ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: release-publish
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '' && needs.release-publish.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.journey_tag != '')) }}
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/runtime/python
    strategy:
      fail-fast: false
      matrix:
        host:
          - linux-x64
          - macos-arm64
        include:
          - host: linux-x64
            os: ubuntu-latest
            python: "3.14"
            required: true
            emulated: false
          - host: macos-arm64
            os: macos-latest
            python: "3.14"
            required: true
            emulated: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.8
          python-version: ${{ matrix.python }}
      - name: Provision native Python image supply
        run: uv python install --no-bin ${{ matrix.python }}
      - name: Synchronize build-only Python dependencies
        run: uv sync --locked --no-install-project --group dev
      - name: Prepare locked native build supply
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B tools/ci/toolchain/native.py --root . --mise vale
      - name: Install locked npm packages
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev
      - name: Qualify the published pre-release on the adopter journey
        env:
          JOURNEY_PREVIOUS: ${{ inputs.journey_previous }}
        run: uv run --frozen python -m nox -s release_journey -- --tag ${{ inputs.release_tag || inputs.journey_tag }} --previous "$JOURNEY_PREVIOUS"
      - name: Upload the release journey receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-journey-${{ matrix.host }}
          path: build/evidence/release-journey/
          if-no-files-found: error
