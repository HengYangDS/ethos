stages:
  - quality
  - verify
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^proposal\/.+$/
    - when: never
variables:
  GIT_DEPTH: "0"
  PYTHONWARNINGS: error
  UV_LINK_MODE: copy
  UV_CACHE_DIR: /opt/ethos-supply/uv-cache
  ETHOS_CI_TOOL_CACHE_DIR: /opt/ethos-supply/tool-cache
  UV_PYTHON_INSTALL_DIR: /opt/ethos-supply/python
  NPM_CONFIG_CACHE: /opt/ethos-supply/npm-cache
  ETHOS_CI_SUPPLY_MANIFEST: /opt/ethos-supply/input.sha256
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"
default:
  tags:
    - ${ETHOS_GITLAB_RUNNER_TAG}
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - api_failure
      - scheduler_failure
ethos:commit-policy:
  image: ghcr.io/hengyangds/ethos-ci-supply@sha256:a2a8637a4106738307859fcef96f81053b347184b6ea30ff61c544185893980d
  before_script:
    - sha256sum --check --quiet "$ETHOS_CI_SUPPLY_MANIFEST"
    - uv sync --locked --offline --no-install-project --group dev
    - uv sync --locked --offline --no-build-isolation --group dev
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.native --root . --mise vale gitleaks scc syft
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts --offline
    - uv run --frozen --offline --no-sync python -B -I tools/ci/toolchain/fixture_supply.py .
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.commit_trust
  stage: quality
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      variables:
        ETHOS_COMMIT_TARGET_REF: refs/heads/${CI_COMMIT_BRANCH}
        ETHOS_COMMIT_PROPOSED_HEAD: ${CI_COMMIT_SHA}
        ETHOS_COMMIT_REMOTE_HEAD: ${CI_COMMIT_BEFORE_SHA}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_SHA && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA
      variables:
        ETHOS_COMMIT_TARGET_REF: refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
        ETHOS_COMMIT_PROPOSED_HEAD: ${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA}
        ETHOS_COMMIT_REMOTE_HEAD: ${CI_MERGE_REQUEST_TARGET_BRANCH_SHA}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DIFF_BASE_SHA
      variables:
        ETHOS_COMMIT_TARGET_REF: refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
        ETHOS_COMMIT_PROPOSED_HEAD: ${CI_COMMIT_SHA}
        ETHOS_COMMIT_REMOTE_HEAD: ${CI_MERGE_REQUEST_DIFF_BASE_SHA}
    - when: never
  script:
    - uv run --frozen --offline --no-sync python -B -I -m ethos.cli hook commit-range --target-ref "${ETHOS_COMMIT_TARGET_REF}" --proposed-head "${ETHOS_COMMIT_PROPOSED_HEAD}" --remote-head "${ETHOS_COMMIT_REMOTE_HEAD}" --remote origin --root . --json
ethos:host-conformance:
  image: ghcr.io/hengyangds/ethos-ci-supply@sha256:a2a8637a4106738307859fcef96f81053b347184b6ea30ff61c544185893980d
  before_script:
    - sha256sum --check --quiet "$ETHOS_CI_SUPPLY_MANIFEST"
    - uv sync --locked --offline --no-install-project --group dev
    - uv sync --locked --offline --no-build-isolation --group dev
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.native --root . --mise vale gitleaks scc syft
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts --offline
    - uv run --frozen --offline --no-sync python -B -I tools/ci/toolchain/fixture_supply.py .
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.commit_trust
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - '**/*'
        compare_to: refs/heads/dev
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  script:
    - uv run --frozen --offline --no-sync python -m nox -s host_conformance
  artifacts:
    when: always
    paths:
      - build/evidence/local-install/smoke.json
ethos:verify:
  image: ghcr.io/hengyangds/ethos-ci-supply@sha256:a2a8637a4106738307859fcef96f81053b347184b6ea30ff61c544185893980d
  before_script:
    - sha256sum --check --quiet "$ETHOS_CI_SUPPLY_MANIFEST"
    - uv sync --locked --offline --no-install-project --group dev
    - uv sync --locked --offline --no-build-isolation --group dev
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.native --root . --mise vale gitleaks scc syft
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts --offline
    - uv run --frozen --offline --no-sync python -B -I tools/ci/toolchain/fixture_supply.py .
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.commit_trust
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - '**/*'
        compare_to: refs/heads/dev
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  variables:
    GIT_STRATEGY: clone
    ETHOS_TEST_WORKERS: "4"
  script:
    - uv run --frozen --offline --no-sync python -m nox -s hosted_verification
  artifacts:
    when: always
    paths:
      - build/evidence/quality/proof/
      - build/evidence/quality/tests/pytest/junit*.xml
      - build/evidence/quality/tests/coverage/coverage.xml
      - build/evidence/quality/security/
      - build/evidence/quality/secrets/
      - build/artifacts/python/
      - build/evidence/release/
    reports:
      junit: build/evidence/quality/tests/pytest/junit*.xml
      coverage_report:
        coverage_format: cobertura
        path: build/evidence/quality/tests/coverage/coverage.xml
ethos:external-links:
  image: ghcr.io/hengyangds/ethos-ci-supply@sha256:a2a8637a4106738307859fcef96f81053b347184b6ea30ff61c544185893980d
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - '**/*'
        compare_to: refs/heads/dev
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  allow_failure: true
  before_script:
    - sha256sum --check --quiet "$ETHOS_CI_SUPPLY_MANIFEST"
    - uv sync --locked --offline --no-install-project --group dev
    - uv sync --locked --offline --no-build-isolation --group dev
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.native --root . --mise vale gitleaks scc syft
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts --offline
    - uv run --frozen --offline --no-sync python -B -I tools/ci/toolchain/fixture_supply.py .
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.commit_trust
  script:
    - uv run --frozen --offline --no-sync python -m nox -s external_links
  artifacts:
    when: always
    paths:
      - build/evidence/quality/external-links/report.json
ethos:npm:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - '**/*'
        compare_to: refs/heads/dev
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  variables:
    NODE_VERSION: 26.12.1
  image: ghcr.io/hengyangds/ethos-ci-supply@sha256:a2a8637a4106738307859fcef96f81053b347184b6ea30ff61c544185893980d
  before_script:
    - sha256sum --check --quiet "$ETHOS_CI_SUPPLY_MANIFEST"
    - uv sync --locked --offline --no-install-project --group dev
    - uv sync --locked --offline --no-build-isolation --group dev
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.native --root . --mise vale gitleaks scc syft
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts --offline
    - uv run --frozen --offline --no-sync python -B -I tools/ci/toolchain/fixture_supply.py .
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.commit_trust
  script:
    - uv run --frozen --offline --no-sync python -B -m tools.ci.toolchain.npm run ethos -- --version
    - uv run --frozen --offline --no-sync python -m nox -s javascript_tests
