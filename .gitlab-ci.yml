stages:
  - quality
  - verify
  - package

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

# Auto-retry every job on infrastructure failures only (image-pull timeouts to
# Docker Hub, runner crashes, API hiccups) — the runner's egress to external
# registries is intermittently flaky, and a governance gate that goes red on a
# transient pull is noise, not a real breach. Never retries script_failure, so a
# genuine gate breach still fails the pipeline.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure

# The quality stage runs every registered gate so a red gate fails CI — not just a
# subset. Gates: ruff (broad rule families + format), ty (types), import-linter
# (architecture), docstrings, bandit (security), config (TOML/YAML format+lint),
# shell lint, lychee (doc links), code-size (role-based LOC).
# 道: a gate that does not run in CI is not a gate.
.python_setup: &python_setup
  image: python:3.12
  before_script:
    - .config/ci/scripts/bootstrap-python.sh

ethos:lint:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/run-python-lint.sh

ethos:types:
  <<: *python_setup
  stage: quality
  script:
    # `ethos quality types` enforces EVERY ty policy tier (.config/checks/ty/
    # policy.toml): zero-tolerance packages must be 0 diagnostics, ratchet packages
    # must stay within their baseline (which may only shrink). Fail-closed via the
    # verdict->exit binding, so a breach fails the pipeline.
    - uv run --all-packages --group dev ethos quality types --json

ethos:architecture:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/run-import-linter.sh

ethos:config:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/run-config-lint.sh

ethos:hygiene:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/run-repository-hygiene.sh

ethos:shell:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/run-shell-lint.sh

ethos:docstrings:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/run-docstring-coverage.sh

ethos:security:
  <<: *python_setup
  stage: quality
  script:
    - uv run --no-project --with bandit bandit -r packages -c .config/checks/bandit/bandit.yaml --severity-level medium -q

ethos:docs-links:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/install-lychee.sh
    - uv run --package ethos ethos quality markdown-links --json

ethos:verify:
  <<: *python_setup
  stage: verify
  script:
    # Make the runner checkout a real governed ETHOS working copy: wire the git
    # identity and signing from .ethos/workspace.toml [commit_policy] and arm
    # write-admission, so the dogfood signature/audit/prove gates and tests see the
    # same setup a developer's checkout has.
    - .config/ci/scripts/configure-git-checkout.sh
    - uv run --package ethos ethos hook install --json
    - openspec --version
    - .config/ci/scripts/run-python-tests.sh
    - openspec validate --all --strict --json
    - uv run --package ethos ethos audit --json
    - uv run --package ethos ethos report --json
    - uv run --package ethos ethos prove --execute --expect-head "$(git rev-parse HEAD)" --json

ethos:npm:
  stage: verify
  image: node:24
  script:
    - node --version
    - npm --version
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run ethos -- --version
    - npm run test:npm

ethos:package:
  <<: *python_setup
  stage: package
  script:
    - uv build --all-packages
  artifacts:
    when: always
    paths:
      - dist/

ethos:npm-package:
  stage: package
  image: node:24
  script:
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run test:npm
