---
stages:
  - quality
  - verify
  - package

# Candidate integration is local-only. Hosted pipelines run only for remote-eligible
# branches, plus merge-request validation.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^proposal\/.+$/'
    - when: never

variables:
  # Full history keeps Git-derived ancestry and evidence checks available.
  GIT_DEPTH: "0"
  PYTHONWARNINGS: error
  UV_LINK_MODE: copy
  UV_CACHE_DIR: build/runtime/tool-cache/uv
  LYCHEE_CACHE_DIR: build/runtime/tool-cache/lychee
  ETHOS_CI_TOOL_CACHE_DIR: build/runtime/tool-cache/ci-tools
  # GitLab exposes /cache through a project-scoped runner cache volume.
  # Actionlint verifies the cached archive SHA-256 before reuse.
  ETHOS_CI_PERSISTENT_TOOL_CACHE_DIR: /cache/${CI_PROJECT_PATH_SLUG}/ci-tools

cache:
  key: ${CI_PROJECT_PATH_SLUG}
  paths:
    - build/runtime/tool-cache/uv/

# Auto-retry every job on infrastructure failures only (image-pull timeouts to
# Docker Hub, runner crashes, API hiccups) — the runner's egress to external
# registries is intermittently flaky, and a governance gate that goes red on a
# transient pull is noise, not a real breach. Never retries script_failure, so a
# genuine gate breach still fails the pipeline.
default:
  tags: ["${ETHOS_GITLAB_RUNNER_TAG}"]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure

# The quality stage runs every registered gate so a red gate fails CI — not just a
# subset. Gates: ruff (broad rule families + format), ty (types), import-linter
# (architecture), docstrings, product-boundary/contributor policy, Ruff S rules,
# Python vulnerability audit, gitleaks (secrets), config (TOML/YAML format+lint), shell lint,
# markdown lint, lychee (doc links), provider projection drift, local emulator
# boundaries, format selection, architecture projection, MCP smoke,
# generated-artifact and release supply-chain checks.
# A gate that does not run in CI is not a gate.
.python_setup: &python_setup
  image: ghcr.io/astral-sh/uv:0.12.10-python3.14-trixie-slim@sha256:d5ddd498c5a28ec77ff1c70276f8f3c4a116a303c8b5583a018ea43c2e89e366
  before_script:
    - tools/ci/scripts/bootstrap-python.sh

ethos:carrier-quality:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s format_check

ethos:types:
  <<: *python_setup
  stage: quality
  script:
    # The executed python-types gate requires zero diagnostics for every declared package.
    # Unavailable or indeterminate ty execution also blocks through verdict-to-exit
    # binding, so the pipeline cannot pass on an unverified type result.
    - >-
      tools/ci/scripts/with-python-runtime.sh -- uv run --group dev ethos prove --host --execute
      --gate python-types --expect-head "$(git rev-parse HEAD)" --json

ethos:architecture:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s import_boundaries

ethos:dependency-hygiene:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s dependencies

ethos:config:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s schemas

ethos:hygiene:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s repository_hygiene

ethos:product-boundary:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s product_boundary

ethos:docstrings:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s docstrings

ethos:module-layout:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s module_layout

ethos:security:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s vulnerabilities
  artifacts:
    when: always
    paths:
      - build/evidence/quality/security/

ethos:secrets:
  <<: *python_setup
  stage: quality
  script:
    # Secret scanning via gitleaks (prebuilt binary installed by the runner).
    # Policy: root .gitleaks.toml. A tracked secret fails the pipeline.
    - tools/ci/scripts/run-secrets-scan.sh
  artifacts:
    when: always
    paths:
      - build/evidence/quality/secrets/

ethos:docs-links:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/install-lychee.sh
    - >-
      tools/ci/scripts/with-python-runtime.sh -- uv run ethos prove --host --execute
      --gate markdown-links --expect-head "$(git rev-parse HEAD)" --json

ethos:external-links:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/install-lychee.sh
    - >-
      tools/ci/scripts/with-python-runtime.sh -- uv run ethos prove --host --execute
      --gate external-links --expect-head "$(git rev-parse HEAD)" --json

ethos:prose:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s prose

ethos:ci-projections:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s ci_templates

ethos:github-workflow-syntax:
  <<: *python_setup
  stage: quality
  script:
    - tools/ci/scripts/run-actionlint.sh

ethos:format-selection:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s format_selection

ethos:architecture-projection:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s architecture_projection

ethos:hosted-provider-observation:
  <<: *python_setup
  stage: quality
  script:
    - uv run --frozen --offline python -m nox -s hosted_observation

ethos:host-conformance:
  <<: *python_setup
  stage: verify
  script:
    - uv run --frozen --offline python -m nox -s host_conformance
  artifacts:
    when: always
    paths:
      - build/evidence/local-install/smoke.json

ethos:verify:
  <<: *python_setup
  stage: verify
  variables:
    # GIT_DEPTH=0 does not repair a runner checkout that was previously
    # shallow. Reclone only the history-sensitive verify job so replay can
    # resolve its pinned commits without making every quality job reclone.
    GIT_STRATEGY: clone
    # The arm64 hosted runner can terminate xdist workers under the full
    # coverage suite. Keep the reusable owner script and its default parallel
    # capability intact; this hosted projection deliberately runs one worker.
    ETHOS_TEST_WORKERS: "1"
    # The Docker executor starts python:3.14 as root, where RLIMIT_NPROC is not
    # enforceable. The owner script drops only pytest to the image's numeric
    # nobody identity.
    ETHOS_TEST_RUN_AS_UID: "65534"
    ETHOS_TEST_RUN_AS_GID: "65534"
  script:
    - source tools/ci/scripts/bootstrap-python.sh
    # Configure the Git identity and signing used by source-level commit-policy tests.
    # Repository proof does not activate Git-common mutation hooks or runtimes.
    - tools/ci/scripts/configure-git-checkout.sh
    - node_modules/.bin/openspec --version
    - uv run --frozen --offline python -m nox -s tests
    - openspec validate --all --strict --json
    - tools/ci/scripts/run-head-bound-proof.sh
  artifacts:
    when: always
    paths:
      - build/evidence/quality/proof/
      - build/evidence/quality/readiness/

ethos:npm:
  stage: verify
  parallel:
    matrix:
      - NODE_VERSION:
          - "24.20.0"
          - "26.8.1"
  # Runs on python:3.14 with exact Node
  # releases installed from nodejs.org; see the runtime policy and installer.
  image: ghcr.io/astral-sh/uv:0.12.10-python3.14-trixie-slim@sha256:d5ddd498c5a28ec77ff1c70276f8f3c4a116a303c8b5583a018ea43c2e89e366
  script:
    - source tools/ci/scripts/bootstrap-python.sh
    - tools/ci/scripts/install-node.sh
    - tools/ci/scripts/run-node-compatibility.sh

ethos:package:
  <<: *python_setup
  stage: package
  script:
    - uv run --frozen --offline python -m nox -s build
    - uv run --frozen --offline python -m nox -s supply_chain
  artifacts:
    when: always
    paths:
      - build/artifacts/python/
      - build/evidence/release/

ethos:npm-package:
  stage: package
  # See ethos:npm — python:3.14 + install-node.sh avoids the unreachable
  # node:24 image.
  image: ghcr.io/astral-sh/uv:0.12.10-python3.14-trixie-slim@sha256:d5ddd498c5a28ec77ff1c70276f8f3c4a116a303c8b5583a018ea43c2e89e366
  script:
    - source tools/ci/scripts/bootstrap-python.sh
    - tools/ci/scripts/install-node.sh
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run test:npm
