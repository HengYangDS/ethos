stages:
  - quality
  - verify
  - package

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

# The quality stage runs every registered gate so a red gate fails CI — not just a
# subset. Gates: ruff (40 families + complexity 10), ty (types), import-linter
# (architecture), bandit (security), lychee (doc links), code-size (role-based LOC).
# 道: a gate that does not run in CI is not a gate.
.python_setup: &python_setup
  image: python:3.12
  before_script:
    - .config/ci/scripts/bootstrap-python.sh

ethos:lint:
  <<: *python_setup
  stage: quality
  script:
    - uv run --group dev ruff check .
    - uv run --group dev ruff format --check .

ethos:types:
  <<: *python_setup
  stage: quality
  script:
    # `ethos quality types` enforces EVERY ty policy tier (.config/checks/ty/
    # policy.toml): zero-tolerance packages must be 0 diagnostics, ratchet packages
    # must stay within their baseline (which may only shrink). Fail-closed via the
    # verdict->exit binding, so a breach fails the pipeline.
    - uv run --no-project --with ty pip install ty >/dev/null 2>&1 || true
    - uv run --package ethos --with ty ethos quality types --json

ethos:architecture:
  <<: *python_setup
  stage: quality
  script:
    # Install the workspace packages (via --package ethos) so import-linter can
    # actually import ethos_core/ethos to build the graph. --no-project left the
    # packages off sys.path -> "Could not find package 'ethos_core'" and the gate
    # passed vacuously... by erroring. A gate that cannot import the code is not a gate.
    - uv run --package ethos --with import-linter lint-imports --config .config/checks/import-linter/contracts.ini

ethos:security:
  <<: *python_setup
  stage: quality
  script:
    - uv run --no-project --with bandit bandit -r packages -c .config/checks/bandit/bandit.yaml --severity-level medium -q

ethos:docs-links:
  <<: *python_setup
  stage: quality
  script:
    - .config/ci/scripts/install-lychee.sh
    - uv run --package ethos ethos quality markdown-links --json

ethos:verify:
  <<: *python_setup
  stage: verify
  script:
    - openspec --version
    - uv run --group dev pytest tests/unit tests/architecture -q
    - openspec validate --all --strict --json
    - uv run --package ethos ethos audit --json
    - uv run --package ethos ethos report --json
    - uv run --package ethos ethos prove --execute --expect-head "$(git rev-parse HEAD)" --json

ethos:npm:
  stage: verify
  image: node:24
  script:
    - node --version
    - npm --version
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run ethos -- --version
    - npm run test:npm

ethos:package:
  <<: *python_setup
  stage: package
  script:
    - uv build --all-packages
  artifacts:
    when: always
    paths:
      - dist/

ethos:npm-package:
  stage: package
  image: node:24
  script:
    - npm config set engine-strict true
    - npm ci --ignore-scripts
    - npm run test:npm
