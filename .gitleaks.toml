title = "ETHOS gitleaks configuration"

# Secret-scanning policy for the governance runtime. The default gitleaks rule
# set is extended (not replaced) so upstream rule improvements flow in; the
# allowlist below carves out the few in-repo strings that match a secret shape
# but are schema metadata or test fixtures, never real credentials.
[extend]
useDefault = true

[allowlist]
description = "Schema-metadata and test-fixture strings that are not credentials."
condition = "OR"
regexTarget = "line"
paths = [
  # Test fixtures deliberately contain secret-shaped literals to exercise the
  # retrieval/redaction paths; they are not live credentials.
  '''(^|/)tests/.*\.py$''',
]
regexes = [
  # `key: str` and similar type annotations in kernel contracts are schema
  # metadata, not assignments of a secret value.
  '''key:\s*str''',
]
