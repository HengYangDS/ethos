minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: python-lint
        name: python lint, format, and ruff ratchet
        entry: uv run --frozen --offline python -m nox -s lint
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: module-layout
        name: semantic module layout
        entry: uv run --frozen --offline python -m nox -s module_layout
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: config-lint
        name: config lint
        entry: tools/ci/scripts/run-config-lint.sh
        language: system
        files: \.(toml|ya?ml|json)$
      - id: repository-hygiene
        name: repository hygiene
        entry: tools/ci/scripts/run-repository-hygiene.sh
        language: system
        pass_filenames: false
      - id: product-boundary
        name: product boundary and contributor policy
        entry: uv run --frozen --offline python -m nox -s product_boundary
        language: system
        pass_filenames: false
      - id: shell-lint
        name: shell lint
        entry: tools/ci/scripts/run-shell-lint.sh
        language: system
        types: [shell]
        pass_filenames: true
