minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: python-lint
        name: python lint, format, and ruff ratchet
        entry: .config/ci/scripts/run-python-lint.sh
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: config-lint
        name: config lint
        entry: .config/ci/scripts/run-config-lint.sh
        language: system
        files: \.(toml|ya?ml)$
        pass_filenames: true
      - id: shell-lint
        name: shell lint
        entry: .config/ci/scripts/run-shell-lint.sh
        language: system
        types: [shell]
        pass_filenames: true
