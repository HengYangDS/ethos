<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" aria-labelledby="title desc" viewBox="0 0 1800 2400">
  <title>ETHOS — Reliable repository evolution</title>
  <desc>
    Terminal product vision, preserving the original poster&apos;s whitespace, large aperture mark, thin observation axis and quiet typography. The full product path connects observation, understanding, accepted intent, composition and action, verification and delivery, real outcomes, learning and continuity. It is not a fixed command sequence or a claim of shipped capabilities.
  </desc>
  <path fill="#f6f1e8" d="M0 0h1800v2400H0z"/>
  <g fill="#10242c" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="164" y="182" fill="#b5523d" font-size="15" letter-spacing="4">ETHOS / RELIABLE REPOSITORY EVOLUTION</text>
    <text x="1564" y="186" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="30" letter-spacing="7">问道</text>
    <text x="160" y="380" font-size="164" font-weight="600" letter-spacing="8">ETHOS</text>
    <text x="172" y="448" fill="#687771" font-size="19" letter-spacing="2">SHARED INTENT. TRUSTED CHANGE. REAL OUTCOMES.</text>
    <text x="180" y="735" fill="#b5523d" font-size="14" letter-spacing="3">PRODUCT CONTINUITY</text>
    <g fill="none" stroke="#687771" stroke-width="1.5">
      <path d="M260 827v850m0-439h20m245 0h625"/>
      <circle cx="1150" cy="1230" r="408" stroke="#e1e0d6"/>
      <path stroke="#e1e0d6" d="M1150 824v45m0 722v45m-405-406h45m724 0h45"/>
    </g>
    <g fill="#f6f1e8" stroke="#10242c" stroke-width="2">
      <circle cx="260" cy="827" r="9"/>
      <circle cx="260" cy="964" r="8"/>
      <circle cx="260" cy="1101" r="8"/>
      <circle cx="260" cy="1375" r="8"/>
      <circle cx="260" cy="1512" r="8"/>
      <circle cx="260" cy="1649" r="9"/>
    </g>
    <circle cx="260" cy="1238" r="12" fill="#b5523d"/>
    <g font-size="23" font-weight="500" letter-spacing=".5">
      <text x="295" y="835">OBSERVE</text>
      <text x="295" y="972">UNDERSTAND</text>
      <text x="295" y="1109">ACCEPT INTENT</text>
      <text x="295" y="1246" fill="#b5523d">COMPOSE &amp; ACT</text>
      <text x="295" y="1383">VERIFY &amp; DELIVER</text>
      <text x="295" y="1520">OBSERVE OUTCOMES</text>
      <text x="295" y="1657">LEARN &amp; CONTINUE</text>
    </g>
    <g transform="matrix(2.2 0 0 2.2 547.2 666.8)">
      <path fill="none" stroke="#10242c" stroke-linecap="round" stroke-width="25" d="M399.6 150.6a164 164 0 1 0 0 210.8"/>
      <path fill="none" stroke="#10242c" stroke-linecap="round" stroke-width="17" d="M274 256c33-13 67-40 103-78m-103 78c37 16 76 51 115 87"/>
      <circle cx="274" cy="256" r="14" fill="#b5523d"/>
      <circle cx="274" cy="256" r="4.75" fill="#f6f1e8"/>
    </g>
    <text x="180" y="1762" fill="#687771" font-family="Menlo, monospace" font-size="11">COOPERATE / COMPETE / EXPLORE</text>
    <text x="720" y="1712" fill="#b5523d" font-family="Menlo, monospace" font-size="11">0 / ONE SEMANTIC ORIGIN</text>
    <text x="720" y="1747" font-size="27" font-weight="500">Meaning guides the work; evidence bounds the claim.</text>
    <text x="720" y="1782" fill="#687771" font-size="18">One small trust kernel. A complete path from intent to actual benefit.</text>
    <text x="164" y="1997" fill="#b5523d" font-size="14" letter-spacing="3">ONE MEANING / MANY INTERFACES</text>
    <text x="164" y="2074" font-size="34" font-weight="500">CLI · SDK · MCP · SKILLS</text>
    <text x="164" y="2130" fill="#687771" font-size="19">Form or adopt. Collaborate, recover, hand off and exit.</text>
    <path fill="none" stroke="#dddcd2" stroke-width="1.5" d="M164 2245h1472"/>
    <text x="164" y="2290" fill="#465b60" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="26" letter-spacing="4">道隐无名　几动于微　法乎自然</text>
    <text x="1636" y="2290" fill="#687771" font-family="Menlo, monospace" font-size="11" text-anchor="end">ETHOS / TERMINAL PRODUCT VISION</text>
