[claim]
id = "ethos-coupling-governance"
subject = "ethos:coupling-governance"
state = "active"
summary = "ETHOS preserves Git-native product semantics while schema-governing coupling audit output and classifying OpenSpec, native protocols, self-hosting tools, host profiles, protocol adapters, distribution adapters, legacy evidence, and fixtures through explicit binding layers."

[evidence]
dated = "docs/evidence/coupling-contract-hardening-2026-07-01.md"
sha256 = "2d0818be2163de9aca82932a4147028fe304385a7d87b9da14e6cedf5e14458d"
tests = [
  "uv run --group dev pytest -q",
  "uv run --group dev ruff check .",
  "uv build --all-packages",
  "uv run openspec validate --all --strict --json",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos quality coupling-audit --json",
  "uv run --package ethos ethos self audit --mode shape --json",
]

[scope]
packages = [
  "ethos",
  "ethos-adapters",
  "ethos-contracts",
  "ethos-repository",
]
docs = [
  "docs/governance/product-design-contract.md",
  "docs/governance/openspec-self-governance.md",
  "docs/governance/release-governance.md",
  "docs/architecture/runner-and-mutation.md",
  "docs/architecture/schema-validation.md",
  "docs/architecture/gate-runner.md",
  "docs/architecture/package-ontology.md",
  "docs/reference/command-plane.md",
  "openspec/specs/ethos-adapters/spec.md",
  "openspec/specs/ethos-repository/spec.md",
]

[boundary]
owner = "ethos-repository"
scope = "Git-native repository semantics and provider boundary classification"

[carriers]
openspec = "openspec/specs/ethos-repository/spec.md"

fallback = "Keep provider-specific coupling as evidence or adapter metadata, not product truth."
kill_signal = "A provider-specific runtime becomes required for local ETHOS proof."

[promotion]
targets = [
  "docs/evidence/coupling-governance-2026-07-01.md",
  "docs/governance/product-design-contract.md",
  "docs/architecture/gate-runner.md",
  "openspec/specs/ethos-repository/spec.md",
]
