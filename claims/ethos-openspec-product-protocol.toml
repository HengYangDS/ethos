[claim]
id = "ethos-openspec-product-protocol"
subject = "ethos:openspec-product-protocol"
state = "active"
summary = "ETHOS OpenSpec lifecycle review enforces proposal protocol metadata and live capability routing."

[evidence]
dated = "docs/evidence/openspec-product-protocol-2026-07-02.md"
sha256 = "dbd3181559774e971aa0bb14bceb145ff03b4a0634347210eda863dcf3ba71ba"
