[meta]
version = 1
owner = "ethos-maintainers"

[semantic_axes]
required = ["subject", "role", "state", "relations"]

[states]
allowed = ["canonical", "active", "planned", "experimental", "superseded", "archived"]

# Document roles name the FUNCTION of a document (directory names its subject
# domain). The kernel role vocabulary is inherited from the ETHOS contract and
# always valid; entries here are ADDED to that kernel set, never subtracted.
[roles]
allowed = [
  "index",
  "explanation",
  "reference",
  "decision",
  "policy",
  "evidence",
  "history",
  "template",
  "plan",
  "research",
  "findings",
  "progress",
  "how-to",
]

# Extension roots map a product/adopter docs root to the document roles it may
# hold. These are ETHOS product roots, not mandatory adopter paths. An adopter
# declares its own roots without editing the ETHOS product runtime.
[extension_roots]
"docs/architecture" = ["explanation", "reference", "index"]
"docs/governance" = ["policy", "explanation", "index"]
"docs/concepts" = ["explanation", "index"]
"docs/plans" = ["plan", "findings", "progress", "index"]
"docs/research" = ["research", "plan", "index"]
"docs/guides" = ["how-to", "index"]

[[retained]]
path = "docs/history/docs-topology-contract-20260708.md"
subject = "ethos:history:docs-topology-contract-20260708"
role = "history"
state = "superseded"
origin = "a74d01910e0ce01850ca1b2e224cf126230bb3a3:docs/history/docs-topology-contract-20260708.md"
review_date = "2026-11-30"
exit_condition = "Retire the current-tree original together with docs/history/README.md once the terminal plan links its retrieval sections at their exact Git origins instead; until then the README needs this child under the directory entrypoint rule. Preserve and verify its exact Git origin."

[retained.relations]
historical_carrier_for = "DR-0004 native documentation topology contract"
current_owner = "../governance/docs-registry.md"
