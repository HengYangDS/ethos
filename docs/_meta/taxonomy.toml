[meta]
version = 1
owner = "ethos-maintainers"

[semantic_axes]
required = ["subject", "role", "state", "relations"]

[states]
allowed = ["canonical", "active", "planned", "experimental", "superseded", "archived"]

# Document roles name the FUNCTION of a document (directory names its subject
# domain). The kernel role vocabulary is inherited from the ETHOS contract and
# always valid; entries here are ADDED to that kernel set, never subtracted.
[roles]
allowed = [
  "index",
  "explanation",
  "reference",
  "decision",
  "policy",
  "evidence",
  "history",
  "template",
  "plan",
  "research",
  "findings",
  "progress",
  "how-to",
]

# Extension roots map a product/adopter docs root to the document roles it may
# hold. These are ETHOS product roots, not mandatory adopter paths. An adopter
# declares its own roots without editing the ETHOS product runtime.
[extension_roots]
"docs/architecture" = ["explanation", "reference", "index"]
"docs/governance" = ["policy", "explanation", "index"]
"docs/concepts" = ["explanation", "index"]
"docs/plans" = ["plan", "findings", "progress", "index"]
"docs/research" = ["research", "plan", "index"]
"docs/guides" = ["how-to", "index"]
