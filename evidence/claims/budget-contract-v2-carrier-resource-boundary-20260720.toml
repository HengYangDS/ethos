state = "active"
summary = "Implement MetricContract v4 static hybrid carrier execution with fixed provider ceilings, one bounded parent read, and one-shot complex-provider workers while v1 remains authoritative and per-file ELOC remains."

[evidence]
dated = "evidence/chronicle/budget-contract-v2-carrier-resource-boundary-20260720/2026-07-23.md"
sha256 = "5a63870cf5ac1d6b41d42425827fbff623fde45f96b70b71ada491d3d81450cd"
