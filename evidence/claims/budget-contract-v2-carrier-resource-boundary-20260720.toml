[evidence.freshness]
mode = "historical"

[boundary]
owner = "quality"
scope = "C1 only: MetricContract v4 static provider execution, fixed carrier ceilings, execution/provider identity, bounded linear reader, isolated complex-provider protocol/supervisor/platform backends, native admission, all-or-nothing results, tests, evidence, and plan correction."

[carriers]
openspec = "openspec/changes/budget-contract-v2-carrier-resource-boundary"
fallback = "Keep v1 source-budget authoritative and v2 inactive. An isolated provider failure returns a stable gap and never retries in process. If hybrid execution or a required Linux/Darwin capability is rejected, keep C1 open; do not raise a carrier ceiling."
kill_signal = "Any path/profile/carrier/runtime override, dynamic resource expansion, worker pool or batch, unbounded pipe, source path passed to a worker, in-process fallback for an isolated provider, unreconciled worker residue, forged result acceptance, partial carrier/snapshot result, weakened YAML safety, changed v1 allowance/debt/terminal/ELOC rule, premature replay/cutover, or claim that this is a general sandbox."

