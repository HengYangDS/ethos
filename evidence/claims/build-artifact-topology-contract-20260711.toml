[claim]
id = "build-artifact-topology-contract-20260711"
subject = "ethos:build-artifact-topology"
state = "active"
change_id = "build-artifact-topology-contract-20260711"
summary = "ETHOS package-build producers route disposable distributions only to the semantic artifact home."

[evidence]
dated = "evidence/chronicle/build-artifact-topology-contract-20260711/2026-07-11.md"
sha256 = "1bda36688fe234805decece4e8beb15d935fe70cd454ba6f20d01eea2532b085"
evidence_ids = ["evidence:build-artifact-topology-contract-20260711"]
binding = "The gate declaration, packaged registry projection, contributor command, OpenSpec carrier, and topology audit bind package artifact routing."
verifier = "semantic"
tests = [
  "tools/ci/scripts/run-python-tests.sh",
  "uv build --all-packages --out-dir build/artifacts/python --clear",
  "uv run --package ethos ethos quality generated-artifacts --json",
  "uv run --package ethos ethos openspec --lifecycle --json",
  "uv run --package ethos ethos prove --full --execute --expect-head $(git rev-parse HEAD) --json",
]

[evidence.freshness]
mode = "historical"

[boundary]
owner = "ethos-quality"
scope = "Product package-build output routing and generated-artifact topology."

[carriers]
openspec = "openspec/changes/build-artifact-topology-contract-20260711"
