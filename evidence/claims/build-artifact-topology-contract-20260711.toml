kill_signal = "A product package-build gate or contributor command writes to repository-root dist/ or uses a cleanup-only exception after the fact."

[promotion]
targets = [
  "system/gates.toml",
  "packages/ethos-core/src/ethos_core/data/gates.toml",
  "CONTRIBUTING.md",
  "tests/unit/governance/validation/test_gates.py",
  "tests/architecture/test_generated_artifact_topology_docs.py",
  "openspec/specs/repository-governance/spec.md",
  "openspec/changes/build-artifact-topology-contract-20260711",
  "evidence/chronicle/build-artifact-topology-contract-20260711/2026-07-11.md",
  "evidence/claims/build-artifact-topology-contract-20260711.toml",
]
