  "uv run --package ethos ethos parity shadow --adopter generic --target . --execute --write-evidence --timeout-seconds 60 --json",
  "uv run --package ethos ethos parity gaps --json",
  "uv run --package ethos ethos quality claims --json",
]

[evidence.freshness]
mode = "historical"
[scope]
