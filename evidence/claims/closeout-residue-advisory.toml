[claim]
id = "closeout-residue-advisory"
subject = "ethos:closeout-residue-advisory"
state = "active"
summary = "ETHOS exposes closeout residue as a non-authorizing foreign-lane disposition read model and keeps sanctioned Work Lane replay inside admission."

[evidence]
dated = "evidence/chronicle/closeout-residue-advisory/2026-07-09.md"
sha256 = "1b25bc6e502f70622793ff85d5b9ba378a4e2d8dca3473155e412da4d60e4097"
evidence_ids = ["evidence:closeout-residue-advisory"]
binding = "workspace-status foreign-lane closeout disposition, report advisory routing, sanctioned Work Lane replay admission, and OpenSpec repository-governance scenarios"
verifier = "digest_only"
tests = [
  "uv run --package ethos ethos openspec --lifecycle --json",
  "openspec validate --all --strict --json",
  "python -m json.tool system/schemas/kernel/workspace-status.schema.json",
