evidence_ids = ["evidence:declarative-lifecycle-matrix-20260720"]
binding = "The date-free Change and dated Chronicle bind the declared renew, resume, handoff-offer, and handoff-accept reducer; exact cross-host generation handoff; Work Lane start acquisition and no-clobber compensation; the single linked-retirement transaction; accepted-policy-bound unavailable-holder exact revoke; the current subject-keyed SQLite lease table and exact subject-unique index without retired resource-keyed migration or database-wide lease version ownership; and deletion of the archived Claim-specific rebase resolver. Final frozen-tree proof, archive, land, publication, and remote execution remain separate transitions until observed."
verifier = "digest_only"
tests = [
  "tools/ci/scripts/run-python-tests.sh",
  "tools/ci/scripts/run-python-lint.sh",
  "tools/ci/scripts/run-ethos-lane.sh quality types --json",
  "tools/ci/scripts/run-ethos-lane.sh quality claims --json",
  "tools/ci/scripts/run-ethos-lane.sh quality generated-artifacts --json",
