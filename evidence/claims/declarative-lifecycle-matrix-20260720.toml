state = "active"
summary = "This dated episode Claim binds the date-free declarative-lifecycle-matrix Change: four declared lease generation transitions, one generation-bound linked-retirement owner, current-only subject-keyed lease storage, and generic-only rebase recovery pending archive and local lifecycle closeout."

