  "tools/ci/scripts/run-ethos-lane.sh prove --execute --expect-head <committed-head> --json",
]

[evidence.freshness]
mode = "historical"

[boundary]
owner = "ethos-repository"
scope = "Declaration-compiled renew, resume, handoff-offer, and handoff-accept generation transitions; exact cross-host handoff; Work Lane start acquisition and no-clobber compensation; ordinary holder-bound linked landed and superseded retirement; accepted-policy-bound unavailable-holder admission using the canonical exact revoke primitive; current subject-keyed SQLite lease schema evolution and uniqueness; and generic parity or semantic-ledger rebase recovery after removal of one archived Claim-specific resolver. General foreign authority, dirty recovery, remote mutation, hosted execution, and broader intent takeover are excluded."

[carriers]
openspec = "openspec/changes/declarative-lifecycle-matrix"
fallback = "Preserve the linked checkout, lane ref, and current lease on uncertain retirement state; fail closed on unsupported retired lease storage or unresolved rebase conflicts; recreate current local coordination only through the canonical lifecycle."
kill_signal = "A parallel lease or linked-retirement owner returns, a retired resource-keyed lease schema is translated, duplicate subjects require Python arbitration, an archived Claim-specific rebase resolver returns, a lane ref is deleted after accepted-state drift, compensation clobbers a newer ref, or a later lifecycle transition is claimed before evidence exists."

