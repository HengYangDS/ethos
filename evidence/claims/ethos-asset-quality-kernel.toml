[claim]
id = "ethos-asset-quality-kernel"
subject = "ethos:quality-kernel"
state = "active"
summary = "ETHOS quality, determinism, docs quality, and proof policy semantics are a first-class product capability."

[evidence]
dated = "evidence/chronicle/asset-quality-kernel/2026-07-01.md"
sha256 = "3f1fb1d71ea3e0c9d7d906585e9eadff9b12caf11607a25f5d47d5d80ab049a6"
evidence_ids = ["evidence:ethos-asset-quality-kernel"]
binding = "semantic quality-kernel evidence binding"
verifier = "semantic"
tests = [
  "uv run --group dev pytest tests/unit/kernel/test_quality.py tests/unit/governance/test_docs_registry.py tests/unit/governance/validation tests/unit/cli/test_contracts.py tests/unit/governance/test_evolution_ledger.py tests/unit/product/parity tests/architecture/test_product_boundaries.py -q",
  "uv run --group dev pytest -q",
  "uv run --group dev ruff check .",
  "uv run openspec validate --all --strict --json",
  "uv run --package ethos ethos quality asset-policy --json",
  "uv run --package ethos ethos quality docs --json",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos quality command-examples --json",
  "uv run --package ethos ethos quality proof-policy --json",
  "uv run --package ethos ethos quality tool-profiles --json",
  "uv run --package ethos ethos playbooks route --changed --json",
  "uv run --package ethos ethos prove --execute --gate playbooks-v2 --json",
  "uv run --package ethos ethos audit --mode deep --json",
  "uv run --package ethos ethos report --json",
  "uv run --package ethos ethos prove --json",
  "uv run --package ethos ethos prove --execute --gate repository-audit --gate claims --gate docs-registry --gate schemas --gate markdown-structure --gate format-policy --gate asset-determinism --gate schema-contracts --gate proof-policy --json",
  "uv run --package ethos ethos prove --full --execute --json",
  "uv build --all-packages",
  "npm run test:npm",
]

[scope]
packages = [
  "ethos",
  "ethos-contracts",
  "ethos-quality",
  "ethos-repository",
]
schemas = [
  "system/schemas/kernel/gate.schema.json",
  "system/schemas/kernel/proof-run.schema.json",
  "system/schemas/kernel/quality-asset.schema.json",
  "system/schemas/kernel/quality-finding.schema.json",
  "system/schemas/kernel/quality-gate-plan.schema.json",
  "system/schemas/kernel/quality-profile.schema.json",
  "system/schemas/kernel/review-record.schema.json",
  "system/schemas/kernel/host-capability.schema.json",
]

[boundary]
owner = "ethos-quality"
scope = "Quality assets, gate descriptors, docs profile, and proof-state lattice"

[carriers]
openspec = "openspec/changes/archive/2026-07-01-ethos-asset-quality-kernel"

fallback = "Keep existing repository lifecycle commands as readiness wrappers while quality semantics remain provider-neutral."
kill_signal = "Quality or proof trust semantics require adopter-private terms or provider execution inside product contracts."

