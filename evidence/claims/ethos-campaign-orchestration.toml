[claim]
id = "ethos-campaign-orchestration"
subject = "ethos:campaign-orchestration"
state = "active"
summary = "ETHOS campaigns are manifest-backed orchestration records for sequential OpenSpec-backed Work Lane closeouts."

[evidence]
dated = "evidence/chronicle/campaign-orchestration/2026-07-02.md"
sha256 = "2382224a2b3d61d99ad8f26c82a8c2a3e66657a8248e03abad8eff5ac0041cd0"
evidence_ids = ["evidence:ethos-campaign-orchestration"]
binding = "digest-bound campaign orchestration evidence"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest -q tests/unit/governance/test_evolution_ledger.py::test_campaign_report_exposes_manifest_steps_and_closeout_progress tests/unit/cli/test_contracts.py::test_campaign_status_reports_manifest_steps tests/unit/cli/test_contracts.py::test_campaign_closeout_reports_local_campaign_packages tests/unit/governance/validation/test_schemas.py::test_campaign_schema_accepts_lane_closeout_steps",
  "uv run --package ethos ethos quality schemas --json",
  "uv run openspec validate --all --strict --json",
  "uv run --package ethos ethos campaign status --json",
  "uv run --package ethos ethos campaign closeout --json",
  "uv run --package ethos ethos parity shadow --adopter generic --target /Users/yheng/projects/ethos-work-campaign-orchestration --execute --write-evidence --json",
  "uv run --package ethos ethos parity shadow --adopter alphasim-dmgr --target /Users/yheng/projects/alphasim-dmgr-fix-b3 --execute --write-evidence --json",
  "uv run --package ethos ethos parity gaps --json",
  "uv run --package ethos ethos parity gaps --adopter alphasim-dmgr --json",
]

[scope]
packages = [
  "ethos",
  "ethos-repository",
]
schemas = [
  "system/schemas/kernel/campaign.schema.json",
  "system/schemas/kernel/campaign-closeout.schema.json",
]
docs = [
  "docs/governance/evolution-campaign.md",
  "docs/architecture/terminal-governance-product-design.md",
]

[boundary]
owner = "ethos-repository"
scope = "Campaign manifest read model, campaign closeout package wiring, schema contract, and terminal productization campaign manifest"

[carriers]
openspec = "openspec/changes/archive/2026-07-01-ethos-campaign-orchestration"
fallback = "Continue using hypothesis and generic campaign closeout reports while later terminal productization lanes remain planned."
kill_signal = "Campaign orchestration would need redesign if campaign steps become a substitute for Work Lane proof, accepted-root closeout, or claim evidence."

[promotion]
targets = [
  "evidence/claims/ethos-campaign-orchestration.toml",
  "evidence/chronicle/campaign-orchestration/2026-07-02.md",
  "evidence/parity/generic-shadow.json",
  "evidence/parity/alphasim-dmgr-shadow.json",
  "docs/governance/evolution-campaign.md",
  "docs/architecture/terminal-governance-product-design.md",
  "evolution/campaigns/terminal-openspec-productization/campaign.toml",
  "openspec/changes/archive/2026-07-01-ethos-campaign-orchestration/proposal.md",
  "openspec/changes/archive/2026-07-01-ethos-campaign-orchestration/design.md",
  "openspec/changes/archive/2026-07-01-ethos-campaign-orchestration/tasks.md",
  "openspec/changes/archive/2026-07-01-ethos-campaign-orchestration/specs/ethos-repository/spec.md",
  "packages/ethos/src/ethos/repository/adoption/evolution.py",
  "packages/ethos/src/ethos/repository/policy/schema.py",
  "packages/ethos/src/ethos/cli.py",
  "system/schemas/kernel/campaign.schema.json",
  "system/schemas/kernel/campaign-closeout.schema.json",
  "tests/unit/cli/test_contracts.py",
  "tests/unit/governance/test_evolution_ledger.py",
  "tests/unit/governance/validation",
]
