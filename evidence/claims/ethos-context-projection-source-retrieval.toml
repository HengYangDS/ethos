[claim]
id = "ethos-context-projection-source-retrieval"
subject = "ethos:context-projection"
state = "active"
summary = "ETHOS exposes source-verified assistant context projection as an advisory retrieval aid over repository truth, backed by ignored local SQLite/FTS state and guarded by path, HEAD, digest, dirty-source, and secret-quarantine checks."

[evidence]
dated = "evidence/chronicle/context-projection/2026-07-01.md"
sha256 = "deedf0fc854e3ca34f099580638c9b02a49dc1815bad1561613a93b2e1fb19be"
evidence_ids = ["evidence:ethos-context-projection-source-retrieval"]
binding = "semantic source-verified context projection evidence binding"
verifier = "semantic"
tests = [
  "uv run --group dev pytest tests/unit/context/test_contracts.py tests/unit/context/test_schemas.py tests/unit/context/test_index_state.py tests/unit/context/test_retrieval.py tests/unit/context/test_selection.py tests/unit/context/test_cli.py -q",
