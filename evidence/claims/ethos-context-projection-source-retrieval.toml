  "uv run --group dev ruff check packages/ethos-adapters/src/ethos_adapters/context_index.py packages/ethos-assistants/src/ethos_assistants/context.py packages/ethos-assistants/src/ethos_assistants/context_selection.py packages/ethos-assistants/src/ethos_assistants/mcp.py packages/ethos-test/src/ethos_test/fixtures.py packages/ethos/src/ethos/cli.py tests/unit/context/test_*.py -q",
  "uv run --group dev pytest tests/unit tests/architecture -q",
  "uv run --group dev ruff check .",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos audit --json",
  "uv run --package ethos ethos report --json",
  "uv run openspec validate --type change land-context-projection-source-retrieval --strict",
]

[scope]
