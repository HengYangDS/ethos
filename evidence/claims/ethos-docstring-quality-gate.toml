  "uv run --group dev pytest tests/architecture/test_release_assets.py tests/unit/cli/test_quality_surface_more.py tests/unit/governance/validation tests/unit/cli/test_contracts.py::test_quality_tool_profiles_command_reports_adapter_boundaries -q",
