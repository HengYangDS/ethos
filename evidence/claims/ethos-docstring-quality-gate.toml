[claim]
id = "ethos-docstring-quality-gate"
subject = "ethos:docstring-quality-gate"
state = "active"
summary = "ETHOS gates public Python product-surface docstring coverage through repository-owned policy, CI script, quality command, and proof gate registration."

[evidence]
dated = "evidence/chronicle/docstring-quality-gate/2026-07-05.md"
sha256 = "5fca4d0afd7128c7e381ca79e273634acbed06ece478995416f8a34d7b93941d"
