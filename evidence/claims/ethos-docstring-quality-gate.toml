  "uv run --group dev ruff format --check packages/ethos/src/ethos/repository/policy/docstrings/core.py packages/ethos/src/ethos/surface/cli/quality/core.py packages/ethos/src/ethos/repository/policy/gates.py packages/ethos-core/src/ethos_core/quality/gates.py packages/ethos-core/src/ethos_core/quality/profiles.py tests/architecture/test_release_assets.py tests/unit/cli/test_quality_surface_more.py tests/unit/governance/validation tests/unit/cli/test_contracts.py",
  "uv run --package ethos ethos quality gates --json",
]

[evidence.freshness]
mode = "historical"
[boundary]
owner = "ethos-quality"
scope = "Public Python product-surface docstring coverage gate"

[carriers]
