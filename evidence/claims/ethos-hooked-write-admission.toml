[claim]
id = "ethos-hooked-write-admission"
subject = "ethos:hooked-write-admission"
state = "active"
summary = "ETHOS exposes hook-time write admission that binds pre-tool and mutation-risk pre-run decisions to Work Lane prewrite and fuses protected-root or unexpected-path post-write drift."

[evidence]
dated = "evidence/chronicle/hooked-write-admission/2026-07-02.md"
sha256 = "a7d68184093c2c6be19f56799996924bcc36e6177749db48e1fef22656f78aad"
evidence_ids = ["evidence:ethos-hooked-write-admission"]
binding = "semantic hooked write admission evidence binding"
verifier = "semantic"
tests = [
  "uv run --group dev pytest -q tests/unit/lanes/test_hook_admission.py tests/unit/cli/test_contracts.py::test_hook_admit_pre_tool_blocks_accepted_root tests/unit/cli/test_contracts.py::test_hook_admit_pre_run_blocks_mutation_risk_without_paths tests/unit/cli/test_command_registry.py::test_hook_admission_is_reference_command_not_public_workflow",
  "uv run --group dev pytest -q",
  "uv run --group dev ruff check .",
  "uv run openspec validate --all --strict --json",
  "uv run --package ethos ethos openspec --lifecycle --json",
  "uv run --package ethos ethos quality claims --json",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos report --json",
  "uv run --package ethos ethos prove --execute --expect-head $(git rev-parse HEAD) --json",
  "uv build --all-packages",
]

[scope]
packages = [
  "ethos",
  "ethos-adapters",
  "ethos-assistants",
  "ethos-repository",
]
docs = [
  "docs/reference/command-plane.md",
  "evolution/campaigns/terminal-openspec-productization/campaign.toml",
  ".agents/skills/activation.toml",
  ".agents/skills/activation.toml",
]

[boundary]
owner = "ethos-adapters"
scope = "Hook admission runtime, hook CLI decision surface, command registry classification, and terminal OpenSpec productization campaign step state"

[carriers]
openspec = "openspec/changes/archive/2026-07-03-ethos-hooked-write-admission"
fallback = "Use explicit ethos lane prewrite as degraded mode when a host cannot call hook admission."
kill_signal = "A normal tracked write path can mutate an accepted root without pre-tool or pre-run admission."

[promotion]
targets = [
  "evidence/claims/ethos-hooked-write-admission.toml",
  "evidence/chronicle/hooked-write-admission/2026-07-02.md",
  "docs/reference/command-plane.md",
