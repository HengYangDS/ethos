[claim]
id = "ethos-isomorphic-governance-kernel"
subject = "ethos:isomorphic-governance-kernel"
state = "active"
summary = "Governed-repository and product-adopter are two profile forms of one ETHOS governance kernel, sharing the same kernel chain, trust lifecycle, capability graph, truth sources, run steps, and advisory projection boundaries."

[evidence]
dated = "evidence/chronicle/isomorphic-governance-kernel/2026-07-01.md"
sha256 = "fe4c5373e068771028942b0b858a3fd8549162065ea32551fa221fe982220b95"
evidence_ids = ["evidence:ethos-isomorphic-governance-kernel"]
binding = "digest-bound dual-form governance evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest tests/unit/governance/test_profiles.py -q",
  "uv run --group dev pytest tests/architecture/test_product_design_contract.py::test_product_design_contract_defines_isomorphic_governance_profiles -q",
  "uv run --group dev pytest tests/unit/governance/test_validation_gates.py::test_schema_validation_report_covers_all_ethos_schemas tests/unit/governance/test_profiles.py -q",
  "uv run --package ethos ethos quality schemas --json",
  "uv run openspec validate --all --strict --json",
  "uv run --group dev pytest tests/unit tests/architecture -q",
  "uv run --package ethos ethos prove --full --execute --json",
]

[scope]
packages = [
  "ethos-contracts",
  "ethos-repository",
  "ethos-test",
]
docs = [
  "docs/governance/product-design-contract.md",
  "docs/architecture/adoption-profiles.md",
  "docs/architecture/schema-validation.md",
  "evidence/chronicle/isomorphic-governance-kernel/2026-07-01.md",
]
schemas = [
  "system/schemas/kernel/governance-profile.schema.json",
]

[boundary]
owner = "ethos-repository"
scope = "Governed-repository kernel chain and adopter profile contract"

[carriers]
