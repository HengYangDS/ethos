fallback = "Keep product and adopter governance under existing trust lifecycle checks until the governance profile contract is clean."
kill_signal = "Governed-repository and product-adopter profiles diverge in kernel chain or trust lifecycle."

[promotion]
targets = [
  "evidence/chronicle/isomorphic-governance-kernel/2026-07-01.md",
  "system/schemas/kernel/governance-profile.schema.json",
  "packages/ethos/src/ethos/repository/registry/profiles.py",
