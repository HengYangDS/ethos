[claim]
id = "ethos-isomorphic-governance-kernel"
subject = "ethos:isomorphic-governance-kernel"
state = "active"
summary = "Self-governance and product-adopter are two profile forms of one ETHOS governance kernel, sharing the same kernel chain, trust lifecycle, capability graph, truth sources, run steps, and advisory projection boundaries."

[evidence]
dated = "docs/evidence/isomorphic-governance-kernel-2026-07-01.md"
sha256 = "19f694edd428ddf65758fedcba3bd87e52ddc00923a5aec7e99f8fbd593b79ed"
evidence_ids = ["evidence:ethos-isomorphic-governance-kernel"]
binding = "digest-bound dual-form governance evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest tests/unit/test_governance_profiles.py -q",
  "uv run --group dev pytest tests/architecture/test_product_design_contract.py::test_product_design_contract_defines_isomorphic_governance_profiles -q",
  "uv run --group dev pytest tests/unit/test_schema_validation_and_gates.py::test_schema_validation_report_covers_all_ethos_schemas tests/unit/test_governance_profiles.py -q",
  "uv run --package ethos ethos quality schemas --json",
  "uv run openspec validate --all --strict --json",
  "uv run --group dev pytest tests/unit tests/architecture -q",
  "uv run --package ethos ethos prove --full --execute --json",
]

[scope]
packages = [
  "ethos-contracts",
  "ethos-repository",
  "ethos-test",
]
docs = [
  "docs/governance/product-design-contract.md",
  "docs/architecture/adoption-profiles.md",
  "docs/architecture/schema-validation.md",
  "docs/evidence/isomorphic-governance-kernel-2026-07-01.md",
]
schemas = [
  "schemas/ethos/governance-profile.schema.json",
]

[boundary]
owner = "ethos-repository"
scope = "Dual-form self-governance and product-adopter profile contract"

[carriers]
openspec = "openspec/changes/isomorphic-governance-kernel"

fallback = "Keep product and adopter governance under existing trust lifecycle checks until the governance profile contract is clean."
kill_signal = "Self-governance and product-adopter profiles diverge in kernel chain or trust lifecycle."

[promotion]
targets = [
  "docs/evidence/isomorphic-governance-kernel-2026-07-01.md",
  "schemas/ethos/governance-profile.schema.json",
  "packages/ethos-repository/src/ethos_repository/governance_profiles.py",
  "packages/ethos-repository/src/ethos_repository/schema_validation.py",
  "docs/governance/product-design-contract.md",
  "openspec/changes/isomorphic-governance-kernel",
]
