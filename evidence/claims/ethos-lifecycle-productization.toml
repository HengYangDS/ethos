[claim]
id = "ethos-lifecycle-productization"
subject = "ethos:lifecycle-productization"
state = "active"
summary = "ETHOS governance productization binds claim envelopes, OpenSpec lifecycle, proof execution semantics, Work Lane and intake projections, schemas, scaffold, and adopter parity boundaries into one product trust lifecycle."

[evidence]
dated = "evidence/chronicle/governance-productization/2026-07-01.md"
sha256 = "dec9216af50270f7a5a6801af9682325ab3e5c5e22a8c81fe2b578edecabd171"
evidence_ids = ["evidence:ethos-lifecycle-productization"]
binding = "semantic governance lifecycle productization evidence binding"
verifier = "semantic"
tests = [
  "uv run --group dev pytest tests/unit/governance/test_validation_gates.py tests/unit/governance/test_claims.py tests/unit/lanes/test_lanes.py tests/unit/cli/test_contracts.py tests/unit/product/test_openspec_cache.py tests/unit/product/test_parity.py -q",
  "uv run --group dev pytest tests/unit/adoption/test_apply_sample.py tests/unit/governance/test_validation_gates.py tests/unit/lanes/test_lanes.py tests/unit/cli/test_contracts.py tests/unit/governance/test_lifecycle.py tests/architecture/test_product_design_contract.py -q",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos openspec --lifecycle --json",
  "uv run --package ethos ethos lane bind-claim --claim-id ethos-lifecycle-productization --apply --json",
  "openspec archive complete-ethos-governance-productization --yes --json",
  "uv run --package ethos ethos prove --full --execute --json",
]

[scope]
packages = [
  "ethos",
  "ethos-adapters",
  "ethos-contracts",
  "ethos-repository",
  "ethos-test",
]
docs = [
  "docs/reference/command-plane.md",
  "docs/architecture/gate-runner.md",
  "docs/architecture/schema-validation.md",
  "docs/governance/openspec-governance.md",
  "docs/governance/capability-parity-ledger.md",
  "docs/governance/product-design-contract.md",
]
schemas = [
  "system/schemas/kernel/trust-envelope.schema.json",
  "system/schemas/kernel/promotion-target.schema.json",
  "system/schemas/kernel/capability-profile.schema.json",
]

[boundary]
owner = "ethos-repository"
scope = "Complete repository governance lifecycle from claim through promotion evidence"

[carriers]
openspec = "openspec/changes/archive/2026-07-01-complete-ethos-governance-productization"
fallback = "Keep dry-run proof as readiness and block archive readiness until lifecycle carriers and executed evidence are present."
kill_signal = "A valid OpenSpec change or intake state can be archived as trusted truth without an active claim, executed evidence, and promotion targets."

[promotion]
targets = [
  "evidence/chronicle/governance-productization/2026-07-01.md",
  "system/schemas/kernel/trust-envelope.schema.json",
  "system/schemas/kernel/promotion-target.schema.json",
  "system/schemas/kernel/capability-profile.schema.json",
  "docs/reference/command-plane.md",
  "openspec/changes/archive/2026-07-01-complete-ethos-governance-productization",
]
