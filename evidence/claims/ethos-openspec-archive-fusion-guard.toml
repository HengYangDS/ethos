[claim]
id = "ethos-openspec-archive-fusion-guard"
subject = "ethos:openspec-archive-fusion-guard"
state = "active"
summary = "ETHOS blocks silent deletion of accepted OpenSpec scenario obligations during archive closeout by surfacing removed WHEN, THEN, and AND obligation lines in the always-run shape audit."

[evidence]
dated = "evidence/chronicle/openspec-archive-fusion-guard/2026-07-05.md"
sha256 = "927f69ffe9d3a5d8cf1bf00f0e1a987a237184d36083990e414ebba60f3283b7"
evidence_ids = ["evidence:ethos-openspec-archive-fusion-guard"]
binding = "declared OpenSpec archive fusion guard evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest tests/unit/audit/test_modes.py::test_openspec_shape_flags_removed_accepted_spec_obligations tests/unit/audit/test_modes.py::test_openspec_shape_allows_added_or_unchanged_spec_obligations -q",
  "uv run --group dev pytest tests/unit/audit/test_modes.py tests/unit/product/test_openspec_edges.py tests/unit/product/test_openspec_cache.py -q",
  "uv run --group dev ruff check .",
  "uv run --group dev ruff format --check .",
  "uv run --package ethos ethos report --json",
  "uv run --package ethos ethos plan --changed --json",
]

[evidence.freshness]
mode = "historical"
[boundary]
owner = "ethos-repository"
scope = "OpenSpec archive closeout fusion guard for accepted scenario obligations"

[carriers]
openspec = "openspec/changes/archive/2026-07-05-ethos-openspec-archive-fusion-guard"

fallback = "Restore or explicitly carry removal of accepted OpenSpec obligations before archive closeout proceeds."
kill_signal = "An OpenSpec archive or manual spec edit can delete accepted WHEN, THEN, or AND obligations without a blocking repository audit gap."

[promotion]
