[claim]
id = "ethos-openspec-product-protocol"
subject = "ethos:openspec-product-protocol"
state = "active"
summary = "ETHOS OpenSpec lifecycle review enforces proposal protocol metadata and live capability routing."

[evidence]
dated = "evidence/chronicle/openspec-product-protocol/2026-07-02.md"
sha256 = "b8a402189d49119f29c7d3b40ec12a3a38e386a9d4bc822c6c27ecd83a437dc7"
evidence_ids = ["evidence:ethos-openspec-product-protocol"]
binding = "digest-bound OpenSpec product protocol evidence"
verifier = "semantic"
tests = [
  "uv run --group dev pytest -q tests/unit/product/test_openspec_cache.py",
  "uv run --group dev ruff check packages/ethos/src/ethos/adapters/openspec/protocol/core.py tests/unit/product/test_openspec_cache.py",
  "uv run openspec validate ethos-openspec-product-protocol --strict --json",
  "uv run --package ethos ethos openspec --lifecycle --json",
  "uv run --package ethos ethos parity shadow --adopter generic --target <workspace>/ethos-work-openspec-product-protocol --execute --write-evidence --json",
  "uv run --package ethos ethos parity shadow --adopter reference-adopter --target <adopter-repo> --execute --write-evidence --json",
]

[evidence.freshness]
mode = "historical"
[scope]
packages = [
  "ethos-adapters",
]
docs = [
  "docs/governance/openspec-governance.md",
  "docs/plans/terminal-governance-product-design.md",
]

[boundary]
owner = "ethos-adapters"
scope = "OpenSpec lifecycle proposal protocol review and live capability routing guard"

[carriers]
openspec = "openspec/changes/archive/2026-07-01-ethos-openspec-product-protocol"
fallback = "Keep existing artifact and claim-binding lifecycle checks while proposal protocol review is unavailable."
kill_signal = "OpenSpec proposals can become active without live capability routing, reuse/change stance, facets, or out-of-scope boundaries."

[promotion]
targets = [
  "evidence/claims/ethos-openspec-product-protocol.toml",
  "evidence/chronicle/openspec-product-protocol/2026-07-02.md",
  "evidence/parity/generic-shadow.json",
  "evolution/campaigns/terminal-openspec-productization/campaign.toml",
  "openspec/changes/archive/2026-07-01-ethos-campaign-orchestration/proposal.md",
  "openspec/changes/archive/2026-07-01-ethos-openspec-product-protocol/proposal.md",
  "openspec/changes/archive/2026-07-01-ethos-openspec-product-protocol/design.md",
  "openspec/changes/archive/2026-07-01-ethos-openspec-product-protocol/tasks.md",
  "openspec/changes/archive/2026-07-01-ethos-openspec-product-protocol/specs/ethos-adapters/spec.md",
  "openspec/changes/archive/2026-07-01-ethos-openspec-product-protocol/specs/ethos-repository/spec.md",
  "packages/ethos/src/ethos/adapters/openspec/protocol/core.py",
  "tests/unit/product/test_openspec_cache.py",
]
