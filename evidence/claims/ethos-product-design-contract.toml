[claim]
id = "ethos-product-design-contract"
subject = "ethos:product-design-contract"
state = "active"
summary = "ETHOS now has a canonical product design contract, target package ontology, product/adopter boundary policy, and capability parity ledger for safe migration from embedded adopter implementation to product truth."

[evidence]
dated = "evidence/product-design-contract-2026-07-01.md"
sha256 = "1dadf15d9ea1cbaa1fd7df2bc1db7000256219915d60b0bb1a9e2d6f3261258b"
evidence_ids = ["evidence:ethos-product-design-contract"]
binding = "digest-bound design evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest -q tests/architecture/test_product_design_contract.py",
  "uv run --group dev pytest -q tests/unit/audit/test_depth.py tests/unit/cli/test_contracts.py::test_repository_audit_reports_governed_repository_shape tests/unit/cli/test_contracts.py::test_report_scorecard_is_derived_from_governance_checks tests/unit/cli/test_contracts.py::test_retired_self_command_group_is_not_available",
  "uv run --package ethos ethos audit --json",
  "openspec archive ethos-product-design-contract --yes --json",
  "uv run --group dev pytest -q",
  "uv run --group dev ruff check .",
  "openspec validate --all --strict --json",
  "uv run --package ethos ethos prove --execute --gate repository-audit --gate claims --gate schemas --json",
  "uv build --all-packages",
  "npm run ethos -- --version",
  "npm run test:npm -- --json",
  "uv run --package ethos ethos report --json",
]

[scope]
docs = [
  "docs/governance/product-design-contract.md",
  "docs/architecture/package-ontology.md",
  "docs/governance/product-boundary-convergence.md",
  "docs/governance/capability-parity-ledger.md",
]

[boundary]
owner = "ethos-contracts"
scope = "Product design contract, package ontology, and product/adopter boundary"

[carriers]
openspec = "openspec/specs/ethos-contracts/spec.md"

fallback = "Keep adopter migration oracle evidence until product contracts prove equivalent behavior."
kill_signal = "Product package ontology and adopter boundary are defined only in prose without schema or tests."

[promotion]
targets = [
  "evidence/product-design-contract-2026-07-01.md",
  "docs/governance/product-design-contract.md",
  "docs/governance/capability-parity-ledger.md",
  "openspec/specs/ethos-contracts/spec.md",
]
