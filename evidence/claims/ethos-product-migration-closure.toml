[claim]
id = "ethos-product-migration-closure"
subject = "ethos:product-migration-closure"
state = "active"
summary = "Records digest-bound evidence for product migration host retirement, target MECE package topology, distribution adapters, OpenSpec records, claims, parity evidence, local builds, npm launcher smoke, and execution proof."

[evidence]
dated = "evidence/chronicle/product-migration-closure/2026-07-01.md"
sha256 = "54fe582224a66ab30de9e8bf284f6630e66f5a91535aa246bf3919f5dde4e969"
evidence_ids = ["evidence:ethos-product-migration-closure"]
binding = "digest-bound migration evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest -q tests/unit tests/architecture",
  "uv run --group dev ruff check .",
  "openspec validate --all --strict --json",
  "uv build --all-packages",
  "npm ci --ignore-scripts",
  "npm run ethos -- --version",
  "npm run test:npm",
  "uv run --package ethos ethos audit --mode deep --json",
  "uv run --package ethos ethos quality claims --json",
  "uv run --package ethos ethos report --json",
  "uv run --package ethos ethos prove --full --execute --json",
]

[scope]
packages = [
  "ethos-core",
  "ethos-contracts",
  "ethos-repository",
  "ethos-assistants",
  "ethos-adapters",
  "ethos",
  "ethos-test",
]
distributions = [
  "distributions/npm",
]
adopters = [
  "reference-adopter",
]

[boundary]
owner = "ethos-contracts"
scope = "Closed product topology migration and target package/distribution contracts"

[carriers]
openspec = "openspec/specs/contracts/spec.md"

fallback = "Use migration evidence and parity reports as rollback anchors without reviving migration-host packages."
kill_signal = "Active migration-host packages reappear in product topology."

[promotion]
targets = [
  "evidence/chronicle/product-migration-closure/2026-07-01.md",
  "docs/architecture/package-ontology.md",
  "packages/ethos-core/src/ethos_core/contracts/package/ontology.py",
  "openspec/specs/contracts/spec.md",
]
