[claim]
id = "ethos-product-truth-closure"
subject = "ethos:product-truth-closure"
state = "active"
summary = "Records digest-bound evidence for product migration state reporting, diagnosable adopter scaffold, command example checks, and package ontology command exposure."

[evidence]
dated = "evidence/product-truth-closure-2026-07-01.md"
sha256 = "0f1d7b3b04232e4a915051486a907d6913ed7cd03fed039460499302f32b20fd"
evidence_ids = ["evidence:ethos-product-truth-closure"]
binding = "digest-bound product truth evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest -q tests/architecture/test_product_design_contract.py tests/unit/cli/test_command_registry.py tests/unit/adoption/test_apply_sample.py tests/unit/cli/test_contracts.py",
  "uv run --group dev pytest -q tests/architecture/test_product_boundaries.py tests/unit/cli/test_contracts.py::test_init_apply_flag_applies_scaffold tests/unit/cli/test_contracts.py::test_quality_package_ontology_reports_migration_state",
  "uv run --package ethos ethos quality package-ontology --json",
  "uv run --package ethos ethos quality command-examples --json",
]

[scope]
packages = [
  "ethos",
  "ethos-core",
  "ethos-contracts",
  "ethos-repository",
  "ethos-assistants",
  "ethos-adapters",
  "ethos-test",
]
distributions = [
  "distributions/npm",
]
docs = [
  "docs/architecture/product-ontology.md",
  "docs/architecture/package-ontology.md",
  "docs/reference/command-plane.md",
]

[boundary]
owner = "ethos-repository"
scope = "Product truth reporting, scaffold diagnostics, command examples, and package ontology"

[carriers]
openspec = "openspec/specs/repository-governance/spec.md"

fallback = "Use product repository-audit and command-registry checks as local truth gates."
kill_signal = "Command or package truth can pass through docs-only declarations without source or tests."

[promotion]
targets = [
  "evidence/product-truth-closure-2026-07-01.md",
  "docs/reference/command-plane.md",
  "docs/architecture/product-ontology.md",
  "openspec/specs/repository-governance/spec.md",
]
