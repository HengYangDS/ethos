[claim]
id = "ethos-repository-platform"
subject = "ethos:repository-platform"
state = "active"
summary = "ETHOS now has complete project scaffold, playbooks, fleet inspection, MECE OpenSpec families, npm distribution policy, deeper repository-audit, schema instance validation, and stronger standards adapters."

[evidence]
dated = "evidence/governance-platform-2026-06-30.md"
sha256 = "fc28a000adef11627233f78a8798cafd764226bd7388556f3bbb4c836ddc91a6"
evidence_ids = ["evidence:ethos-repository-platform"]
binding = "digest-bound evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest tests/unit tests/architecture -q",
  "uv run --group dev ruff check .",
  "openspec validate --all --strict --json",
  "uv build --all-packages",
  "npm ci --ignore-scripts",
  "npm run ethos -- --version",
  "npm run test:npm -- --json",
  "uv run --package ethos ethos prove --execute --gate repository-audit --gate claims --gate schemas --json",
]

[scope]
packages = [
  "ethos",
  "ethos-core",
  "ethos-contracts",
  "ethos-repository",
  "ethos-assistants",
  "ethos-adapters",
  "ethos-test",
]
distributions = [
  "distributions/npm",
]

[boundary]
owner = "ethos-repository"
scope = "Repository platform scaffold, playbooks, fleet inspection, OpenSpec families, and standards adapters"

[carriers]
openspec = "openspec/specs/ethos-repository/spec.md"

fallback = "Keep official OpenSpec validation, local repository-audit, and standards adapter checks as proof gates."
kill_signal = "Repository platform readiness depends on a second command plane or lifecycle store."

[promotion]
targets = [
  "evidence/governance-platform-2026-06-30.md",
  "docs/governance/openspec-governance.md",
  "docs/governance/standards-adoption-policy.md",
  "openspec/specs/ethos-repository/spec.md",
]
