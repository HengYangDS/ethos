[claim]
id = "ethos-skill-portfolio-coverage-contract"
subject = "ethos:skill-portfolio-coverage-contract"
state = "active"
summary = "ETHOS checks repo-local skill portfolio MECE ownership through an activation-level coverage contract and strict playbook gaps."

[evidence]
dated = "evidence/chronicle/skill-portfolio-coverage-contract/2026-07-06.md"
sha256 = "6dd207228065c75ed4adb20538a59a0de21c9062c9cbe650f613469edb05f7ea"
evidence_ids = ["evidence:ethos-skill-portfolio-coverage-contract"]
binding = "declared skill portfolio coverage evidence binding"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest tests/unit/cli/test_contracts.py::test_playbooks_commands_expose_repo_local_skills tests/unit/cli/test_contracts.py::test_playbooks_strict_mode_requires_portfolio_primary_subjects tests/unit/cli/test_contracts.py::test_playbooks_strict_mode_rejects_duplicate_primary_subject_owner tests/unit/governance/validation/test_schemas.py::test_schema_validation_report_covers_all_ethos_schemas -q",
  "uv run --group dev ty check packages/ethos/src/ethos/assistants/playbooks.py packages/ethos-core/src/ethos_core/contracts/skill/activation.py",
  "uv run --group dev ruff check packages/ethos/src/ethos/assistants/playbooks.py packages/ethos-core/src/ethos_core/contracts/skill/activation.py tests/unit/cli/test_contracts.py",
  "uv run --group dev ruff format --check packages/ethos/src/ethos/assistants/playbooks.py packages/ethos-core/src/ethos_core/contracts/skill/activation.py tests/unit/cli/test_contracts.py",
  "uv run --group dev openspec status --change skill-portfolio-coverage-contract --json",
  "ETHOS_ROOT=$PWD uv run --group dev ethos quality projection-drift --json",
]

[evidence.freshness]
mode = "historical"
[boundary]
owner = "ethos-assistants"
scope = "Repo-local skill portfolio coverage and primary-subject ownership validation"

[carriers]
openspec = "openspec/changes/archive/2026-07-05-skill-portfolio-coverage-contract"

fallback = "Keep the five-skill MECE portfolio and reject ad-hoc skill additions unless the activation coverage contract is updated."
kill_signal = "A valid individual skill package can enter the product portfolio while leaving a required primary subject missing or duplicated."

[promotion]
targets = [
  ".agents/skills/activation.toml",
  "docs/governance/playbooks-and-skills.md",
  "evidence/claims/ethos-skill-portfolio-coverage-contract.toml",
  "evidence/chronicle/skill-portfolio-coverage-contract/2026-07-06.md",
  "openspec/changes/archive/2026-07-05-skill-portfolio-coverage-contract/proposal.md",
  "openspec/changes/archive/2026-07-05-skill-portfolio-coverage-contract/design.md",
  "openspec/changes/archive/2026-07-05-skill-portfolio-coverage-contract/tasks.md",
  "openspec/changes/archive/2026-07-05-skill-portfolio-coverage-contract/specs/ethos-assistants/spec.md",
  "packages/ethos/src/ethos/assistants/playbooks.py",
  "system/schemas/kernel/skill-activation.schema.json",
  "system/schemas/kernel/skill-registry.schema.json",
  "tests/unit/cli/test_contracts.py",
]
