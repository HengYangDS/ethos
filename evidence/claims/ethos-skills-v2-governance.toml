[claim]
id = "ethos-skills-v2-governance"
subject = "ethos:skills-v2-governance"
state = "active"
summary = "ETHOS Skills V2 separates activation semantics from provider-visible skill packages, applies strict product-root package quality checks, keeps historical adopter migration evidence readable, and binds routing to changed-path evidence."

[evidence]
dated = "evidence/chronicle/skills-v2-governance/2026-07-01.md"
sha256 = "3a81f4fb63ba4042f086b6d00067ac1eb14c97aa03e23af8055e8217a4c89fd4"
evidence_ids = ["evidence:ethos-skills-v2-governance"]
binding = "semantic skills-v2 governance evidence binding"
verifier = "semantic_attested"
tests = [
  "uv run --group dev pytest -q tests/unit/kernel/test_skill_activation.py tests/unit/assistants/test_skill_packages.py tests/unit/assistants/test_projection.py tests/unit/governance/validation",
  "uv run --group dev pytest -q tests/unit/cli/test_contracts.py::test_playbooks_changed_scope_reports_matched_changed_path_evidence tests/unit/cli/test_contracts.py::test_playbooks_changed_scope_reports_unmatched_changed_paths tests/unit/cli/test_contracts.py::test_report_uses_strict_playbooks_for_external_adopter_root tests/unit/cli/test_contracts.py::test_projection_drift_reports_registry_and_generator_digest_state tests/unit/cli/test_contracts.py::test_playbooks_v2_gate_can_execute tests/architecture/test_product_boundaries.py::test_active_openspec_change_deltas_use_target_product_families",
  "uv run --group dev pytest -q tests/unit tests/architecture",
  "uv run --group dev ruff check .",
  "uv run --group dev ruff format --check packages/ethos-core/src/ethos_core/contracts/skill/activation.py packages/ethos/src/ethos/assistants/skills/packages.py packages/ethos/src/ethos/assistants/playbooks.py packages/ethos/src/ethos/assistants/mcp.py packages/ethos/src/ethos/adapters/repo/status/core.py packages/ethos/src/ethos/adapters/repo/status/bindings.py packages/ethos/src/ethos/repository/adoption/planner.py packages/ethos/src/ethos/repository/policy/schema.py packages/ethos/src/ethos/repository/policy/gates.py packages/ethos/src/ethos/repository/audit.py packages/ethos/src/ethos/cli.py tests/unit/adoption/test_apply_sample.py tests/unit/assistants/test_projection.py tests/unit/cli/test_contracts.py tests/unit/governance/validation tests/unit/kernel/test_skill_activation.py tests/unit/assistants/test_skill_packages.py",
  "uv run openspec validate ethos-skills-v2-quality-governance --strict --json",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos audit --mode shape --json",
  "uv run --package ethos ethos playbooks check --mode v2-strict --json",
  "uv run --package ethos ethos playbooks route --changed --mode v2-strict --json",
  "uv run --package ethos ethos quality projection-drift --json",
  "uv run --package ethos ethos report --json",
  "uv run --package ethos ethos prove --execute --gate playbooks-v2 --json",
  "uv run --package ethos ethos playbooks check --root <adopter-repo> --json",
  "uv run --package ethos ethos playbooks route --changed --root <adopter-repo> --json",
  "uv run --package ethos ethos report --root <adopter-repo> --json",
  "uv run --package ethos ethos parity gaps --adopter reference-adopter --json",
  "uv run --package ethos ethos parity shadow --target <adopter-repo> --execute --timeout-seconds 30 --json",
]

