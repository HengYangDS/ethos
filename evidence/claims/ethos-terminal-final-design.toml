[claim]
id = "ethos-terminal-final-design"
subject = "ethos:terminal-final-design"
state = "active"
summary = "ETHOS terminal final design productizes OpenSpec substrate, capability routing, invocation admission, and evidence closeout guidance."

[evidence]
dated = "evidence/terminal-final-design-2026-07-02.md"
sha256 = "a157f00c5687d00e5c3097d5a39e75f59f8780866b6edf8ceccd3fa36601cc93"
evidence_ids = ["evidence:ethos-terminal-final-design"]
binding = "digest-bound terminal final design evidence"
verifier = "semantic"
tests = [
  "ethos openspec --lifecycle --json",
  "pytest -q tests/unit/test_openspec_product_substrate.py tests/unit/test_openspec_cache.py tests/unit/test_schema_validation_and_gates.py tests/unit/test_adopt_apply_sample.py",
  "openspec archive ethos-terminal-final-design --yes --json",
  "ethos prove --json",
]

[scope]
docs = [
  "docs/architecture/terminal-governance-product-design.md",
  "docs/governance/openspec-governance.md",
]
openspec = [
  "openspec/README.md",
  "openspec/specs/README.md",
  "openspec/specs/families.toml",
  "openspec/specs/capability.template.toml",
  "openspec/changes/README.md",
  "openspec/changes/template.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design",
]
schemas = ["system/schemas/kernel/capability-profile.schema.json"]

[boundary]
owner = "ethos-repository"
scope = "terminal final design, OpenSpec product substrate, and repository governance protocol"

[carriers]
openspec = "openspec/changes/archive/2026-07-02-ethos-terminal-final-design"
fallback = "Keep the previous terminal design and minimal OpenSpec profile checks if product substrate validation regresses."
kill_signal = "OpenSpec workspaces can validate officially while lacking product routing, claim binding, scaffold guidance, or evidence closeout boundaries."

[promotion]
targets = [
  "evidence/claims/ethos-terminal-final-design.toml",
  "evidence/terminal-final-design-2026-07-02.md",
  "openspec/README.md",
  "openspec/specs/README.md",
  "openspec/specs/families.toml",
  "openspec/specs/capability.template.toml",
  "openspec/changes/README.md",
  "openspec/changes/template.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/.openspec.yaml",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/proposal.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/design.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/tasks.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/specs/ethos-adapters/spec.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/specs/ethos-contracts/spec.md",
  "openspec/changes/archive/2026-07-02-ethos-terminal-final-design/specs/ethos-repository/spec.md",
  "openspec/specs/ethos-adapters/spec.md",
