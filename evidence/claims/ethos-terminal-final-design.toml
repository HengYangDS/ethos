[claim]
id = "ethos-terminal-final-design"
subject = "ethos:terminal-final-design"
state = "archived"
summary = "ETHOS terminal final design productizes OpenSpec substrate, capability routing, invocation admission, and evidence closeout guidance."

[evidence]
dated = "evidence/chronicle/terminal-final-design/2026-07-02.md"
sha256 = "5c3a46b9407a45d82aa678e03a599edf92504ff9a0bc648f61434fdc5e0d7bff"
evidence_ids = ["evidence:ethos-terminal-final-design"]
binding = "digest-bound terminal final design evidence"
verifier = "digest_only"
tests = [
  "ethos openspec --lifecycle --json",
  "pytest -q tests/unit/product/test_openspec_substrate.py tests/unit/product/test_openspec_cache.py tests/unit/governance/validation tests/unit/adoption/test_apply_sample.py",
  "openspec archive ethos-terminal-final-design --yes --json",
  "ethos prove --json",
]

[evidence.freshness]
mode = "historical"
[boundary]
owner = "ethos-repository"
scope = "terminal final design, OpenSpec product substrate, and repository governance protocol"

[carriers]
openspec = "openspec/changes/archive/2026-07-02-ethos-terminal-final-design"
fallback = "Keep the previous terminal design and minimal OpenSpec profile checks if product substrate validation regresses."
kill_signal = "OpenSpec workspaces can validate officially while lacking product routing, claim binding, scaffold guidance, or evidence closeout boundaries."

