  "packages/ethos/src/ethos/adapters/repo/status.py",
  "packages/ethos/src/ethos/adapters/repo/coordination.py",
  "system/schemas/kernel/workspace-status.schema.json",
  "packages/ethos/src/ethos/repository/policy/schema.py",
