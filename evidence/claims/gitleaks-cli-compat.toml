[claim]
id = "gitleaks-cli-compat"
subject = "ethos:gitleaks-cli-compat"
state = "active"
summary = "The secrets gate follows gitleaks 8.30.1 history-scan CLI without weakening current-tree or history scanning."

[evidence]
dated = "evidence/chronicle/gitleaks-cli-compat/2026-07-09.md"
sha256 = "31da265006c99a6b97bb4e5ce6d14da3ae49d865277d923cae6abc05718a4a48"
