  "openspec/changes/archive/2026-07-08-invalid-state-release-resource/proposal.md",
  "openspec/changes/archive/2026-07-08-invalid-state-release-resource/design.md",
  "openspec/changes/archive/2026-07-08-invalid-state-release-resource/tasks.md",
