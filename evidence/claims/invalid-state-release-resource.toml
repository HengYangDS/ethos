[claim]
id = "invalid-state-release-resource"
subject = "ethos:invalid-state-release-resource"
state = "active"
summary = "Installed ethos-core packages load the invalid-state taxonomy from a wheel projection when no source checkout is present."

[evidence]
dated = "evidence/chronicle/invalid-state-release-resource/2026-07-08.md"
sha256 = "ecfc6be72bb4aeada24d765f56e59defd07dc72a5bf4ab75d7fb67a0bd57c553"
evidence_ids = ["evidence:invalid-state-release-resource"]
binding = "semantic invalid-state taxonomy release resource"
verifier = "semantic"
tests = [
  "uv run --all-packages pytest tests/unit/kernel/test_invalid_states.py -q",
  "uv build --package ethos-core --wheel --out-dir /tmp/ethos-core-build-check",
]

[evidence.freshness]
mode = "historical"
[scope]
packages = ["ethos-core"]
tests = ["tests/unit/kernel/test_invalid_states.py"]

[boundary]
owner = "ethos-core"
scope = "Invalid-state taxonomy source contract and package resource fallback"

[carriers]
openspec = "openspec/changes/archive/2026-07-08-invalid-state-release-resource"
fallback = "Read system/invalid_states.toml in a source checkout; installed package usage requires the wheel projection."
kill_signal = "An installed ethos-core wheel cannot load invalid-state categories outside a repository checkout, or its resource is not projected from system/invalid_states.toml."

[promotion]
