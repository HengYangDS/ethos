  "uv run --package ethos ethos openspec --lifecycle --json",
  "uv run --package ethos ethos quality claims --json",
]

[boundary]
owner = "repository-governance"
scope = "Work Lane land dry-run readiness and exact-HEAD executed proof visibility"

[carriers]
openspec = "openspec/changes/archive/2026-07-09-land-proof-readiness-20260709"
fallback = "Treat Work Lane land dry-run as blocked and run ethos prove --execute --expect-head <HEAD> --json before landing."
