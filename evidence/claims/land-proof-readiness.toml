[claim]
id = "land-proof-readiness"
subject = "ethos:land-proof-readiness"
state = "active"
summary = "ETHOS land dry-run no longer reports Work Lane ready_to_land without valid executed proof for the exact HEAD."

[evidence]
dated = "evidence/chronicle/land-proof-readiness/2026-07-09.md"
sha256 = "705d82e623a76cf0c4b3f8d9d752c10d252d3c0d684b508b59b59b1acfc32510"
evidence_ids = ["evidence:land-proof-readiness"]
binding = "Semantic evidence binding for proof-grounded Work Lane land readiness."
verifier = "semantic"
tests = [
  "uv run --group dev pytest tests/unit/cli/test_contracts_land.py tests/unit/cli/test_contracts_closeout.py tests/unit/cli/test_lifecycle_hardening.py -q",
  "uv run --group dev ruff check packages/ethos/src/ethos/adapters/mutation/core.py packages/ethos/src/ethos/domain/land_support.py packages/ethos/src/ethos/surface/cli/root/lifecycle.py tests/unit/cli/test_contracts_land.py",
