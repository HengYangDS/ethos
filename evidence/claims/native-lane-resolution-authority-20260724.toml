evidence_ids = ["evidence:native-lane-resolution-authority-20260724"]
binding = "The approved design, non-destructive authority cut, live zero-inflight and zero-fence baseline, owned successor lane, active OpenSpec carrier, and read-only predecessor rollback carrier authorize implementation. The predecessor Claim remains active; this Claim will supersede it only after replacement behavior has implementation evidence, full proof, official archive evidence, and refreshed Claim/Chronicle binding. This initial binding does not claim completed code, passing gates, exact-HEAD proof, archive, supersession, land, accepted closeout, task-lane retirement, publication, or hosted execution."
verifier = "digest_only"
tests = [
  "openspec validate native-lane-resolution-authority --strict --json",
  "tools/ci/scripts/run-ethos-lane.sh openspec --lifecycle --json",
  "tools/ci/scripts/run-ethos-lane.sh quality claims --json",
  "tools/ci/scripts/run-python-tests.sh",
  "tools/ci/scripts/run-python-lint.sh",
  "tools/ci/scripts/run-ethos-lane.sh quality types --json",
  "tools/ci/scripts/run-ethos-lane.sh quality schemas --json",
  "tools/ci/scripts/run-ethos-lane.sh quality module-layout --json",
  "tools/ci/scripts/run-ethos-lane.sh quality code-size --json",
  "tools/ci/scripts/run-ethos-lane.sh quality no-compat --json",
  "tools/ci/scripts/run-ethos-lane.sh quality coupling-audit --json",
  "tools/ci/scripts/run-ethos-lane.sh prove --execute --expect-head <committed-head> --json",
