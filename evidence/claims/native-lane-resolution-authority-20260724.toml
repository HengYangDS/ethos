[evidence.freshness]
mode = "historical"

[boundary]
owner = "ethos-repository"
scope = "Clean linked ownerless Work Lane native admission, effect, current records, recovery, configured-role enforcement, and generic undeclared-executable prevention; no workspace-key migration, lane-start change, real foreign-lane retirement, predecessor-record mutation, remote publication, hosted mutation, distributed lock, or filesystem-lock claim."

[carriers]
openspec = "openspec/changes/native-lane-resolution-authority"
fallback = "Leave the exact lane, ref, worktree registration, path, fence, reservation, decision, and records untouched whenever any native binding or postcondition cannot be proved."
kill_signal = "Current effect authority consults predecessor records, requires an undeclared external verifier, accepts provider-specific contract fields, skips an invalid current payload, hard-codes the Work Lane prefix, or performs an unbound Git/worktree effect."

