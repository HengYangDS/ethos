[claim]
id = "protected-openspec-release-root-gate"
subject = "ethos:protected-openspec-release-root-gate"
state = "active"
summary = "ETHOS publish readiness blocks release-root active OpenSpec carriers that remain outside archive."

[evidence]
dated = "evidence/chronicle/protected-openspec-release-root-gate/2026-07-07.md"
sha256 = "cb7b3995ed90686914102eaa26bd460dd1ace09a7f3efabc928f5ecb8813af81"
evidence_ids = ["evidence:protected-openspec-release-root-gate"]
binding = "semantic release-root OpenSpec carrier readiness gate"
verifier = "semantic"
tests = [
  "uv run --group dev pytest tests/unit/audit/test_modes.py::test_release_readiness_blocks_active_change_on_non_current_release_root tests/unit/cli/test_contracts_closeout.py::test_publish_dry_run_blocks_release_root_active_openspec_residue -q",
  "ETHOS_ROOT=<workspace>/ethos-worktrees/protected-openspec-release-root-gate uv run --group dev ethos publish --json",
]

[scope]
packages = ["ethos"]
tests = [
  "tests/unit/audit/test_modes.py",
  "tests/unit/cli/test_contracts_closeout.py",
]

[boundary]
owner = "ethos-repository"
scope = "Release-root OpenSpec carrier publish-readiness gate"

[carriers]
openspec = "openspec/changes/archive/2026-07-07-protected-openspec-release-root-gate"
fallback = "Keep protected branch residue visible as advisory until publish readiness can block it."
kill_signal = "ethos publish can report local readiness while the release root contains active OpenSpec carriers."

[promotion]
targets = [
  "evidence/claims/protected-openspec-release-root-gate.toml",
  "evidence/chronicle/protected-openspec-release-root-gate/2026-07-07.md",
  "openspec/changes/archive/2026-07-07-protected-openspec-release-root-gate/proposal.md",
