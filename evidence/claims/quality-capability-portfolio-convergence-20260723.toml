subject = "quality:capability-portfolio-convergence"
state = "active"
summary = "ETHOS quality mechanisms have one ranked decision surface; import-linter and deptry now use owner scripts and declared proof floors, release wording is bounded, and future pilots cannot become permanent parallel implementations."

[evidence]
dated = "evidence/chronicle/quality-capability-portfolio-convergence-20260723/2026-07-23.md"
sha256 = "33f2b312dc7327d449dd523304bfc326d27e1e85229de4d319d3a6f7e0cc4f8a"
evidence_ids = ["evidence:quality-capability-portfolio-convergence-20260723"]
binding = "The dated inventory, ranked capability decisions, import/dependency gate repair, claim narrowing, focused tests, and source-budget observation bind this portfolio convergence."
verifier = "digest_only"
tests = [
  "tools/ci/scripts/run-config-lint.sh",
  "tools/ci/scripts/run-import-linter.sh",
  "tools/ci/scripts/run-dependency-hygiene.sh",
  "tools/ci/scripts/run-shell-lint.sh",
  "tools/ci/scripts/run-secrets-scan.sh",
  "tools/ci/scripts/run-python-tests.sh",
  "tools/ci/scripts/run-ethos-lane.sh quality source-budget --json",
  "uv run openspec validate --all --strict --json",
]

[evidence.freshness]
mode = "historical"

[boundary]
owner = "quality"
scope = "Quality capability admission, selected active gate repair, exact tool/standard claims, and roadmap/catalog truth; complete gate-registry projection, future pilot execution, and remote platforms remain separate."

[carriers]
openspec = "openspec/changes/quality-capability-portfolio-convergence"
fallback = "Revert a portfolio decision only with evidence that the selected mechanism cannot provide its distinct capability; do not restore a parallel permanent toolchain."
kill_signal = "An active tool bypasses its owner surface, a proof set omits a declared hard-floor gate, a tool or standard claim exceeds executed behavior, or a candidate leaves permanent parallel residue."

