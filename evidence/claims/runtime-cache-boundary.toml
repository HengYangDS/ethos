  "uv run --package ethos ethos quality generated-artifacts --json",
  "uv run --package ethos ethos quality docs-registry --json",
  "uv run --package ethos ethos openspec --lifecycle --json",
  "uv run --group dev ty check packages/ethos/src/ethos/surface/cli/campaign.py",
  "uv run --package ethos ethos quality types --json",
  "ETHOS_ACTOR=codex uv run --package ethos ethos parity shadow --adopter generic --target . --execute --write-evidence --timeout-seconds 45 --json",
  "uv run --package ethos ethos parity gaps --json",
]

[scope]
packages = ["ethos", "ethos-core"]
tests = [
  "tests/unit/governance/test_quality_regime.py",
  "tests/architecture/test_testing_platform.py",
  "tests/unit/governance/test_generated_artifact_topology.py",
