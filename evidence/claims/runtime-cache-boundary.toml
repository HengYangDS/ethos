[claim]
id = "runtime-cache-boundary"
subject = "ethos:runtime-cache-boundary"
state = "active"
summary = "ETHOS keeps pytest runtime cache under ignored build/runtime while configuration remains declarative."

[evidence]
dated = "evidence/chronicle/runtime-cache-boundary/2026-07-09.md"
sha256 = "5651ef3d995960543485b44c440ebca190c316669d6d217adb3a97e772c26ac0"
evidence_ids = ["evidence:runtime-cache-boundary"]
binding = "configuration/runtime/evidence boundary tests, generated-artifact topology contract, and OpenSpec carrier"
verifier = "digest_only"
tests = [
  "uv run --group dev pytest -q tests/unit/governance/test_quality_regime.py::test_pytest_runtime_cache_stays_out_of_config_plane tests/architecture/test_testing_platform.py::test_python_test_platform_is_parallel_timeout_bound_and_owner_scripted tests/architecture/test_testing_platform.py::test_runtime_artifacts_do_not_live_under_config_check_owners tests/unit/governance/test_generated_artifact_topology.py::test_contract_is_generic_and_declares_artifact_homes tests/unit/governance/test_generated_artifact_topology.py::test_path_policy_keeps_config_declarative_and_build_generated tests/unit/cli/test_generated_artifact_topology_cli.py::test_quality_generated_artifacts_command_reports_contract",
  "uv run --group dev ruff format --check tests/unit/governance/test_quality_regime.py tests/architecture/test_testing_platform.py tests/unit/governance/test_generated_artifact_topology.py tests/unit/cli/test_generated_artifact_topology_cli.py packages/ethos-core/src/ethos_core/contracts/artifacts/topology.py",
