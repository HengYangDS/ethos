[claim]
id = "shadow-false-negative-gate"
subject = "ethos:shadow-parity:false-negative-gate"
state = "active"
summary = "Shadow parity rejects external false negatives and accepts only equivalent-or-stricter external required-gap behavior before tracked evidence can close adopter parity."

[evidence]
dated = "evidence/shadow-false-negative-gate-2026-07-06.md"
sha256 = "abe0ef7c15037af807f59e7c48a9ea073540bd3575e366f659c2650c3f7be6b1"
evidence_ids = ["evidence:shadow-false-negative-gate"]
binding = "runtime shadow comparison, tracked parity evidence validation, schema contract, and focused test proof"
verifier = "semantic"
tests = [
  "uv run --group dev pytest tests/unit/product/test_parity.py -q",
  "uv run --group dev pytest tests/unit/product/test_parity_generic.py tests/unit/governance/test_validation_gates.py tests/unit/cli/test_contracts.py -q",
  "uv run --package ethos ethos parity shadow --adopter generic --target . --execute --timeout-seconds 35 --write-evidence --json",
  "uv run --package ethos ethos parity gaps --json",
]

[scope]
packages = ["ethos"]
schemas = ["system/schemas/kernel/shadow-parity.schema.json"]
tests = [
  "tests/unit/product/test_parity.py",
  "tests/unit/product/test_parity_generic.py",
  "tests/unit/governance/test_validation_gates.py",
  "tests/unit/cli/test_contracts.py",
]
docs = [
  "docs/governance/capability-parity-ledger.md",
  "docs/governance/adopter-boundary-and-retirement.md",
]

[boundary]
owner = "ethos-repository"
scope = "Runtime and tracked-evidence false-negative protection for external-vs-embedded shadow parity"

[carriers]
openspec = "openspec/changes/shadow-false-negative-gate"

fallback = "Keep embedded fallback active for any adopter whose external shadow evidence omits false-negative coverage or reports nonzero false negatives."
kill_signal = "Tracked parity evidence can close adopter retirement while external output misses embedded blocking required gaps."

[promotion]
targets = [
  "evidence/claims/shadow-false-negative-gate.toml",
  "evidence/shadow-false-negative-gate-2026-07-06.md",
  "evidence/parity/generic-shadow.json",
  "openspec/changes/shadow-false-negative-gate/proposal.md",
  "openspec/changes/shadow-false-negative-gate/design.md",
  "openspec/changes/shadow-false-negative-gate/tasks.md",
  "openspec/changes/shadow-false-negative-gate/specs/ethos-repository/spec.md",
  "packages/ethos/src/ethos/adapters/shadow.py",
  "packages/ethos/src/ethos/repository/evidence/parity.py",
  "packages/ethos/src/ethos/repository/evidence/parity_validation.py",
  "packages/ethos/src/ethos/repository/policy/schema_samples.py",
  "system/schemas/kernel/shadow-parity.schema.json",
  "tests/unit/product/test_parity.py",
  "tests/unit/product/test_parity_generic.py",
]
