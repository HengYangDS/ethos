binding = "Completed roadmap baseline, mechanism comparison audit, closeout carrier, active owner gates, and explicit future adapter sequencing evidence binding"
verifier = "digest_only"
tests = [
  "tools/ci/scripts/run-dependency-hygiene.sh",
  "tools/ci/scripts/run-json-schema-check.sh",
  "tools/ci/scripts/run-prose-check.sh",
  "tools/ci/scripts/run-hosted-provider-observation.sh",
  "tools/ci/scripts/run-python-vulnerability-audit.sh",
  "uv run --package ethos pytest tests/architecture/test_dependency_prose_schema_gates.py tests/architecture/test_hosted_provider_observation.py tests/architecture/test_ci_provider_projections.py tests/architecture/test_format_architecture_runbook_mcp.py tests/unit/cli/test_contracts.py::test_quality_tool_profiles_command_reports_adapter_boundaries -q",
