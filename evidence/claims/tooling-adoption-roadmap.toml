  "tools/ci/scripts/run-config-lint.sh",
  "tools/ci/scripts/run-markdown-lint.sh",
  "uv run --package ethos ethos quality schemas --json",
  "uv run --package ethos ethos prove --execute --expect-head <head> --json",
  "tools/ci/scripts/run-closeout-evidence-manifest.sh",
]

[evidence.freshness]
mode = "historical"
[boundary]
external_signing_image_scan_osv_adapters = "deferred_follow_up_work_lanes"
local_dependency_prose_schema_observation_pip_audit_gates = "active_owner_surfaces"
owner = "ethos-governance"
scope = "Planning, comparison, and selected gate surfaces for GitHub/GitLab provider parity, local CI emulators, quality and architecture tooling, OpenSpec schema customization, Superpowers boundary, optional tool adapters, and remaining OSV, image-scan, signing, and release adapters"

[carriers]
openspec = "openspec/changes/archive/2026-07-09-complete-planning-closeout"
fallback = "Keep current active owner gates and adapter boundaries; defer only separately scoped future adapters such as OSV, image scanning, external signing, and richer runner matrices."
kill_signal = "A planned adapter is reported as an active ETHOS gate, or GitHub/GitLab/Superpowers/Nox/Pixi/Pants/Backlog becomes product ontology instead of a bounded adapter."

