[claim]
id = "worktree-governance-campaign-20260718"
subject = "ethos:repo-first-worktree-governance-campaign"
state = "active"
change_id = "repo-first-worktree-governance-campaign-20260718"
summary = "The dedicated repo-first worktree-governance campaign scopes serial local implementation and selected-campaign closeout without asserting recovery, migration, retirement, remote, or foreign-lane completion."

[evidence]
dated = "evidence/chronicle/worktree-governance-campaign-20260718/2026-07-18.md"
sha256 = "2ce30cc73a9d18e147bb2805194fa1dce2374ad3f73e60aa9f2b536c89afce04"
evidence_ids = ["evidence:worktree-governance-campaign-20260718"]
binding = "Dedicated campaign manifest, selector-bounded closeout report, active OpenSpec carrier, focused regressions, and a dated local-only Chronicle bind the bootstrap boundary."
verifier = "digest_only"
tests = [
  "pytest -q tests/unit/cli/test_contracts_proof.py::test_campaign_closeout_scopes_to_selected_campaign tests/unit/cli/test_contracts_proof.py::test_campaign_closeout_unknown_selector_reports_gap",
  "openspec validate repo-first-worktree-governance-campaign-20260718 --strict --json",
  "ethos openspec --lifecycle --json",
  "ethos quality claims --json",
  "ethos prove --execute --expect-head <committed-head> --json",
]

[evidence.freshness]
mode = "historical"

[boundary]
owner = "ethos-repository"
scope = "Dedicated strict-serial repo-first worktree-governance campaign bootstrap and selected-campaign read-only local closeout."

[carriers]
openspec = "openspec/changes/repo-first-worktree-governance-campaign-20260718"
