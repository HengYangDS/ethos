[extension]
id = "independent-verification"
kind = "reference-implementation"
status = "optional"
default_enabled = false
execution = "provider-local"
entrypoint = "adapters/independent_identity/reference_verifier.py"

[boundary]
owns = "A constrained, one-shot reference implementation for provider-owned independent proof re-execution."
must_not = [
  "Become an ETHOS lifecycle command or a dynamically loaded product package.",
  "Store provider keys, accounts, receipt stores, or scheduler state in a governed repository.",
  "Create an adopter prerequisite or change the default-off policy.",
]
