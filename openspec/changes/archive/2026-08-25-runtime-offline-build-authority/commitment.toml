[[experiment_protocols]]
id = "protocol:runtime-offline-build-authority"
hypothesis_ids = [
  "hypothesis:runtime-offline-build-authority",
]
kind = "experiment:repository"

[experiment_protocols.body]
steps = [
  "reject a drifted active environment before wheel output",
  "install from a source checkout with an empty uv cache",
  "relocate the first repository and self-repair through its package-only successor",
]
