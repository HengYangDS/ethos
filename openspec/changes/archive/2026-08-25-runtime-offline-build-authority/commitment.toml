schema_version = 2
id = "change:runtime-offline-build-authority"
intent = "Make accepted source runtime installation consume the repository-locked build backend without relying on ambient uv cache state."
subjects = [
  "repository:ethos",
]
scope = [
  "docs/architecture/runner-and-mutation.md",
  "openspec/changes/runtime-offline-build-authority/**",
  "openspec/changes/runtime-offline-build-authority/.openspec.yaml",
  "openspec/specs/distribution/spec.md",
  "src/ethos/adapters/repo/hook_runtime_install.py",
  "tests/architecture/test_local_install_smoke.py",
  "tests/unit/cli/test_hook_runtime.py",
  "tests/unit/coverage_closure/test_hook_runtime_install_public_resolution.py",
]
invariants = [
  "failed_bootstrap_validation_precedes_runtime_or_hook_activation",
  "immutable_runtime_contains_only_the_locked_production_closure_and_exact_ethos_wheel",
  "source_runtime_builds_only_from_a_lock_verified_active_environment",
  "uv_lock_owns_dependency_resolution_while_cache_remains_disposable",
]
acceptance = [
  "package_only_runtime_relocates_and_self_repairs_without_uv_or_a_predecessor_path",
  "runtime_dependency_pruning_requires_exported_hashes_and_strict_validation",
  "source_environment_drift_blocks_before_runtime_materialization",
  "source_hook_install_succeeds_with_an_empty_uv_cache_from_a_lock_current_environment",
]
risks = [
  "copying_the_source_environment_could_retain_dev_dependencies_without_exact_pruning",
  "disabling_build_isolation_would_be_unsafe_without_a_prior_lock_currentness_check",
]
authority_refs = [
  "docs/governance/product-design-contract.md",
  "openspec/specs/distribution/spec.md",
  "user_instruction",
  "uv.lock",
]
predecessors = [
  "527fc9bbfcb6960a1993a8963850f83050a93df21ca2a211e73a46649c6d6ed0",
]
selected_attestations = []

[[dependencies]]
kind = "dependency:requires"
target = "lock:uv"

[dependencies.attributes]
mode = "offline"

[[hypotheses]]
id = "hypothesis:runtime-offline-build-authority"
kind = "hypothesis:causal"

[hypotheses.body]
proposition = "A lock-current source environment and a manifest-bound Git-common package store are sufficient supply for offline source and package-only runtime projection."

[[falsifiers]]
id = "falsifier:empty-cache-needs-external-supply"
hypothesis_id = "hypothesis:runtime-offline-build-authority"
kind = "observation:test"

[falsifiers.body]
path = "tests/architecture/test_local_install_smoke.py::test_source_checkout_hook_install_does_not_require_an_ambient_uv_cache"

[[falsifiers]]
id = "falsifier:package-runtime-needs-predecessor"
hypothesis_id = "hypothesis:runtime-offline-build-authority"
kind = "observation:test"

[falsifiers.body]
path = "tests/architecture/test_local_install_smoke.py::test_hook_install_runs_from_an_isolated_wheel_without_checkout"

[[falsifiers]]
