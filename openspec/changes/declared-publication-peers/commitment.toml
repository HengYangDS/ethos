invariants = [
  "only explicitly declared publication peers participate in admission observation reconciliation and publish",
  "every declared peer has one unique provider name and Git remote while absent providers mint no requirement",
  "CI surfaces are optional declared capabilities and missing optional CI never invalidates a repository-only peer",
  "package-only hook installation removes the retired common-dir ethos-runtime-python locator only after the exact runtime and launchers are valid",
]
acceptance = [
  "GitLab-only release declaration passes status plan prove and publish readiness without a GitHub remote or GitHub CI file",
  "multi-peer declarations remain independently observed and duplicate provider or remote identities fail closed",
