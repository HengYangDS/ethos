schema: spec-driven
context: |
  ETHOS is the repository governance product. It treats OpenSpec as the
  sole tracked Change intent. Source, tests and schemas implement its contracts;
  exact Git objects and selected Attestations establish implementation facts
  and bounded proof without replacing that intent.
rules:
  proposal:
    - Explain the problem, intended change, and explicit out-of-scope boundary.
    - Name affected capabilities and include ETHOS routing metadata.
  specs:
    - Use ADDED, MODIFIED, REMOVED, or RENAMED Requirements sections.
    - Include at least one Scenario with WHEN and THEN clauses for each
      requirement.
  tasks:
    - Describe bounded actions and their completion checks using the official
      task checkboxes. Record progress here; reference existing evidence when
      needed instead of copying execution results or debugging narratives.
    - Treat exact-current proof as an executable lifecycle precondition, not
      a result to append to the source snapshot that the proof verifies.
  design:
    - Record architecture, tradeoffs, authority boundaries, and migration risks
      for non-trivial changes.
