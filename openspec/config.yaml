schema: spec-driven
context: |
  ETHOS is the repository governance product. It treats OpenSpec as the
  sole tracked Change intent. Source, tests and schemas implement its contracts;
  exact Git objects and selected Attestations establish implementation facts
  and bounded proof without replacing that intent.
  Resolve semantic responsibilities through
  docs/governance/docs-registry.md#semantic-authority-and-carrier-boundaries
  and the Product Design Contract before authoring or projecting content.
rules:
  proposal:
    - Follow the selected official proposal template. Keep Why, What Changes,
      Capabilities, and Impact concise; mark breaking changes and state the
      out-of-scope boundary without copying implementation or execution history.
    - Reuse exact existing capability paths. New capabilities name cohesive
      observable behavior; include the existing ETHOS routing metadata.
  specs:
    - Follow the selected official spec template and exact capability path.
      Change deltas use native requirement operations; main specs retain Purpose
      and Requirements, not active-change operations or implementation history.
    - State observable SHALL or MUST obligations, with a four-level Scenario
      heading and WHEN and THEN clauses for each requirement. Keep existing
      MODIFIED requirement blocks complete, including every retained scenario.
    - Keep observable obligations and falsifiers here; reference the rationale
      and implementation design rather than maintaining duplicate contracts.
  tasks:
    - Use official checkboxes under numbered groups, in dependency order.
      Keep stable task identities and truthful states; each task states one
      bounded action and an observable completion check. Group numbering and
      Markdown nesting express the same hierarchy.
    - Keep only necessary short dependency or evidence references. Preserve
      original execution history in Git and native evidence, not in tasks or
      design prose; never create a parallel progress ledger.
    - Separate implementation tasks from lifecycle preconditions and effects.
      Keep exact-current proof outside the snapshot it verifies; a Change must
      not require its own archive or Lane retirement as a completed task before
      that effect is admitted. Preserve required workflow follow-up as plain
      bullets under the official optional Workflow follow-up section; task
      completion does not prove closeout.
  design:
    - Follow the selected official design template for non-trivial changes with
      Context, Goals / Non-Goals, Decisions, and Risks / Trade-offs. Include
      Migration Plan when applicable and only genuinely deferrable Open Questions.
    - Explain architecture, alternatives, rationale and authority boundaries;
      reference proposal and specs rather than restating them. Split independent
      long topics into linked semantic subdirectories without losing meaning.
      Keep execution history and full logs in their existing native evidence owners.
operations:
  apply:
    guidance:
      - Resolve current ETHOS status and exact-path admission before writes;
        instructions and artifact completeness are not mutation authority.
      - Follow docs/governance/docs-registry.md for semantic ownership,
        README-only directory navigation and human/agent reading consistency.
  archive:
    guidance:
      - Use current ETHOS admission and official archive semantics; preserve
        complete deltas, evidence bindings and migrated incoming references.
      - Observe the actual result before retrying and reconcile affected
        reader projections without copying task state into docs.
