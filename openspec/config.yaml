schema: spec-driven
context: |
  ETHOS is the repository governance product. It treats OpenSpec as the
  sole tracked Change intent. Source, tests and schemas implement its contracts;
  exact Git objects and selected Attestations establish implementation facts
  and bounded proof without replacing that intent.
  Resolve semantic responsibilities through
  docs/governance/docs-registry.md#semantic-authority-and-carrier-boundaries
  and the Product Design Contract before authoring or projecting content.
rules:
  proposal:
    - Follow the official proposal template. State why the change is needed,
      what changes, the affected capabilities and the impact; mark breaking
      changes and name the out-of-scope boundary without copying implementation
      or execution history.
    - Reuse exact existing capability paths. New capabilities name cohesive
      observable behavior; include the existing ETHOS routing metadata.
  specs:
    - Use the native delta operations ADDED, MODIFIED, REMOVED and RENAMED at
      exact capability paths. A MODIFIED requirement restates its complete block
      with every retained scenario; main specs keep only Purpose and
      Requirements.
    - State each requirement as an observable SHALL or MUST obligation with at
      least one Scenario whose WHEN and THEN clauses can falsify it; describe
      behavior and its boundaries, not implementation names.
    - Keep observable obligations and falsifiers here; reference the rationale
      and implementation design rather than maintaining duplicate contracts.
  tasks:
    - Use official checkboxes under numbered groups in dependency order, with
      numbering and nesting expressing one hierarchy. Each task keeps a stable
      identity, states one bounded action with its observable completion
      condition, and carries a truthful state.
    - Keep only short evidence references or current dependencies in tasks.
      Preserve execution history, logs and originals with their Git, CI and
      native evidence owners, never in tasks, design prose or a parallel ledger.
    - Separate implementation tasks from lifecycle preconditions and effects; a
      Change never records its own landing, archive or Lane retirement as a
      completed task.
    - Keep exact-current proof outside the snapshot it verifies. Preserve
      required workflow follow-up as plain bullets under the official optional
      Workflow follow-up section; task completion does not prove closeout.
  design:
    - Follow the official design template for a non-trivial change. Explain its
      architecture, alternatives, rationale, authority boundaries and migration
      risks, give each behavior one semantic owner, and reference the proposal
      and specs instead of restating them.
    - Keep execution history, logs and acceptance reports with their Git, CI and
      native evidence owners, not in design prose.
    - Use the template's Context, Goals / Non-Goals, Decisions and Risks /
      Trade-offs sections; include Migration Plan when applicable and only
      genuinely deferrable Open Questions.
    - Split independent long topics into linked semantic subdirectories without
      losing meaning.
operations:
  apply:
    guidance:
      - Resolve current ETHOS status and exact-path admission before writes;
        instructions and artifact completeness are not mutation authority.
      - Follow docs/governance/docs-registry.md for semantic ownership,
        README-only directory navigation and human/agent reading consistency.
  archive:
    guidance:
      - Use current ETHOS admission and official archive semantics; preserve
        complete deltas, evidence bindings and migrated incoming references.
      - Observe the actual result before retrying and reconcile affected
        reader projections without copying task state into docs.
