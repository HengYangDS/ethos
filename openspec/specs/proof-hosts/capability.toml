family = "proof"
primary_invariant = "The proof-hosts capability protects conformance, fixture, parity, replay, sample repository, and proof-host behavior."
routing_question = "Does this change alter conformance fixtures, parity evidence, replay, or proof hosts?"
decision_axes = ["lifecycle", "surface", "authority"]
boundary_rules = [
  "Capability IDs name stable product semantics, not implementation package names.",
  "OpenSpec records are specification carriers, not truth owners.",
  "Provider, adopter, or host-specific state remains in adapters, profiles, or evidence.",
]
aliases = []

[owner]
package = "ethos"
scope = "conformance, fixture, parity, replay, sample repository, and proof-host behavior"

[recommended_facets]
lifecycle = ["authoring", "validation", "runtime", "archive", "release"]
surface = ["cli", "docs", "schema", "openspec", "evidence", "skill", "scaffold", "ci", "package"]
authority = ["source", "test", "schema", "docs", "openspec", "claim", "evidence"]

[proof_profile]
default_command = "ethos prove --json"
executed_command = "ethos prove --execute --json"
required_gates = ["claims", "schemas"]
