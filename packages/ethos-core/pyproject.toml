[project]
name = "ethos-core"
version = "0.1.0a1"
description = "Pure ETHOS core kernel primitives"
requires-python = ">=3.12"
dependencies = [
  "cel-python>=0.5,<0.6",
  "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"src/ethos_core/data/commands.toml" = "ethos_core/data/commands.toml"
"src/ethos_core/data/gates.toml" = "ethos_core/data/gates.toml"
"src/ethos_core/data/invalid_states.toml" = "ethos_core/data/invalid_states.toml"
"src/ethos_core/data/workflows.toml" = "ethos_core/data/workflows.toml"
"src/ethos_core/data/coupling.toml" = "ethos_core/data/coupling.toml"
"src/ethos_core/data/standards.toml" = "ethos_core/data/standards.toml"
"src/ethos_core/data/evidence_layout.toml" = "ethos_core/data/evidence_layout.toml"
"src/ethos_core/data/generated_artifact_topology.toml" = "ethos_core/data/generated_artifact_topology.toml"

[tool.hatch.build.targets.sdist.force-include]
"build_hook.py" = "build_hook.py"
"../../system/commands.toml" = "src/ethos_core/data/commands.toml"
"../../system/gates.toml" = "src/ethos_core/data/gates.toml"
"../../system/invalid_states.toml" = "src/ethos_core/data/invalid_states.toml"
"../../system/workflows.toml" = "src/ethos_core/data/workflows.toml"
"../../system/coupling.toml" = "src/ethos_core/data/coupling.toml"
"../../system/standards.toml" = "src/ethos_core/data/standards.toml"
"../../system/policies/evidence-layout.toml" = "src/ethos_core/data/evidence_layout.toml"
"../../system/policies/generated-artifact-topology.toml" = "src/ethos_core/data/generated_artifact_topology.toml"
