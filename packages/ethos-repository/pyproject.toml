[project]
name = "ethos-repository"
version = "0.1.0a1"
description = "ETHOS repository lifecycle semantics"
requires-python = ">=3.12"
dependencies = [
  "ethos-assistants",
  "ethos-contracts",
  "ethos-core",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
