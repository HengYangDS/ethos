[project]
name = "ethos"
version = "0.1.0a2"
description = "ETHOS public command plane"
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=3.20",
  "defusedxml>=0.7",
  "ethos-core",
  "jsonschema>=4.23",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
  "tomli-w>=1.2,<2",
]

[project.scripts]
ethos = "ethos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
