[project]
name = "ethos"
version = "0.1.0a1"
description = "ETHOS public command plane"
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=3.20",
  "ethos-adapters",
  "ethos-assistants",
  "ethos-contracts",
  "ethos-core",
  "ethos-repository",
]

[project.scripts]
ethos = "ethos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
