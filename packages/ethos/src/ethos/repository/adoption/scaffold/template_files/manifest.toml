[[family]]
id = "kernel"
title = "Pure Kernel"
scope = "pure kernel result and action graph semantics"
profile_family = "kernel"
owner = "ethos-core"

[[family]]
id = "contracts"
title = "Provider-neutral Contracts"
scope = "provider-neutral repository contracts"
profile_family = "contracts"
owner = "ethos-core"

[[family]]
id = "repository-governance"
title = "Repository Lifecycle Governance"
scope = "repository lifecycle governance"
profile_family = "repository-governance"
owner = "ethos"

[[family]]
id = "adapters"
title = "Provider Adapters"
scope = "provider and projection adapters"
profile_family = "adapters"
owner = "ethos"

[[family]]
id = "command-plane"
title = "Public Command Plane"
scope = "public ETHOS command plane"
profile_family = "surfaces"
owner = "ethos"

[[family]]
id = "assistant-projections"
title = "Assistant And Context Boundaries"
scope = "assistant and context projection boundaries"
profile_family = "surfaces"
owner = "ethos"

[[family]]
id = "distribution"
title = "Distribution Adapters"
scope = "distribution and host package surfaces"
profile_family = "surfaces"
owner = "ethos"

[[family]]
id = "quality"
title = "Quality And Determinism"
scope = "quality, determinism, docs profile, and proof policy"
profile_family = "quality"
owner = "ethos-core"

[[family]]
id = "proof-hosts"
title = "Conformance And Parity Proof"
scope = "conformance, fixture, and parity proof hosts"
profile_family = "proof"
owner = "ethos"

[[skill]]
id = "ethos-repository-governance"
[[skill.capabilities]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]
[[skill.capabilities]]
id = "ethos.plan"
kind = "command_readonly"
command = ["ethos", "plan", "--changed", "--json"]
[[skill.capabilities]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]
[[skill.capabilities]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--json"]

[[skill]]
id = "ethos-skill-portfolio-governance"
[[skill.capabilities]]
id = "ethos.playbooks.check"
kind = "command_readonly"
command = ["ethos", "playbooks", "check", "--mode", "v2-strict", "--json"]
[[skill.capabilities]]
id = "ethos.playbooks.route"
kind = "command_readonly"
command = ["ethos", "playbooks", "route", "--changed", "--json"]
[[skill.capabilities]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]

[[skill]]
id = "ethos-adoption-profile-governance"
[[skill.capabilities]]
id = "ethos.adopt"
kind = "command_mutation_guarded"
command = ["ethos", "adopt", "--json"]
guard = "read-only unless --apply and --authorize are present; apply requires explicit head-bound authorization"
[[skill.capabilities]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]
[[skill.capabilities]]
id = "ethos.playbooks.check"
kind = "command_readonly"
command = ["ethos", "playbooks", "check", "--mode", "v2-strict", "--json"]
[[skill.capabilities]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]
[[skill.capabilities]]
id = "ethos.prove"
kind = "command_proof"
command = ["ethos", "prove", "--json"]
