[project]
name = "ethos-product-monorepo"
version = "0.1.0a1"
description = "ETHOS product workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "cyclopts>=3.20",
  "import-linter>=2.12",
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/ethos",
  "packages/ethos-core",
]

[tool.uv.sources]
ethos-core = { workspace = true }

