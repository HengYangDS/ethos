[project]
name = "ethos"
version = "0.1.0a2"
description = "Repository change trust protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cel-expr-python>=0.1.3,<0.2",
  "cyclopts>=3.20",
  "jsonschema>=4.23",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
  "tomli-w>=1.2,<2",
]

[project.scripts]
ethos = "ethos.cli:main"

[dependency-groups]
dev = [
  "check-jsonschema>=0.37.4",
  "codespell>=2.4.2",
  "deptry>=0.25.1",
  "hypothesis>=6.0,<7",
  "import-linter>=2.12",
  "pre-commit>=4.6.1",
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
  "ruff>=0.8",
  "ty>=0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethos"]

[tool.hatch.build.targets.wheel.force-include]
"system/gates.toml" = "ethos/data/gates.toml"
"system/invalid_states.toml" = "ethos/data/invalid_states.toml"
"system/lifecycle.toml" = "ethos/data/lifecycle.toml"
"system/schemas/contracts/lifecycle.schema.json" = "ethos/data/system/schemas/contracts/lifecycle.schema.json"
"system/coupling.toml" = "ethos/data/coupling.toml"
"system/standards.toml" = "ethos/data/standards.toml"
"system/policies/evidence-layout.toml" = "ethos/data/evidence_layout.toml"
"system/policies/generated-artifact-topology.toml" = "ethos/data/generated_artifact_topology.toml"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/system",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
cache_dir = "build/runtime/tool-cache/pytest"
