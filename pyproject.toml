[project]
name = "ethos-product-monorepo"
version = "0.1.0a1"
description = "ETHOS product workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "cyclopts>=3.20",
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/ethos",
  "packages/ethos-adapters",
  "packages/ethos-assistants",
  "packages/ethos-contracts",
  "packages/ethos-core",
  "packages/ethos-quality",
  "packages/ethos-repository",
  "packages/ethos-test",
]

[tool.uv.sources]
ethos-adapters = { workspace = true }
ethos-assistants = { workspace = true }
ethos-contracts = { workspace = true }
ethos-core = { workspace = true }
ethos-quality = { workspace = true }
ethos-repository = { workspace = true }
ethos-test = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/ethos/src",
  "packages/ethos-adapters/src",
  "packages/ethos-assistants/src",
  "packages/ethos-contracts/src",
  "packages/ethos-core/src",
  "packages/ethos-quality/src",
  "packages/ethos-repository/src",
  "packages/ethos-test/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Tightened rule set — correctness + determinism + elegance (道: raise the quality floor,
# make low-quality unrepresentable). E/F/I/UP/B/SIM are the base; the rest add:
# comprehension clarity (C4), return hygiene (RET), pathlib (PTH), pytest style (PT),
# naming (N), builtin-shadowing (A), implicit-str-concat (ISC), flake8-flynt (FLY),
# perf (PERF), typing-only imports (TC), tidy imports (TID), unnecessary code (PIE),
# and ruff's own checks (RUF).
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "C4", "RET", "PTH", "PT", "N", "A", "ISC", "FLY", "PERF", "TC", "TID", "PIE", "RUF",
]
# Ratchet: correctness rules enforced everywhere, zero tolerance. A small set of pre-existing
# STYLE debt is frozen (not permanent — dissolves during the package-split migration that
# rewrites these modules). New code gets the full strict set.
ignore = [
    "PERF401",  # manual list-comprehension: 38 in junk-drawer modules to be dissolved
]

[tool.ruff.lint.per-file-ignores]
# Test data lines are legitimately long (assertion payloads/fixtures); logic still wraps.
"tests/**" = ["E501"]
# `id` on a widely-called classmethod — rename deferred to the package-split migration.
"packages/ethos-repository/src/ethos_repository/evidence.py" = ["A002"]

