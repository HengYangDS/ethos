[project]
name = "ethos"
dynamic = ["version"]
description = "Repository change trust protocol"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "anyio>=4.15.1",
  "cel-expr-python>=0.1.3",
  "codespell>=2.4.3",
  "cyclopts>=5.3.0",
  "fastmcp>=4.1.3",
  "filelock>=4.2.4",
  "jsonschema>=4.26.0",
  "lychee-bin>=0.24.2",
  "markdown-it-py>=4.2.0",
  "mcp>=2.3.0",
  "packaging>=26.3",
  "platformdirs>=4.13.5",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
  "ruff>=0.17.2",
  "shfmt-py>=4.2.0",
  "semver>=3.1.0",
  "tomli-w>=1.2.0",
  "uv>=0.13.5",
  "yamllint>=1.38.0",
]

[project.scripts]
ethos = "ethos.cli:console_main"

[tool.uv]
prerelease = "disallow"

[dependency-groups]
dev = [
  "allure-pytest>=2.16.2",
  "deptry>=0.25.1",
  "editables>=0.6",
  "hatchling>=1.32.4",
  "hypothesis>=6.170.9",
  "import-linter>=2.15",
  "mutmut>=3.8.0",
  "nox>=2026.10.20",
  "pillow>=13.0.0",
  "pre-commit>=4.7.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-reportlog>=1.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "shellcheck-py>=0.11.0.1",
  "ty>=0.0.91",
  "uv>=0.13.5",
]

[build-system]
requires = ["editables>=0.6", "hatchling>=1.32.4", "pydantic>=2.14.1", "tomli-w>=1.2.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/ethos/adapters/repo/runtime/source.py"
expression = "source_distribution_version()"
search-paths = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ethos"]

[tool.hatch.build.targets.wheel.force-include]
".config/ci/verification.cue" = "ethos/resources/.config/ci/verification.cue"
"system/README.md" = "ethos/resources/system/README.md"
"system/axioms.md" = "ethos/resources/system/axioms.md"
"system/gates.toml" = "ethos/resources/system/gates.toml"
"system/surfaces.toml" = "ethos/resources/system/surfaces.toml"
"package.json" = "ethos/resources/package.json"
"package-lock.json" = "ethos/resources/package-lock.json"
"pyproject.toml" = "ethos/resources/pyproject.toml"
"uv.lock" = "ethos/resources/uv.lock"
".config/mise/config.toml" = "ethos/resources/.config/mise/config.toml"
".config/mise/mise.lock" = "ethos/resources/.config/mise/mise.lock"
".config/checks/prettier/prettier.toml" = "ethos/resources/.config/checks/prettier/prettier.toml"
".config/checks/ruff/ruff.toml" = "ethos/resources/.config/checks/ruff/ruff.toml"
".config/checks/codespell/codespell.toml" = "ethos/resources/.config/checks/codespell/codespell.toml"
".config/checks/taplo/taplo.toml" = "ethos/resources/.config/checks/taplo/taplo.toml"
".config/checks/yamllint/.yamllint.yaml" = "ethos/resources/.config/checks/yamllint/.yamllint.yaml"
".config/checks/format-selection/policy.toml" = "ethos/resources/.config/checks/format-selection/policy.toml"
".config/checks/markdownlint-cli2/.markdownlint-cli2.yaml" = "ethos/resources/.config/checks/markdownlint-cli2/.markdownlint-cli2.yaml"
".config/checks/lychee/lychee.toml" = "ethos/resources/.config/checks/lychee/lychee.toml"
".config/checks/vale" = "ethos/resources/.config/checks/vale"
"VERSION" = "ethos/resources/VERSION"
"system/schemas" = "ethos/resources/system/schemas"
"docs/governance/product-design-contract.md" = "ethos/resources/docs/governance/product-design-contract.md"
"docs/governance/docs-registry.md" = "ethos/resources/docs/governance/docs-registry.md"
"docs/governance/repository-profile-contract.md" = "ethos/resources/docs/governance/repository-profile-contract.md"
"docs/governance/release-governance.md" = "ethos/resources/docs/governance/release-governance.md"
"docs/governance/adopter-boundary-and-retirement.md" = "ethos/resources/docs/governance/adopter-boundary-and-retirement.md"
"docs/governance/config-boundary-model.md" = "ethos/resources/docs/governance/config-boundary-model.md"
"docs/governance/openspec-governance.md" = "ethos/resources/docs/governance/openspec-governance.md"
"docs/concepts/kernel-model.md" = "ethos/resources/docs/concepts/kernel-model.md"
"docs/reference/glossary.md" = "ethos/resources/docs/reference/glossary.md"
"docs/reference/command-plane.md" = "ethos/resources/docs/reference/command-plane.md"
"docs/guides/quickstart.md" = "ethos/resources/docs/guides/quickstart.md"
"rules" = "ethos/resources/rules"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/ci/openspec_runtime_hook.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/ci/openspec_runtime_hook.py"

[tool.hatch.build.targets.sdist]
only-include = [
  ".config/ci/verification.cue",
  "src",
  "system",
  "docs/governance/product-design-contract.md",
  "docs/governance/docs-registry.md",
  "docs/governance/repository-profile-contract.md",
  "docs/governance/release-governance.md",
  "docs/governance/adopter-boundary-and-retirement.md",
  "docs/governance/config-boundary-model.md",
  "docs/governance/openspec-governance.md",
  "docs/concepts/kernel-model.md",
  "docs/reference/glossary.md",
  "docs/reference/command-plane.md",
  "docs/guides/quickstart.md",
  "rules",
  "README.md",
  "LICENSE",
  "package.json",
  "package-lock.json",
  "pyproject.toml",
  "uv.lock",
  ".config/mise/config.toml",
  ".config/mise/mise.lock",
  ".config/checks/prettier/prettier.toml",
  ".config/checks/ruff/ruff.toml",
  ".config/checks/codespell/codespell.toml",
  ".config/checks/taplo/taplo.toml",
  ".config/checks/yamllint/.yamllint.yaml",
  ".config/checks/format-selection/policy.toml",
  ".config/checks/markdownlint-cli2/.markdownlint-cli2.yaml",
  ".config/checks/lychee/lychee.toml",
  ".config/checks/vale",
  "VERSION",
  "tools/ci/openspec_runtime_hook.py",
]

[tool.mutmut]
source_paths = ["src/ethos"]
only_mutate = ["src/ethos/contracts/verdict.py"]
pytest_add_cli_args_test_selection = ["tests/unit/kernel/test_mutation_decision.py"]
mutate_only_covered_lines = true
