[project]
name = "ethos"
version = "0.1.0a2"
description = "Repository change trust protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cel-expr-python>=0.1.3",
  "cyclopts>=4.22.5",
  "jsonschema>=4.26.0",
  "nodejs-wheel-binaries>=24.16.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "tomli-w>=1.2.0",
]

[project.scripts]
ethos = "ethos.cli:main"

[dependency-groups]
dev = [
  "check-jsonschema>=0.37.4",
  "codespell>=2.4.3",
  "deptry>=0.25.1",
  "filelock>=3.32.2",
  "hatchling>=1.31.0",
  "hypothesis>=6.165.2",
  "import-linter>=2.13",
  "mutmut>=3.7.0",
  "nox>=2026.7.11",
  "pre-commit>=4.6.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.1",
  "ty>=0.0.69",
  "uv>=0.12.2",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethos"]

[tool.hatch.build.targets.wheel.force-include]
"system/gates.toml" = "ethos/data/gates.toml"
"system/policies/evidence-layout.toml" = "ethos/data/evidence_layout.toml"
"system/policies/generated-artifact-topology.toml" = "ethos/data/generated_artifact_topology.toml"
"system/review-lenses.toml" = "ethos/data/review_lenses.toml"
"package.json" = "ethos/data/supply-chain/package.json"
"package-lock.json" = "ethos/data/supply-chain/package-lock.json"
"node_modules" = "ethos/data/openspec-runtime/node_modules"
"system/schemas/kernel" = "ethos/data/schemas/kernel"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/system",
  "/README.md",
  "/LICENSE",
  "/package.json",
  "/package-lock.json",
  "/pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
"node_modules" = "node_modules"

[tool.pytest.ini_options]
cache_dir = "build/runtime/tool-cache/pytest"

[tool.mutmut]
source_paths = ["src/ethos"]
only_mutate = ["src/ethos/contracts/verdict.py"]
pytest_add_cli_args_test_selection = ["tests/unit/kernel/test_mutation_decision.py"]
mutate_only_covered_lines = true
