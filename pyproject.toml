[project]
name = "ethos"
dynamic = ["version"]
description = "Repository change trust protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cel-expr-python>=0.1.3",
  "cyclopts>=4.24.0",
  "filelock>=3.32.5",
  "jsonschema>=4.26.0",
  "markdown-it-py>=4.2.0",
  "nodejs-wheel-binaries>=24.19.0",
  "packaging>=26.3",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "tomli-w>=1.2.0",
  "uv>=0.12.10",
]

[project.scripts]
ethos = "ethos.cli:main"

[dependency-groups]
dev = [
  "check-jsonschema>=0.38.0",
  "codespell>=2.4.3",
  "deptry>=0.25.1",
  "hatchling>=1.32.0",
  "hypothesis>=6.167.1",
  "import-linter>=2.15",
  "mutmut>=3.7.0",
  "nox>=2026.8.17",
  "pillow>=12.3.0",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.6",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.1.0",
  "ty>=0.0.78",
  "uv>=0.12.10",
  "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/ethos/adapters/repo/runtime/source.py"
expression = "source_distribution_version()"
search-paths = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ethos"]

[tool.hatch.build.targets.wheel.force-include]
"system/gates.toml" = "ethos/data/gates.toml"
"system/policies/evidence-layout.toml" = "ethos/data/evidence_layout.toml"
"system/policies/generated-artifact-topology.toml" = "ethos/data/generated_artifact_topology.toml"
"package.json" = "ethos/data/supply-chain/package.json"
"package-lock.json" = "ethos/data/supply-chain/package-lock.json"
"pyproject.toml" = "ethos/data/runtime-project/pyproject.toml"
"uv.lock" = "ethos/data/runtime-project/uv.lock"
"VERSION" = "ethos/data/runtime-project/VERSION"
"system/schemas/kernel" = "ethos/data/schemas/kernel"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/ci/openspec_runtime_hook.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/ci/openspec_runtime_hook.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/system",
  "/README.md",
  "/LICENSE",
  "/package.json",
  "/package-lock.json",
  "/pyproject.toml",
  "/uv.lock",
  "/VERSION",
  "/tools/ci/openspec_runtime_hook.py",
]

[tool.pytest.ini_options]
cache_dir = "build/runtime/tool-cache/pytest"

[tool.deptry.per_rule_ignores]
DEP002 = ["uv"]

[tool.mutmut]
source_paths = ["src/ethos"]
only_mutate = ["src/ethos/contracts/verdict.py"]
pytest_add_cli_args_test_selection = ["tests/unit/kernel/test_mutation_decision.py"]
mutate_only_covered_lines = true
