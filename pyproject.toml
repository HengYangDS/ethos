[project]
name = "ethos-product-monorepo"
version = "0.1.0a1"
description = "ETHOS product workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "check-jsonschema>=0.37.4",
  "codespell>=2.4.2",
  "cyclopts>=3.20",
  "deptry>=0.25.1",
  "hypothesis>=6.0,<7",
  "import-linter>=2.12",
  "jsonschema>=4.23",
  "pre-commit>=4.6.1",
  "pydantic>=2.12,<3",
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
  "ruff>=0.8",
  "ty>=0.0.56",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/ethos",
  "packages/ethos-core",
]

[tool.uv.sources]
ethos-core = { workspace = true }

[tool.pytest.ini_options]
cache_dir = "build/runtime/tool-cache/pytest"
