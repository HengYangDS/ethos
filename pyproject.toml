[project]
name = "ethos-product-monorepo"
version = "0.1.0a1"
description = "ETHOS product workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "cyclopts>=3.20",
  "import-linter>=2.12",
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/ethos",
  "packages/ethos-adapters",
  "packages/ethos-assistants",
  "packages/ethos-core",
  "packages/ethos-repository",
  "packages/ethos-test",
]

[tool.uv.sources]
ethos-adapters = { workspace = true }
ethos-assistants = { workspace = true }
ethos-core = { workspace = true }
ethos-repository = { workspace = true }
ethos-test = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/ethos/src",
  "packages/ethos-adapters/src",
  "packages/ethos-assistants/src",
  "packages/ethos-core/src",
  "packages/ethos-repository/src",
  "packages/ethos-test/src",
]

[tool.ruff]
# Ruff rule set lives in .config/checks/ruff/ruff.toml (separation of concerns:
# pyproject.toml carries packaging; tool rules live under .config/). Only path-glob
# ignores stay here — ruff resolves per-file-ignore globs relative to THIS file's
# directory, so root-relative patterns must live in the project-root pyproject.
extend = ".config/checks/ruff/ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Test data lines are legitimately long (assertion payloads/fixtures); logic still wraps.
# Tests legitimately access private members (SLF001) and test dirs are not import
# packages (INP001) — both are standard pytest patterns, not product code.
"tests/**" = ["E501", "SLF001", "INP001", "PLR2004", "S101"]
# `id` on a widely-called classmethod — rename deferred to the package-split migration.
"packages/ethos-repository/src/ethos_repository/evidence.py" = ["A002"]
# C901 cyclomatic-complexity ratchet: 9 pre-existing tangled functions frozen (not
# permanent — they decompose during the package-split migration). New code: cap 12.
"packages/ethos-adapters/src/ethos_adapters/lanes.py" = ["C901"]
"packages/ethos-core/src/ethos_core/contracts/rules.py" = ["C901"]
"packages/ethos-repository/src/ethos_repository/authority_graph.py" = ["C901"]
"packages/ethos-repository/src/ethos_repository/claims.py" = ["C901"]
"packages/ethos-repository/src/ethos_repository/coupling.py" = ["C901"]
"packages/ethos-repository/src/ethos_repository/evolution.py" = ["C901"]
"packages/ethos-repository/src/ethos_repository/parity.py" = ["C901"]
"packages/ethos-repository/src/ethos_repository/rules.py" = ["C901"]
# C901 ratchet extended when max-complexity tightened 12 -> 10: these pre-existing
# functions exceed 10 and decompose during the surface split. New code: cap 10.
"packages/ethos-adapters/src/ethos_adapters/mutation.py" = ["C901"]
"packages/ethos-adapters/src/ethos_adapters/openspec_native.py" = ["C901"]
"packages/ethos-assistants/src/ethos_assistants/skill_packages.py" = ["C901"]
"packages/ethos-core/src/ethos_core/models.py" = ["C901"]
"packages/ethos/src/ethos/cli.py" = ["T201", "C901"]
# The CLI surface layer is the sanctioned place that prints to stdout (emit()); T20
# (no-print) applies to library/logic code, not the surface.
"packages/ethos/src/ethos/surface/cli/_base.py" = ["T201"]

