# Ruff configuration SSOT.
#
# `pyproject.toml` is packaging/workspace metadata only. Ruff lives here so
# root-relative path globs are true from the repository root while the reusable
# rule payload stays in `.config/checks/ruff/ruff.toml`.
extend = ".config/checks/ruff/ruff.toml"

[lint.per-file-ignores]
".agents/skills/**/scripts/*.py" = ["T201", "INP001"]
# Test data lines are legitimately long (assertion payloads/fixtures); logic still wraps.
# Tests legitimately access private members (SLF001) and test dirs are not import
# packages (INP001) — both are standard pytest patterns, not product code.
"tests/**" = ["E501", "SLF001", "INP001", "PLR2004", "S101"]
# `id` on a widely-called classmethod — rename deferred to the package-split migration.
# C901 cyclomatic-complexity ratchet: pre-existing tangled functions are frozen
# and decompose during the package/surface split. New code: cap 10.
"packages/ethos-core/src/ethos_core/contracts/rules.py" = ["C901"]
"packages/ethos/src/ethos/cli.py" = ["T201", "C901"]
"packages/ethos/src/ethos/adapters/mutation/lanes.py" = ["C901"]
"packages/ethos/src/ethos/adapters/mutation/core.py" = ["C901"]
"packages/ethos/src/ethos/adapters/openspec/openspec.py" = ["C901"]
"packages/ethos/src/ethos/adapters/openspec/proposal.py" = ["C901"]
"packages/ethos/src/ethos/assistants/skill_packages.py" = ["C901"]
"packages/ethos/src/ethos/repository/registry/authority.py" = ["C901"]
"packages/ethos/src/ethos/repository/evidence/claims.py" = ["C901"]
"packages/ethos/src/ethos/repository/evidence/core.py" = ["C901", "A002"]
"packages/ethos/src/ethos/repository/adoption/evolution.py" = ["C901"]
"packages/ethos/src/ethos/repository/evidence/parity.py" = ["C901"]
"packages/ethos/src/ethos/repository/policy/rules.py" = ["C901"]
# The CLI surface layer is the sanctioned place that prints to stdout (emit()); T20
# (no-print) applies to library/logic code, not the surface.
"packages/ethos/src/ethos/surface/cli/_base.py" = ["T201"]
