line-length = 100
target-version = "py312"
cache-dir = "build/runtime/tool-cache/ruff"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "PTH",
  "PT",
  "N",
  "A",
  "ISC",
  "FLY",
  "PERF",
  "TC",
  "TID",
  "PIE",
  "RUF",
  "C90",
  "TRY",
  "FBT",
  "SLF",
  "ARG",
  "PGH",
  "FURB",
  "G",
  "DTZ",
  "EM",
  "LOG",
  "BLE",
  "RSE",
  "SLOT",
  "YTT",
  "ASYNC",
  "PLE",
  "PLC",
  "PLW",
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "S602",
  "S604",
  "S605",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 7

[lint.isort]
force-single-line = true
known-first-party = ["ethos"]

[lint.pydocstyle]
convention = "google"

[lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
