schema_version = 2
id = "ethos-repository-governance"
entrypoint = "SKILL.md"
boundary = "repository-skill-source"
truth = "repository-source-docs-rules-and-evidence"
digest_algorithm = "sha256"
include = ["SKILL.md"]
exclude = [".DS_Store"]
required_sections = ["Required Pre-Reads", "Workflow", "Evidence", "Trust Boundary"]
expected_digest = "sha256:50713f6faa5fdd6f588a7d2d85dde11bd0282d20e2d2f6812ac52785f742a6e9"

[quality]
placeholder_allowed = false
host_projection = false

[[capability]]
id = "ethos.status"
kind = "command_readonly"
command = ["ethos", "status", "--json"]

[[capability]]
id = "ethos.prewrite"
kind = "command_mutation_guarded"
command = ["ethos", "lane", "prewrite"]
guard = "prewrite is itself the write-admission guard; it gates tracked writes"

[[capability]]
id = "ethos.docs"
kind = "command_readonly"
command = ["ethos", "quality", "docs", "--json"]

[[capability]]
id = "ethos.report"
kind = "command_readonly"
command = ["ethos", "report", "--json"]

