scripts = ["commit-msg", "pre-commit", "pre-push", "reference-transaction"]
python = { posix = "python/bin/python", nt = "python/python.exe" }
launcher = '''#!/bin/sh
# Generated by ethos hook install; Python owns all hook semantics.
HOOK_DIR=${0%/*}; [ "$HOOK_DIR" = "$0" ] && HOOK_DIR=.
HOOK_DIR=$(CDPATH= cd "$HOOK_DIR" && pwd)
RUNTIME_ROOT="$HOOK_DIR/../../runtime"
CURRENT="$RUNTIME_ROOT/CURRENT"
if [ -L "$CURRENT" ] || [ ! -f "$CURRENT" ]; then exit 1; fi
exec 3<"$CURRENT" || exit 1
IFS= read -r RUNTIME_DIGEST <&3 || exit 1
RUNTIME_SELECTOR_EXTRA=
IFS= read -r RUNTIME_SELECTOR_EXTRA <&3 && exit 1
[ -z "$RUNTIME_SELECTOR_EXTRA" ] || exit 1
exec 3<&-
case "$RUNTIME_DIGEST" in *[!0-9a-f]*|"") exit 1;; esac
[ "${#RUNTIME_DIGEST}" -eq 64 ] || exit 1
RUNTIME="$RUNTIME_ROOT/$RUNTIME_DIGEST"
if [ -L "$RUNTIME" ] || [ ! -d "$RUNTIME" ]; then exit 1; fi
exec "$RUNTIME/@PYTHON@" -B -I -m ethos.cli hook run @HOOK@ "$@"
'''
