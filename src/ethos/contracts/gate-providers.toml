# The gate provider catalog. A gate declaration names a provider by its ID. `providers` gives the
# callable that each ID resolves to; it may move without changing the ID. `legacy` gives the ID of
# each `ethos.<module>:<callable>` name that declarations used before the catalog; such a name
# resolves for one support window, and a name is removed from `legacy` only when no adopter
# declares it.

[providers]
"provider.code-behavior" = "ethos.adapters.gates.code_quality:behavior_report"
"provider.code-static" = "ethos.adapters.gates.code_quality:static_report"
"provider.commit-ranges" = "ethos.adapters.gates.commit_ranges:commit_ranges_report"
"provider.configuration" = "ethos.adapters.gates.configuration:configuration_report"
"provider.docs-registry" = "ethos.application.docs_registry:docs_registry_report"
"provider.external-links" = "ethos.adapters.gates.tool:external_links_report"
"provider.generated-artifacts" = "ethos.adapters.gates.generated_artifacts:generated_artifact_gate_report"
"provider.markdown-links" = "ethos.adapters.gates.tool:markdown_links_report"
"provider.markdown-lint" = "ethos.adapters.gates.tool:markdown_lint_report"
"provider.module-layout" = "ethos.adapters.gates.tool:module_layout_gate_report"
"provider.openspec" = "ethos.adapters.openspec.governance:openspec_validation_report"
"provider.product-audit" = "ethos.domain.status:product_audit"
"provider.product-boundary" = "ethos.repository.policy.boundary.product:product_boundary_report"
"provider.prose" = "ethos.adapters.gates.tool:prose_report"
"provider.python-behavior" = "ethos.adapters.gates.python_quality:behavior_report"
"provider.python-static" = "ethos.adapters.gates.python_quality:static_report"
"provider.python-types" = "ethos.adapters.gates.ty:ty_gate_report"
"provider.repository-audit" = "ethos.domain.status:audit_for_root"
"provider.schemas" = "ethos.repository.policy.schema:schema_validation_report"
"provider.skill-portfolio" = "ethos.assistants.skills.portfolio:skill_portfolio_report"
"provider.source-budget" = "ethos.domain.source_budget.measurement:source_budget_report"
"provider.source-format" = "ethos.adapters.gates.formatting:source_format_report"
"provider.source-integrity" = "ethos.adapters.gates.provenance.observation:integrity_report"

[legacy]
"ethos.adapters.gates.code_quality:behavior_report" = "provider.code-behavior"
"ethos.adapters.gates.code_quality:static_report" = "provider.code-static"
"ethos.adapters.gates.commit_ranges:commit_ranges_report" = "provider.commit-ranges"
"ethos.adapters.gates.configuration:configuration_report" = "provider.configuration"
"ethos.adapters.gates.formatting:source_format_report" = "provider.source-format"
"ethos.adapters.gates.generated_artifacts:generated_artifact_gate_report" = "provider.generated-artifacts"
"ethos.adapters.gates.provenance.observation:integrity_report" = "provider.source-integrity"
"ethos.adapters.gates.python_quality:behavior_report" = "provider.python-behavior"
"ethos.adapters.gates.python_quality:static_report" = "provider.python-static"
"ethos.adapters.gates.tool:external_links_report" = "provider.external-links"
"ethos.adapters.gates.tool:markdown_links_report" = "provider.markdown-links"
"ethos.adapters.gates.tool:markdown_lint_report" = "provider.markdown-lint"
"ethos.adapters.gates.tool:module_layout_gate_report" = "provider.module-layout"
"ethos.adapters.gates.tool:prose_report" = "provider.prose"
"ethos.adapters.gates.ty:ty_gate_report" = "provider.python-types"
"ethos.adapters.openspec.governance:openspec_validation_report" = "provider.openspec"
"ethos.application.docs_registry:docs_registry_report" = "provider.docs-registry"
"ethos.assistants.skills.portfolio:skill_portfolio_report" = "provider.skill-portfolio"
"ethos.domain.source_budget.measurement:source_budget_report" = "provider.source-budget"
"ethos.domain.status:audit_for_root" = "provider.repository-audit"
"ethos.domain.status:product_audit" = "provider.product-audit"
"ethos.repository.policy.boundary.product:product_boundary_report" = "provider.product-boundary"
"ethos.repository.policy.schema:schema_validation_report" = "provider.schemas"
