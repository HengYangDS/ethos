id = "repository-paradigm"
source_refs = ["src/ethos/contracts/paradigm/paradigm.toml"]

# Immutable record roots keep their captured bytes; they are not formatter inputs.
immutable_roots = ["openspec/changes/archive/"]

[root]
entry_documents = [
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "README.md",
  "VERSION",
]
required_documents = ["AGENTS.md", "README.md"]
protocol_files = [".editorconfig", ".gitattributes", ".gitignore"]
forge_entries = [".github", ".gitlab", ".gitlab-ci.yml"]
governance_roots = [".agents", ".config", ".ethos", "openspec"]

[binding]
root = ".ethos"
files = ["profile.toml", "release.toml", "rules.toml", "workspace.toml"]
# The only table a workspace binding declares. The paradigm fixes every branch
# role, and the release binding declares the release mirror.
workspace_tables = ["commit_policy"]

[normalization]
gitattributes = "* text=auto eol=lf"
editorconfig = { charset = "utf-8", end_of_line = "lf", insert_final_newline = "true" }

[configuration]
root = ".config"
owner_groups = ["checks", "release"]
planes = ["ci", "mise", "npm"]
files = ["miserc.toml"]
policy = "policy.toml"

# A repository that declares release tags keeps one version source and one
# changelog grammar (Keep a Changelog 1.1.0, bracketed headings).
[release]
version_file = "VERSION"
tag_pattern = "v*"
changelog = "CHANGELOG.md"
changelog_heading = '^## \[(?P<version>Unreleased|[^\]\r\n]+)\](?: - (?P<date>\d{4}-\d{2}-\d{2}))?$'

# Per-file ceilings every governed repository shares; no binding restates them.
# Exceeding one needs semantic consolidation, never compression, exemptions or a
# raised ceiling.
[size]
python_effective_lines = 512
markdown_nonblank_lines = 512

# Documents under the profile docs root begin with plain YAML front matter.
# A repository that keeps numbered decision records names each with one grammar.
[documents]
decision_record_name = '^dr-\d{4}-[a-z0-9]+(?:-[a-z0-9]+)*\.md$'

# Repository-authored names are lowercase kebab-case words, after an optional leading
# `.` or `_` marker and with dot-separated suffixes. Python and Go files and the
# directories that hold them, entry documents, catalogued tool names and the basenames a
# tool requires keep their names, and immutable roots keep their captured names.
[names]
module_suffixes = [".go", ".py", ".pyi"]
tool_basenames = [
  "Cargo.lock",               # Cargo
  "Cargo.toml",               # Cargo
  "Dockerfile",               # Docker
  "Dockerfile.dockerignore",  # BuildKit's per-Dockerfile ignore file
  "ISSUE_TEMPLATE",           # GitHub
  "PULL_REQUEST_TEMPLATE.md", # GitHub
  "SKILL.md",                 # Agent Skills
  "issue_templates",          # GitLab
  "merge_request_templates",  # GitLab
]

# A repository that runs CI on more than one Forge defines its pipelines once in a CUE
# model under the model root and generates each Forge's pipeline files from it.
[pipelines]
model_root = ".config/ci/"
model_suffix = ".cue"

[[pipelines.forge]]
id = "github"
files = [".github/workflows/*.yaml", ".github/workflows/*.yml"]

[[pipelines.forge]]
id = "gitlab"
files = [".gitlab-ci.yml"]

# The commit subject grammar and signature every governed repository shares. A
# repository may restrict scopes to a declared list; the type set does not vary, and
# every commit carries an SSH signature.
[commit]
types = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "test"]
scope = '[a-z0-9]+(?:-[a-z0-9]+)*'
breaking_marker = "!"
signature = "ssh"

# A repository that tracks OpenSpec artifacts selects the spec-driven schema, and each
# artifact's rules in openspec/config.yaml begin with these common rules; its own rules
# follow them.
[openspec]
artifact_schema = "spec-driven"

[openspec.rules]
proposal = [
  "Follow the official proposal template. State why the change is needed, what changes, the affected capabilities and the impact; mark breaking changes and name the out-of-scope boundary without copying implementation or execution history.",
]
specs = [
  "Use the native delta operations ADDED, MODIFIED, REMOVED and RENAMED at exact capability paths. A MODIFIED requirement restates its complete block with every retained scenario; main specs keep only Purpose and Requirements.",
  "State each requirement as an observable SHALL or MUST obligation with at least one Scenario whose WHEN and THEN clauses can falsify it; describe behavior and its boundaries, not implementation names.",
]
design = [
  "Follow the official design template for a non-trivial change. Explain its architecture, alternatives, rationale, authority boundaries and migration risks, give each behavior one semantic owner, and reference the proposal and specs instead of restating them.",
  "Keep execution history, logs and acceptance reports with their Git, CI and native evidence owners, not in design prose.",
]
tasks = [
  "Use official checkboxes under numbered groups in dependency order, with numbering and nesting expressing one hierarchy. Each task keeps a stable identity, states one bounded action with its observable completion condition, and carries a truthful state.",
  "Keep only short evidence references or current dependencies in tasks. Preserve execution history, logs and originals with their Git, CI and native evidence owners, never in tasks, design prose or a parallel ledger.",
  "Separate implementation tasks from lifecycle preconditions and effects; a Change never records its own landing, archive or Lane retirement as a completed task.",
]

# One formatter per text carrier class, with the settings every binding declares.
# Ruff formats Python because the common blank-line policy has no other enforcer.
[[formatter]]
tool = "prettier"
suffixes = [".md", ".yaml", ".yml"]
settings = { proseWrap = "preserve", printWidth = 100 }

[[formatter]]
tool = "taplo"
suffixes = [".toml"]
settings = { "formatting.column_width" = 100 }

[[formatter]]
tool = "ruff"
suffixes = [".py", ".pyi"]
settings = { line-length = 100, target-version = "py312" }

[[module]]
id = "python"
manifest = "pyproject.toml"
lock = "uv.lock"
lock_scope = "manifest"
runner_entries = ["noxfile.py"]
floor = "3.12"

[[module]]
id = "node"
manifest = "package.json"
lock = "package-lock.json"
lock_scope = "dependencies"

[[module]]
id = "go"
manifest = "go.mod"
lock = "go.sum"
lock_scope = "dependencies"

# Each tool's canonical carrier, the root names it discovers, and the manifest
# tables or package keys that would embed its policy.
[[tool]]
id = "mise"
carrier = ".config/mise/config.toml"
root_names = [".mise.toml", ".tool-versions", "mise.toml"]

[[tool]]
id = "mise-lock"
carrier = ".config/mise/mise.lock"
root_names = ["mise.lock"]

[[tool]]
id = "runtime-version"
carrier = ".config/mise/config.toml"
root_names = [".node-version", ".nvmrc", ".python-version"]

[[tool]]
id = "npm"
carrier = ".config/npm/npmrc"
root_names = [".npmrc"]

[[tool]]
id = "pytest"
carrier = ".config/checks/pytest/pytest.toml"
root_names = [".pytest.toml", "pytest.ini", "pytest.toml"]
manifest_tables = ["pytest"]

[[tool]]
id = "coverage"
carrier = ".config/checks/coverage/coverage.toml"
root_names = [".coveragerc"]
manifest_tables = ["coverage"]

[[tool]]
id = "ruff"
carrier = ".config/checks/ruff/ruff.toml"
root_names = [".ruff.toml", "ruff.toml"]
manifest_tables = ["ruff"]

[[tool]]
id = "ty"
carrier = ".config/checks/ty/ty.toml"
root_names = ["ty.toml"]
manifest_tables = ["ty"]

[[tool]]
id = "taplo"
carrier = ".config/checks/taplo/taplo.toml"
root_names = [".taplo.toml", "taplo.toml"]

[[tool]]
id = "gitleaks"
carrier = ".config/checks/gitleaks/gitleaks.toml"
root_names = [".gitleaks.toml"]

[[tool]]
id = "gitleaks-ignore"
carrier = ".config/checks/gitleaks/gitleaksignore"
root_names = [".gitleaksignore"]

[[tool]]
id = "lychee"
carrier = ".config/checks/lychee/lychee.toml"
root_names = ["lychee.toml"]

[[tool]]
id = "typos"
carrier = ".config/checks/typos/typos.toml"
root_names = [".typos.toml", "_typos.toml", "typos.toml"]
manifest_tables = ["typos"]

[[tool]]
id = "codespell"
carrier = ".config/checks/codespell/codespell.toml"
root_names = [".codespellrc"]
manifest_tables = ["codespell"]

[[tool]]
id = "deptry"
carrier = ".config/checks/deptry/policy.toml"
manifest_tables = ["deptry"]

[[tool]]
id = "vulture"
carrier = ".config/checks/vulture/vulture.toml"
manifest_tables = ["vulture"]

[[tool]]
id = "prettier"
carrier = ".config/checks/prettier/prettier.toml"
root_names = [
  ".prettierrc",
  ".prettierrc.json",
  ".prettierrc.json5",
  ".prettierrc.toml",
  ".prettierrc.yaml",
  ".prettierrc.yml",
  "prettier.config.js",
  "prettier.config.mjs",
]
package_keys = ["prettier"]

[[tool]]
id = "prettier-ignore"
carrier = ".config/checks/prettier/prettierignore"
root_names = [".prettierignore"]

[[tool]]
id = "markdownlint-cli2"
carrier = ".config/checks/markdownlint-cli2/.markdownlint-cli2.yaml"
root_names = [
  ".markdownlint-cli2.jsonc",
  ".markdownlint-cli2.yaml",
  ".markdownlint.json",
  ".markdownlint.jsonc",
  ".markdownlint.yaml",
]

[[tool]]
id = "knip"
carrier = ".config/checks/knip/knip.toml"
root_names = ["knip.json", "knip.jsonc"]
package_keys = ["knip"]

[[tool]]
id = "eslint"
carrier = ".config/checks/eslint/eslint.config.mjs"
root_names = ["eslint.config.js", "eslint.config.mjs"]
package_keys = ["eslintConfig"]

# tsc reads a relocated project through `--project`, and Knip through its
# `typescript.config` setting.
[[tool]]
id = "typescript"
carrier = ".config/checks/typescript/tsconfig.json"
root_names = ["jsconfig.json", "tsconfig.json"]

[[tool]]
id = "golangci-lint"
carrier = ".config/checks/golangci-lint/golangci-lint.toml"
root_names = [".golangci.toml", ".golangci.yaml", ".golangci.yml"]

[[tool]]
id = "osv-scanner"
carrier = ".config/checks/osv-scanner/osv-scanner.toml"
root_names = ["osv-scanner.toml"]

[[tool]]
id = "import-linter"
carrier = ".config/checks/import-linter/import-linter.toml"
root_names = [".importlinter"]
manifest_tables = ["importlinter"]

[[tool]]
id = "vale"
carrier = ".config/checks/vale/vale.ini"
root_names = [".vale.ini"]
nested = true

[[tool]]
id = "yamllint"
carrier = ".config/checks/yamllint/.yamllint.yaml"
root_names = [".yamllint", ".yamllint.yaml", ".yamllint.yml"]

[[tool]]
id = "shellcheck"
carrier = ".config/checks/shellcheck/.shellcheckrc"
root_names = [".shellcheckrc"]

[[tool]]
id = "pre-commit"
carrier = ".config/checks/pre-commit/.pre-commit-config.yaml"
root_names = [".pre-commit-config.yaml"]

[[tool]]
id = "c8"
carrier = ".config/checks/c8/.c8rc.json"
root_names = [".c8rc", ".c8rc.json"]
package_keys = ["c8"]

[[tool]]
id = "goreleaser"
carrier = ".config/release/goreleaser/.goreleaser.yaml"
root_names = [".goreleaser.yaml", ".goreleaser.yml"]

[[tool]]
id = "syft"
carrier = ".config/release/syft/.syft.yaml"
root_names = [".syft.yaml"]

[[tool]]
id = "renovate"
carrier = ".config/checks/renovate/renovate.json5"
root_names = ["renovate.json", "renovate.json5", ".renovaterc", ".renovaterc.json", ".renovaterc.json5"]
