schema = "system/schemas/contracts/authority.schema.json"
resolver = "contextual"

[query]
required = ["subject", "predicate", "scope", "plane", "context"]
unknown_verdict = "block"

[currentness]
requires = ["integrity", "declared_authority", "binding_match", "validity", "no_more_specific_active_owner"]
history_is_current = false
projection_is_authority = false
adapter_is_authority = false

[[carrier_roles]]
name = "native"
may_be_authoritative = true

[[carrier_roles]]
name = "projection"
may_be_authoritative = false

[[carrier_roles]]
name = "adapter"
may_be_authoritative = false

[[carrier_roles]]
name = "fact"
may_be_authoritative = true
requires_validity = true

[[carrier_roles]]
name = "history"
may_be_authoritative = false

[resolution]
conflict = "block"
novel_semantics = "model_gap"
more_specific_owner = "wins_only_within_same_query"
