# system/authority.toml
# Authority order and conflict resolution — the machine governance kernel's
# top contract. Derived from AGENTS.md "Authority Order" and the terminal
# design "Authority And Truth" section.
#
# Higher rank wins on conflict. Lower surfaces are stale until repaired.

schema = "system/schemas/contracts/authority.schema.json"

[[order]]
rank = 1
source = "user_instruction"
description = "Current user instruction in the active session."

[[order]]
rank = 2
source = "source_code_tests_metadata_git"
description = "Source code, tests, package metadata, and Git facts."

[[order]]
rank = 3
source = "system_contracts_schemas"
description = "system/ contracts and schemas."

[[order]]
rank = 4
source = "current_docs"
description = "Current docs under docs/."

[[order]]
rank = 5
source = "openspec_specs_changes"
description = "OpenSpec specs and active changes."

[[order]]
rank = 6
source = "evidence"
description = "Evidence under evidence/."

[[order]]
rank = 7
source = "rules_skills_projections"
description = "Rules, skills, MCP descriptors, CI files, and host projections."

[conflict_resolution]
principle = "obey_higher_authority"
stale_rule = "treat_lower_surface_as_stale_until_repaired"
generated_never_outranks_source = true

# Generated projections, host-local memory, agent session state, generated
# JSONL, SQLite indexes, caches, and CI-only artifacts are NOT repository truth
# until reviewed and promoted into tracked artifacts.
[non_truth_until_promoted]
paths = [
  ".ethos/",
  "host_local_memory",
  "agent_session_state",
  "generated_jsonl",
  "sqlite_indexes",
  "caches",
  "ci_only_artifacts",
]
