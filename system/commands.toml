help = "Check declared evidence roots and claim digests."
show = true
report_handler = { provider = "ethos.repository.evidence.freshness:evidence_freshness_report", bind_current_head = true, data_path = ["data"], next_actions = ["ethos prove --json"], enforce = false, bind_root = true }

[[commands]]
