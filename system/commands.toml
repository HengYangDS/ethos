report_handler = { provider = "ethos.surface.cli.quality.core:_release_file_report", data_fields = [{ name = "release_files", path = ["release_files"] }, { name = "host_profile", path = ["host_profile"] }], next_actions = ["uv build --out-dir build/artifacts/python --clear --no-create-gitignore"], enforce = false, bind_root = true }

