help = "Check production source for compatibility residue."
show = true
report_handler = { provider = "ethos.repository.policy.no_compat.core:no_compat_report", enforce = true, bind_root = true }

[[commands]]
name = "product-boundary"
group = "quality"
import_path = "ethos.surface.cli.boundary.product:product_boundary"
help = "Audit product and release-visible historical surfaces for boundary leaks."
show = true
report_handler = { provider = "ethos.repository.policy.boundary.product:product_boundary_report", next_actions = ["neutralize product and release-visible historical surfaces; keep private provenance in adopter repositories or ignored local state"], enforce = true, bind_root = true }

[[commands]]
name = "contributor-policy"
group = "quality"
import_path = "ethos.surface.cli.boundary.product:contributor_policy"
help = "Audit organization-native contributor, role, and automation identity policy."
show = true
report_handler = { provider = "ethos.repository.policy.boundary.product:contributor_policy_report", next_actions = ["declare role-based humans, teams, and automation identities"], enforce = true, bind_root = true }

[[commands]]
