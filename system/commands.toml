group = "quality"
import_path = "ethos.surface.cli.quality.core:coupling_audit"
help = "Report product, profile, adapter, and product-toolchain coupling boundaries."
show = true

[[commands]]
name = "commits"
group = "quality"
import_path = "ethos.surface.cli.quality.core:commits"
