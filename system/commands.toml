id = "ethos-command-registry"
schema_version = 1
source_refs = ["docs/governance/product-design-contract.md", "docs/architecture/declarative-governance-compiler.md", "openspec/specs/command-plane/spec.md"]
actions = { campaign_continuation = ["ethos campaign status --json"], campaign_hypotheses = ["ethos audit --mode shape"], head_bound_proof = ["ethos prove --execute --expect-head <head>"], lane_prewrite = ["ethos lane prewrite <path>"], protected_publication = ["ethos publish --json"] }
sets = { public_workflow = ["ethos status", "ethos plan", "ethos prove", "ethos land", "ethos publish"], setup = ["ethos adopt", "ethos doctor"], maintainer_reference = ["ethos audit", "ethos openspec", "ethos campaign", "ethos intake", "ethos intake status", "ethos intake mine", "ethos quality", "ethos assistants", "ethos playbooks", "ethos fleet", "ethos fleet retirement-readiness", "ethos lane", "ethos lane housekeeping", "ethos lane lease", "ethos lane handoff", "ethos lane resolution", "ethos lane retire", "ethos lane retire landed", "ethos lane retire superseded", "ethos lane retire unbound", "ethos hook", "ethos parity", "ethos explain", "ethos docs"], governance_gate = ["openspec validate --all --strict --json"], local_closeout = ["ethos land --closeout --apply --authorize --expect-head <HEAD>"], evidence_refresh = ["ethos parity shadow --adopter <adopter-id> --target <repo> --execute --write-evidence"], retired_public_roots = ["wt", "proof", "mission", "skill-evolution", "agent-surface-contract"], retired_public_command_prefixes = ["ethos kernel", "ethos governance", "ethos workspace", "ethos agent", "ethos project", "ethos node"], historical_exempt_roots = ["evidence", "docs/archive"] }

[[commands]]
name = "status"
group = "root"
import_path = "ethos.surface.cli.root.inspection:status"
help = "Inspect repository state."
show = true
report_handler = { provider = "ethos.surface.cli.root.inspection:_status_report", summary = [{ name = "root", path = ["status", "root"] }, { name = "branch", path = ["status", "branch"] }, { name = "role", path = ["status", "role"], default = "" }, { name = "dirty", path = ["status", "dirty"] }, { name = "changed_path_count", path = ["status", "changed_path_count"] }, { name = "foreign_work_lane_count", path = ["status", "coordination", "foreign_work_lane_count"], default = 0 }, { name = "unbound_work_lane_count", path = ["status", "coordination", "unbound_work_lane_count"], default = 0 }, { name = "missing_lease_count", path = ["status", "coordination", "missing_lease_count"], default = 0 }, { name = "coordination_detail_state", path = ["status", "coordination", "detail_state"], default = "exact" }, { name = "coordination_advisory_count", path = ["status", "coordination", "advisory_count"] }, { name = "coordination_blocking", path = ["status", "coordination", "blocking"], default = false }], diagnostics_path = ["diagnostics"], data_path = ["status"], governance_context_path = ["governance_context"], next_actions_path = ["next_actions"], enforce = false, bind_root = true }

[[commands]]
name = "doctor"
group = "root"
import_path = "ethos.surface.cli.root.inspection:doctor"
help = "Inspect local host readiness."
show = false

[[commands]]
name = "plan"
group = "root"
import_path = "ethos.surface.cli.root.planning:plan"
help = "Compile deterministic PlanIR."
show = true

[[commands]]
name = "prove"
group = "root"
import_path = "ethos.surface.cli.root.proof:prove"
help = "Produce a local proof-readiness summary."
show = true

[[commands]]
name = "land"
group = "root"
import_path = "ethos.surface.cli.root.lifecycle:land"
help = "Report land readiness."
show = true

[[commands]]
name = "publish"
group = "root"
import_path = "ethos.surface.cli.root.lifecycle:publish"
help = "Report publish readiness without pushing."
show = true

[[commands]]
name = "adopt"
group = "root"
import_path = "ethos.surface.cli.root.adoption:adopt"
help = "Plan or apply ETHOS adoption for a repository."
show = true

[[commands]]
name = "explain"
group = "root"
import_path = "ethos.surface.cli.root.reference:explain"
help = "Explain a governance gap or advisory signal."
show = false

[[commands]]
name = "docs"
group = "root"
import_path = "ethos.surface.cli.root.reference:docs"
help = "Locate documentation for a topic."
show = false

[[commands]]
name = "audit"
group = "root"
import_path = "ethos.surface.cli.root.reference:audit"
help = "Audit repository governance against the active profile."
show = false

[[commands]]
name = "openspec"
group = "root"
import_path = "ethos.surface.cli.root.reference:openspec"
help = "Audit official OpenSpec governance state."
show = false

[[commands]]
name = "asset-policy"
group = "quality"
import_path = "ethos.surface.cli.quality.core:asset_policy"
help = "Report repository asset quality policy."
show = true
report_handler = { provider = "ethos.surface.cli.quality.core:_product_quality_profile", provider_mode = "payload", summary = [{ name = "asset_class_count", path = ["payload", "asset_classes"], reducer = "count" }], data_path = ["payload"], enforce = false, bind_root = false }

[[commands]]
name = "types"
group = "quality"
import_path = "ethos.surface.cli.quality.core:quality_types"
help = "Enforce zero diagnostics for every package governed by the ty type policy."
show = true
report_handler = { provider = "ethos.adapters.gates.ty:ty_gate_report", summary = [{ name = "package_count", path = ["packages"], reducer = "count" }], enforce = true, bind_root = true }

[[commands]]
name = "docs"
group = "quality"
import_path = "ethos.surface.cli.quality.core:quality_docs"
help = "Report documentation quality profile, registry health, and topology."
show = true

[[commands]]
name = "docs-topology"
group = "quality"
import_path = "ethos.surface.cli.quality.core:docs_topology"
help = "Audit the minimal semantic documentation topology contract."
show = true
report_handler = { provider = "ethos.repository.policy.docs.topology:docs_topology_report", when_blocked = "restore minimal semantic docs kernel: README, decisions, evidence, history, and reference", when_clean = "ethos prove --execute --gate docs-topology --expect-head $(git rev-parse HEAD) --json", enforce = true, bind_root = true }

[[commands]]
name = "proof-policy"
group = "quality"
import_path = "ethos.surface.cli.quality.core:proof_policy"
help = "Report proof-state lattice and trust-bearing rules."
show = true
report_handler = { provider = "ethos.surface.cli.quality.core:_proof_lattice", provider_mode = "payload", summary = [{ name = "state_count", path = ["payload", "states"], reducer = "count" }], data_path = ["payload"], enforce = false, bind_root = false }

[[commands]]
name = "tool-profiles"
group = "quality"
import_path = "ethos.surface.cli.quality.core:tool_profiles_command"
help = "Report quality tool adapter profiles."
show = true
report_handler = { provider = "ethos.surface.cli.quality.core:_tool_profiles", provider_mode = "payload", summary = [{ name = "tool_adapter_count", path = ["payload", "tool_adapters"], reducer = "count" }], data_path = ["payload"], enforce = false, bind_root = false }

[[commands]]
name = "markdown-links"
group = "quality"
import_path = "ethos.surface.cli.quality.core:markdown_links"
help = "Run markdown link checks through the configured adapter."
show = true
tool_handler = { gate_id = "markdown-links", tool = "lychee", command = ["lychee", "--config", ".config/checks/lychee/lychee.toml", "--no-progress"], file_globs = ["*.md"], exclude_prefixes = ["evidence/", "docs/archive/"] }

[[commands]]
name = "shell"
group = "quality"
import_path = "ethos.surface.cli.quality.core:shell_quality"
help = "Run shell script lint checks through ShellCheck."
show = true
tool_handler = { gate_id = "shell-lint", tool = "bash", command = ["bash", "tools/ci/scripts/run-shell-lint.sh"], file_globs = ["*.sh"] }

[[commands]]
name = "toml"
group = "quality"
import_path = "ethos.surface.cli.quality.core:toml_quality"
help = "Run TOML syntax and format checks through Taplo."
show = true
tool_handler = { gate_id = "config-quality", tool = "bash", command = ["bash", "tools/ci/scripts/run-config-lint.sh"], file_globs = ["*.toml"] }

[[commands]]
name = "yaml"
group = "quality"
import_path = "ethos.surface.cli.quality.core:yaml_quality"
help = "Run YAML projection checks through yamllint."
show = true
tool_handler = { gate_id = "config-quality", tool = "bash", command = ["bash", "tools/ci/scripts/run-config-lint.sh"], file_globs = ["*.yml", "*.yaml"] }

[[commands]]
name = "coverage"
group = "quality"
import_path = "ethos.surface.cli.quality.core:coverage"
help = "Report Python coverage policy and latest artifact state."
show = true
report_handler = { provider = "ethos.repository.policy.coverage:coverage_quality_report", summary = [{ name = "current_hard_floor", path = ["policy", "current_hard_floor"] }, { name = "latest_line_percent", path = ["latest_artifact", "line_percent"] }, { name = "writer_active", path = ["latest_artifact", "writer_active"], default = false }], enforce = true, bind_root = true }

[[commands]]
name = "docstrings"
group = "quality"
import_path = "ethos.surface.cli.quality.core:docstrings"
help = "Report public product-surface docstring coverage."
show = true
report_handler = { provider = "ethos.repository.policy.docstrings.core:docstring_coverage_report", summary = [{ name = "coverage_percent", path = ["coverage_percent"] }, { name = "documented_count", path = ["documented_count"] }, { name = "public_count", path = ["public_count"] }, { name = "style_issue_count", path = ["style_issue_count"], default = 0 }, { name = "advisory_missing_count", path = ["advisory_public_definition_inventory", "missing_count"], default = 0 }], enforce = true, bind_root = true }

[[commands]]
name = "code-size"
group = "quality"
import_path = "ethos.surface.cli.quality.core:code_size"
help = "Check effective source-file size against ratchet limits."
show = true
report_handler = { provider = "ethos.domain.prove:code_size_report", enforce = false, bind_root = true }

[[commands]]
name = "source-budget"
group = "quality"
import_path = "ethos.surface.cli.quality.core:source_budget"
help = "Report the terminal owned-source budget."
show = true
report_handler = { provider = "ethos.domain.source_budget.core:source_budget_report", enforce = true, bind_root = true }

[[commands]]
name = "module-layout"
group = "quality"
