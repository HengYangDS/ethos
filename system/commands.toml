help = "Check semantic subpackage and import-layout discipline."
show = true
report_handler = { provider = "ethos.repository.policy.layout.report:module_layout_report", enforce = true, bind_root = true }

[[commands]]
name = "npm"
group = "quality"
import_path = "ethos.surface.cli.quality.core:npm_quality"
help = "Run npm distribution pack smoke checks without publishing."
show = true
tool_handler = { gate_id = "npm-pack", tool = "npm", command = ["npm", "run", "test:npm"], file_globs = ["package.json"], append_files = false }

[[commands]]
name = "generated-artifacts"
group = "quality"
import_path = "ethos.surface.cli.quality.core:generated_artifacts"
help = "Audit generated-artifact topology and path routing drift."
show = true
report_handler = { provider = "ethos.repository.policy.artifacts:generated_artifact_topology_report", when_blocked = "move generated outputs under build/ethos or build/evidence; promote curated summaries into docs/evidence", when_clean = "ethos prove --execute --expect-head $(git rev-parse HEAD) --json", enforce = true, bind_root = true }

[[commands]]
name = "command-surface"
group = "quality"
import_path = "ethos.surface.cli.quality.core:command_surface"
help = "Validate public command surface vocabulary."
show = true
report_handler = { provider = "ethos.repository.registry.commands:command_registry_report", enforce = false, bind_root = true }

[[commands]]
name = "format-policy"
group = "quality"
import_path = "ethos.surface.cli.quality.core:format_policy"
