[[commands]]
name = "governance-kernel"
group = "quality"
import_path = "ethos.surface.cli.boundary.readiness:governance_kernel"
help = "Audit the single kernel shared by product and adopted repositories."
show = true
report_handler = { provider = "ethos.repository.policy.governance.kernel:governance_kernel_report", when_blocked = "repair governance kernel, profile/adoption scaffold, and command-plane docs", when_clean = "ethos quality enterprise-readiness --json", enforce = true, bind_root = true }
