id = "ethos-command-registry"
schema_version = 1
source_refs = [
  "docs/governance/product-design-contract.md",
  "docs/architecture/declarative-governance-compiler.md",
  "openspec/specs/command-plane/spec.md",
]

[sets]
public_workflow = [
  "ethos status",
  "ethos plan",
  "ethos prove",
  "ethos land",
  "ethos publish",
]
reader_view = [
  "ethos orient",
]
scorecard = [
  "ethos report",
]
setup = [
  "ethos init",
  "ethos adopt",
  "ethos doctor",
]
maintainer_reference = [
  "ethos audit",
  "ethos openspec",
  "ethos campaign",
  "ethos intake",
  "ethos intake status",
  "ethos intake mine",
  "ethos quality",
  "ethos assistants",
  "ethos playbooks",
  "ethos fleet",
  "ethos fleet retirement-readiness",
  "ethos lane",
  "ethos hook",
  "ethos parity",
  "ethos explain",
  "ethos docs",
]
governance_gate = [
  "openspec validate --all --strict --json",
]
local_closeout = [
  "ethos land --closeout --apply --authorize --expect-head <HEAD>",
]
evidence_refresh = [
  "ethos parity shadow --adopter <adopter-id> --target <repo> --execute --write-evidence",
]
retired_public_roots = [
  "wt",
  "proof",
  "mission",
  "skill-evolution",
  "agent-surface-contract",
]
retired_public_command_prefixes = [
  "ethos kernel",
  "ethos governance",
  "ethos workspace",
  "ethos agent",
  "ethos project",
  "ethos node",
]
historical_exempt_roots = [
  "evidence",
  "docs/archive",
]

[[commands]]
name = "asset-policy"
group = "quality"
import_path = "ethos.surface.cli.quality.core:asset_policy"
help = "Report repository asset quality policy."
show = true
report_handler = { spec = "ASSET_POLICY_COMMAND", enforce = false, bind_root = false }

[[commands]]
name = "types"
group = "quality"
import_path = "ethos.surface.cli.quality.core:quality_types"
help = "Enforce the ty type-check policy tiers (zero-tolerance + ratchet baselines)."
show = true
report_handler = { spec = "TYPES_COMMAND", enforce = true, bind_root = true }

