show = true
report_handler = { provider = "ethos.surface.cli.quality.core:_sbom_report", provider_mode = "payload", clean_state = "ready", summary = [{ name = "package_count", path = ["payload", "sbom", "packages"], reducer = "count" }], data_path = ["payload"], enforce = false, bind_root = true }

[[commands]]
name = "release-attestation"
group = "quality"
import_path = "ethos.surface.cli.quality.core:release_attestation_command"
