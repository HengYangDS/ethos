id = "ethos-coupling-registry"
schema_version = 1
layers = { product_semantic_hard_binding = "Kernel chain, public command semantics, Git facts, branch roles, and worktree lifecycle that define ETHOS product behavior.", mandatory_governance_dependency = "Official governance capabilities required for current planning records, deep proof, release proof, or archive proof.", native_protocol_binding = "Repository-local data protocols that keep command, config, state, event, and schema contracts stable across adapters.", product_toolchain_binding = "Current product-repository implementation and proof tools required to validate the ETHOS product repository, without becoming adopter ontology.", profile_or_adapter_binding = "Configured host, provider, projection, distribution, or execution surfaces that bind evidence without owning product semantics.", default_policy = "Repository-default policies that can be configured without changing semantics.", historical_evidence = "Historical proof records that preserve prior provider facts.", test_fixture = "Tests and fixtures that intentionally model a provider or adopter." }
ui_projection_fields = ["action", "label", "open_action", "open_label"]
product_semantic_docs = [
  "docs/governance/product-design-contract.md",
  "docs/reference/command-plane.md",
  "docs/architecture/runner-and-mutation.md",
  "docs/governance/release-governance.md",
  "docs/architecture/gate-runner.md",
]
git_native_terms = ["Git", "git", "worktree", "branch", "refs", "HEAD", "role_policy"]
native_protocol_formats = ["JSON Schema", "command JSON", "TOML", "JSONL", "SQLite local state"]
product_repository_gates = ["unit-architecture", "ruff", "build"]

[openspec_governance]
required = true
layer = "mandatory_governance_dependency"
capability = "official-native governance records"
execution_surface = "profile_or_adapter_binding"
not_a_second_command_plane = true

[native_protocols]
layer = "native_protocol_binding"
formats = ["JSON Schema", "command JSON", "TOML", "JSONL", "SQLite local state"]
provider_optional = false

[[binding]]
id = "git_repository_substrate"
layer = "product_semantic_hard_binding"
required = true
owns_product_semantics = true
adapter_replaceable = false
required_for = ["repository identity", "branch roles", "HEAD-bound evidence", "worktree lifecycle"]
replaceability = "hard-bound"
degradation_state = "blocked:git_repository_missing"
proof_gate = "ethos status --json"
surfaces = ["commits", "refs", "branches", "worktrees", "HEAD"]
executables = ["git"]

[[binding]]
id = "branch_role_policy"
layer = "product_semantic_hard_binding"
required = true
owns_product_semantics = true
adapter_replaceable = false
config_source = ".ethos/workspace.toml"
config_keys = [
  "release_branch",
  "accepted_branch",
  "candidate_branch",
  "work_branch_prefix",
  "proposal_branch_prefix",
]
required_for = ["semantic role classification", "mutation admission"]
replaceability = "hard-bound"
degradation_state = "default policy only"
proof_gate = "ethos status --json"

[[binding]]
id = "work_lane_lifecycle_command_contract"
layer = "product_semantic_hard_binding"
required = true
owns_product_semantics = true
adapter_replaceable = false
commands = [
  "ethos lane start",
  "ethos lane prewrite",
  "ethos lane refresh-base",
  "ethos land",
  "ethos land --closeout",
  "ethos lane retire landed",
  "ethos lane retire superseded",
]
forbidden_workflow_state = ["raw_git_worktree_add"]
required_for = ["tracked mutation isolation", "local closeout"]
replaceability = "hard-bound"
degradation_state = "blocked:protected_root_mutation"
proof_gate = "ethos prove --full --execute --json"

[[binding]]
id = "public_command_plane"
layer = "product_semantic_hard_binding"
required = true
owns_product_semantics = true
adapter_replaceable = false
commands = [
  "ethos status",
  "ethos plan",
  "ethos prove",
  "ethos publish",
  "ethos adopt",
  "ethos hook admit",
  "ethos hook pre-push",
  "ethos hook reconciliation-receipt",
  "ethos hook ref-transaction",
  "ethos hook install",
  "ethos lane status",
  "ethos lane housekeeping",
  "ethos lane candidate",
  "ethos lane lease renew",
  "ethos lane lease resume",
  "ethos lane handoff offer",
  "ethos lane handoff accept",
  "ethos lane handoff export",
  "ethos lane handoff import",
  "ethos lane handoff revoke-source",
]
distribution = "ethos"
executables = ["ethos"]
required_for = ["public command dispatch", "machine-readable lifecycle results"]
replaceability = "hard-bound"
degradation_state = "blocked:command_surface_unavailable"
proof_gate = "unit-architecture"

[[binding]]
id = "openspec_workspace"
not_a_second_command_plane = true
layer = "mandatory_governance_dependency"
required = true
owns_product_semantics = false
adapter_replaceable = false
not_product_substrate = true
required_for = ["official governance records", "strict specification validation"]
replaceability = "mandatory"
degradation_state = "blocked:openspec_shape_gap"
proof_gate = "openspec validate --all --strict --json"

[[binding]]
id = "openspec_cli"
