  "ruff",
  "python-types",
  "docstrings",
  "module-layout",
  "no-compat",
  "python-size",
  "toml-config",
  "yaml-config",
  "shell-lint",
  "format-policy",
]
product_full = [
  "repository-audit",
  "claims",
  "evidence-freshness",
  "docs-registry",
  "docs-topology",
  "schemas",
  "playbooks-v2",
  "generated-artifacts",
