schema_version = 1
id = "gate-registry"
source_refs = ["system/gates.toml"]

[proof_sets]
default = ["docs-registry", "openspec", "markdown-links", "config-quality", "markdown-lint", "source-format", "prose"]
full = ["docs-registry", "openspec", "markdown-links", "config-quality", "markdown-lint", "source-format", "prose"]

[[gates]]
id = "docs-registry"
kind = "docs"
required_for_paths = ["*.md"]
providers = ["provider.docs-registry"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["markdown-docs"]
dimensions = ["front-matter", "taxonomy", "visible-sections", "command-examples", "plan-discoverability"]
execution_mode = "provider"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "schemas"
kind = "schema"
providers = ["provider.schemas"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["json-contracts"]
dimensions = ["schema", "stable-ordering"]
execution_mode = "provider"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "skills"
kind = "governance"
providers = ["provider.skill-portfolio"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["skills", "assistant-projections"]
dimensions = ["projection", "activation", "schema"]
execution_mode = "provider"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "openspec"
kind = "governance"
required_for_paths = ["openspec/config.yaml", "openspec/specs/*.md", "openspec/changes/*.md"]
providers = ["provider.openspec"]
policy = "required"
profile = "repository"
toolchain = "ethos"
depends_on = ["schemas"]
asset_classes = ["markdown-docs", "json-contracts"]
dimensions = ["specification", "schema"]
execution_mode = "provider"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "locked-toolchain"

[[gates]]
id = "markdown-links"
kind = "docs"
required_for_paths = ["*.md"]
providers = ["provider.markdown-links"]
tools = ["lychee"]
policy = "required"
profile = "repository"
toolchain = "quality-adapter"
asset_classes = ["markdown-docs"]
dimensions = ["links", "anchors"]
execution_mode = "provider"
evidence_class = "diagnostic"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "adopter-toolchain"

[[gates]]
id = "config-quality"
kind = "config"
required_for_paths = ["*.toml", "*.yaml", "*.yml", "*.json", "*.ini", "*.cfg"]
providers = ["provider.configuration"]
tools = ["taplo", "prettier", "prettier-ignore", "yamllint"]
policy = "required"
profile = "repository"
toolchain = "quality-adapter"
asset_classes = ["toml-config", "json-contracts", "yaml-config"]
dimensions = ["format", "lint", "syntax", "projection-boundary"]
execution_mode = "provider"
evidence_class = "diagnostic"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "locked-toolchain"

[[gates]]
id = "markdown-lint"
kind = "lint"
required_for_paths = ["*.md"]
providers = ["provider.markdown-lint"]
tools = ["prettier", "prettier-ignore", "markdownlint-cli2"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["markdown-docs"]
dimensions = ["markdown-format", "markdown-lint"]
execution_mode = "provider"
evidence_class = "diagnostic"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "locked-toolchain"

[[gates]]
id = "source-format"
kind = "format"
required_for_paths = ["*.py", "*.pyi", "*.md", "*.toml", "*.yaml", "*.yml", "*.json", "*.js", "*.mjs", "*.cjs", "*.sh", "*.bash", "*.svg"]
providers = ["provider.source-format"]
tools = ["prettier", "prettier-ignore", "taplo", "ruff"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["python-code", "config", "markdown-docs", "assets"]
dimensions = ["native-source-format"]
execution_mode = "provider"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "prose"
kind = "docs"
required_for_paths = ["*.md"]
providers = ["provider.prose"]
tools = ["codespell", "vale"]
policy = "required"
profile = "repository"
toolchain = "quality-adapter"
asset_classes = ["markdown-docs"]
dimensions = ["spelling"]
execution_mode = "provider"
evidence_class = "diagnostic"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "locked-toolchain"
