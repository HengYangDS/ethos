schema_version = 1
id = "gate-registry"
source_refs = ["system/gates.toml"]

[proof_sets]
default = ["repository-audit", "evidence-freshness", "docs-registry", "schemas", "playbooks-v2", "generated-artifacts", "product-boundary", "unit-architecture", "ruff", "python-types", "docstrings", "module-layout", "import-boundaries", "dependency-hygiene", "config-quality", "shell-lint"]
full = ["repository-audit", "evidence-freshness", "docs-registry", "schemas", "playbooks-v2", "generated-artifacts", "product-boundary", "openspec", "unit-architecture", "coverage-floor", "ruff", "python-types", "docstrings", "module-layout", "import-boundaries", "dependency-hygiene", "build", "local-install-smoke", "markdown-links", "shell-lint", "config-quality", "python-size", "source-budget"]

[[gates]]
id = "repository-audit"
registries = ["runtime"]
kind = "governance"
providers = ["ethos.domain.status:audit_for_root"]
policy = "required"
profile = "product"
toolchain = "ethos"
asset_classes = ["evidence"]
dimensions = ["governance", "determinism"]
execution_mode = "provider"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos-repository-audit"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "evidence-freshness"
registries = ["runtime"]
