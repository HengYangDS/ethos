schema_version = 1
id = "gate-registry"
source_refs = ["system/gates.toml"]

[proof_sets]
product_default = ["repository-audit", "claims", "evidence-freshness", "docs-registry", "docs-topology", "schemas", "playbooks-v2", "generated-artifacts", "product-boundary", "unit-architecture", "ruff", "python-types", "docstrings", "module-layout", "import-boundaries", "dependency-hygiene", "no-compat", "python-size", "config-quality", "shell-lint", "format-policy"]
