schema = "system/schemas/contracts/invalid_states.schema.json"

# ETHOS invalid-state taxonomy — the SSOT.
#
# Derived from system/axioms.md: governance must make invalid states
# unreachable. ETHOS is therefore a repository trust-transition system: a
# state transition is trustworthy iff every node of the kernel chain is satisfied —
#
#   Authority -> Subject -> Commitment -> Change -> Evidence -> Claim -> Chronicle
#
# Every gap ETHOS emits is, by construction, a FAILED PRECONDITION of exactly one
# node or boundary precondition. This file is the MECE taxonomy those gaps
# classify into. It adds NO new entity — it names the failure classes the seven nodes already
# imply, so gap strings, scores, repairs, proof, OpenSpec, and parity all reduce to
# one vocabulary instead of ad-hoc strings.
#
# Rule: every gap string ETHOS emits MUST classify into exactly one category here
# (enforced by ethos_core.state.invalid.classify + a coverage test). A gap that
# matches no category is itself an invalid state — an ungoverned failure mode.

[[category]]
id = "authority_gap"
node = "Authority"
question = "Is the authority for this transition declared and ranked?"
summary = "The authority order that would sanction the transition is missing, unranked, or unresolved."
match_prefixes = ["authority_graph", "governance_rule_gap", "custom_rule_gap", "rule_", "rules_strict", "protected_branches_policy_missing", "protected_tags_policy_missing", "publication_topology_", "signing_required", "commit_signing", "head_signature_not_good"]

[[category]]
id = "subject_ambiguous"
node = "Subject"
question = "Is the governed subject (repo / package / branch role / path) unambiguous?"
summary = "The subject of the transition — which repository, package, branch role, editor root, or path — is missing or ambiguous."
match_prefixes = ["subject_ambiguous", "accepted_root_required", "editor_root_", "path_not_allowed_source", "path_invalid_control_character", "path_invalid_whitespace", "prewrite_path_invalid_control_character", "prewrite_path_invalid_whitespace", "git_repository_missing", "git_user_name_mismatch", "git_user_email_mismatch", "git_identity_not_allowed", "push_identity_", "pushed_commit_", "package_version_mismatch", "package_missing", "target_package_missing", "distribution_adapter_missing", "head_subject_not_conventional", "holder_ref_invalid", "target_holder_ref_invalid", "publication_remote_target_unknown", "publication_remote_name_missing", "maintenance_archive_root_required"]

[[category]]
id = "commitment_missing"
node = "Commitment"
question = "Does a durable contract / spec / policy / rule commit to this transition?"
summary = "The commitment — contract, spec, policy, capability profile, schema, or required doc/gate — that the transition must honor is absent or unsatisfied."
match_prefixes = ["commitment_missing", "schema_contract_gap", "schema_", "container_contract_", "source_budget_", "commit_policy_toml_invalid", "identity_mode_missing", "identity_mode_not_external", "allowed_identities_missing", "maintainer_or_team_missing", "automation_identity_missing", "personal_identity_literal", "local_workstation_path", "private_infrastructure_literal", "adopter_specific_literal", "generic_current_future_phase", "session_authority_literal", "single_author_policy", "single_author_metadata", "person_attribution_metadata", "distribution_bin_missing", "distribution_files_allowlist_missing", "distribution_file_scope_leak", "root_workspace_package_publishable", "private_reference_literal", "archival_", "identity_role_unknown", "identity_placeholder", "state_metadata_required", "tooling_contract_gap", "ty_policy_missing", "gate_required", "docs_", "docstring_style", "required_doc", "playbook", "skill_", "command_missing", "enterprise_readiness_governance_gaps", "enterprise_readiness_single_kernel_missing", "enterprise_readiness_subject_not_repository", "enterprise_readiness_transition_commands_mismatch", "enterprise_readiness_orient_reader_view_missing", "enterprise_readiness_report_scorecard_missing", "governance_kernel_", "guard_missing", "context_eval_suite_missing", "module_layout_", "workflow_transition_", "workflow_node_", "workflow_guardrail_", "workflow_runtime_", "workflow_event_", "workflow_eval_", "workflow_evolution_"]

[[category]]
id = "change_unbounded"
node = "Change"
question = "Is the in-flight change bounded and lifecycle-legal?"
summary = "The Change — work-lane, candidate train, closeout, promotion, authorization, or admission scope — is missing, stale, or not lifecycle-legal."
match_prefixes = ["change_unbounded", "work_lane_", "candidate_", "publication_candidate_branch_remote_forbidden", "publication_remote_branch_forbidden", "retire_branch", "retire_reason_required", "unbound_retire_", "superseded_retire_", "superseded_lane_", "absorbed_by_", "accepted_head_unavailable", "accepted_head_mismatch", "promotion_", "authorization_required", "protected_root_mutation", "coordination_gap", "hook_prerun_paths_required", "prewrite_guard_not_supplied", "protected_root_pretool_paths_required", "expect_head_required", "adoption_scaffold_missing", "adopter_missing", "accepted_advance_not_candidate_validated", "accepted_ref_move_not_candidate_head", "accepted_ref_move_not_fast_forward", "accepted_ref_move_no_closeout_intent", "closeout_intent_mismatch", "closeout_intent_stale", "closeout_intent_evidence_digest_mismatch", "closeout_intent_policy_digest_mismatch", "accepted_ref_move_bypasses_candidate_train", "git_stash_forbidden", "handoff_required", "foreign_work_lane_", "unbound_work_lane_ref_present", "enterprise_readiness_coordination_blocking", "retirement_", "external_not_default", "embedded_not_frozen", "shadow_required", "campaign_", "confirmation_present", "dirty_disposition_", "handoff_", "holder_quiescence_confirmation_required", "irreversible_confirmation_required", "lane_branch_mismatch", "lane_resolution_", "lease_", "recheck_required", "reconciliation_required", "repair_required", "lane_lease_ambiguous", "maintenance_irreversible_confirmation_required"]

[[category]]
id = "carrier_invalid"
node = "Change"
question = "Is the change carrier valid enough to bound the transition?"
summary = "The carrier — OpenSpec workspace, change, archive, delta specs, metadata, or official validation surface — is absent, malformed, or insufficient to bound the transition."
match_prefixes = ["carrier_invalid", "openspec_", "archive_missing", "archive_invalid", "material_paths_missing", "official_openspec_", "official_archive_", "isolated_workspace_", "workspace_", "capability_profile_", "capability_family_"]

[[category]]
