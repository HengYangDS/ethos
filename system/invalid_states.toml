schema = "system/schemas/contracts/invalid_states.schema.json"

# This taxonomy groups verifier signals by the terminal kernel. It is a reader
# projection only: ChangeContract and Attestation remain the only persistent
# semantic entities; RepositoryFacts and PlanIR are recomputed per evaluation.

