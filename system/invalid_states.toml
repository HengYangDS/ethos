summary = "The substrate the chain rides on — Git, hooks, worktrees, generated projections, command runtime, Python/uv/node launchers, or local state — is bypassable, drifted, hung, or otherwise untrusted."
match_prefixes = ["substrate_untrusted", "adapter_bypass", "adapter_missing", "write_admission_not_armed", "design_integrity_forbidden_projection_path", "hook_context_root_mismatch", "root_binding_mismatch", "embedded_backend_missing", "external_product_repository_audit_gap", "external_required_gap_superset", "external_stricter_required_gap", "remote_tracking_", "reconciliation_", "base_refreshed_projection_stale", "projection_", "projection_regeneration_required", "assistant_projection", "assistant_surface_projection_gap", "docs_registry_drift", "generated_artifact_", "context_index_", "skill_registry_", "runtime_unresponsive", "runtime_process_pressure", "worktree_", "python_entrypoint_invalid", "uv_interpreter_probe_stuck", "command_not_found", "command_timeout", "command_no_output", "maintenance_recovery_snapshot_drift"]
