[[category]]
id = "claim_unbound_or_overreaching"
node = "Claim"
question = "Does the claim stay bound to and within what its verifier and evidence prove?"
summary = "A Claim is missing, unbound, or asserts beyond what its verifier and evidence prove."
match_prefixes = ["claim_unbound_or_overreaching", "claim_overreach", "claim_gap_count", "active_claim_private_coupling", "enterprise_readiness_claim_missing", "claims_missing", "trust_claim_missing", "semantic_overclaim", "binding_registry_", "kill_signal_missing", "fallback_missing"]

[[category]]
id = "chronicle_missing"
node = "Chronicle"
question = "Was the judged outcome recorded in durable history?"
summary = "The Chronicle — judged history, release attestation, evolution ledger, or archive record — that must record the outcome is missing or invalid."
match_prefixes = ["chronicle_missing", "evolution_ledger", "evolution_hypotheses_", "entry_evidence_refs_invalid", "entry_decision_refs_invalid", "hypothesis_proof_refs_invalid", "hypothesis_review_refs_invalid", "hypothesis_decision_refs_invalid", "release", "publish", "attestation", "provenance", "sbom", "bootstrap_", "lane_resolution_chronicle_"]

[[category]]
