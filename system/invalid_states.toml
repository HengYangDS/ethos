[[category]]
id = "repository_facts_invalid"
concept = "RepositoryFacts"
question = "Are the repository facts required for this evaluation fresh and available?"
summary = "A required Git, filesystem, provider, or observation fact is missing, stale, malformed, or unavailable."
match_prefixes = [
  "fact_",
  "repository_facts_",
  "facts_",
  "git_snapshot_",
  "provider_configuration_",
  "provider_not_configured",
  "provider_observation_",
  "provider_output_",
  "provider_tool_",
  "hosted_provider_observation_",
  "remote_tracking_",
  "worktree_",
  "observation_",
]

