# Lifecycle policy, PlanIR actions, and lease operations.
# Repository facts and attestations derive state; this file stores no run state.

schema = "system/schemas/contracts/lifecycle.schema.json"
transition_policy = [
  { id = "guarded", applied_state = "applying" },
  { id = "work_lane", applied_state = "work_lane_ready", planned_state = "dry_run", required_role = "work_lane", role_gap = "protected_root_mutation", dirty_gap = "work_lane_dirty", authorization_required = true, expected_head_required = true, dry_run_commands = ["land"] },
  { id = "closeout", applied_state = "closeout_ready", planned_state = "dry_run", current_state = "current", required_role = "accepted_root", role_gap = "accepted_root_required", dirty_gap = "accepted_root_dirty", authorization_required = true, expected_head_required = true },
  { id = "adopt", applied_state = "applying", authorization_required = true, expected_head_required = true, head_mismatch_gap = "expected_head_mismatch", untracked_gap = "git_repository_missing" },
]
lease_transition = [
  { id = "renew", applied_state = "renewed", effect_fields = ["holder_ref", "expected_epoch", "expected_expires_at", "expected_payload_sha256", "ttl_seconds"], actor_field = "holder_ref" },
  { id = "resume", applied_state = "resumed", effect_fields = ["holder_ref", "expected_epoch", "expected_expires_at", "expected_payload_sha256", "ttl_seconds"], actor_field = "holder_ref", blocks_contrary_decision = true },
  { id = "handoff_offer", applied_state = "handoff_offered", effect_fields = ["holder_ref", "expected_epoch", "expected_expires_at", "expected_payload_sha256", "target_holder_ref"], actor_field = "holder_ref" },
  { id = "handoff_accept", applied_state = "handoff_accepted", effect_fields = ["holder_ref", "target_holder_ref", "offer_id", "expected_epoch", "expected_expires_at", "expected_payload_sha256", "holder_quiesced", "ttl_seconds"], actor_field = "target_holder_ref" },
]
node = [
  { id = "status", kind = "check", enforcement = "guarded", produces = ["workspace_status"] },
  { id = "plan", kind = "decision", enforcement = "guarded", requires = ["workspace_status", "openspec_carrier"], produces = ["plan_ir"] },
  { id = "prove", kind = "decision", enforcement = "guarded", requires = ["plan_ir"], produces = ["proof_evidence"] },
  { id = "land", kind = "effect", enforcement = "guarded", requires = ["proof_evidence", "change_contract"], produces = ["candidate_update"] },
  { id = "publish", kind = "effect", enforcement = "evidence-only", requires = ["candidate_update", "release_readiness"], produces = ["publication_readiness"] },
]
