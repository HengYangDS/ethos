schema = "ethos-source-budget-carriers-v2"
contract_version = 2

[[carriers]]
carrier_id = "governance-history"
role = "governance_history"
scope_id = "governance.history"
disposition = "measure"
metric_profile = "governance-footprint-v2"
extensions = []
include = ["openspec/**", ".agents/**", "rules/**", "evolution/**"]
exclude = []
owner = "ethos-repository-governance"

[[carriers]]
carrier_id = "evidence-instances"
role = "evidence_instance"
scope_id = "evidence.instances"
disposition = "measure"
metric_profile = "evidence-footprint-v2"
extensions = []
include = ["evidence/**"]
exclude = []
owner = "ethos-evidence"

[[carriers]]
carrier_id = "derived-projections"
role = "derived_projection"
scope_id = "derived.projections"
disposition = "measure"
metric_profile = "derived-footprint-v2"
extensions = []
include = [
  "docs/architecture/_generated/**",
  "distributions/**",
  ".github/**",
  ".gitlab/**",
  ".gitlab-ci.yml",
]
exclude = []
owner = "ethos-projections"

[[carriers]]
carrier_id = "documentation"
role = "documentation"
scope_id = "documentation"
disposition = "measure"
metric_profile = "documentation-footprint-v2"
extensions = []
include = [
  "docs/**",
  "**/*.md",
  "LICENSE",
]
exclude = [
  "docs/architecture/_generated/**",
  "openspec/**",
  ".agents/**",
  "rules/**",
  "evolution/**",
  "evidence/**",
  "tests/**",
  "extensions/**/tests/**",
  "distributions/**",
  ".github/**",
  ".gitlab/**",
]
owner = "ethos-documentation"

[[carriers]]
carrier_id = "test-python"
role = "test_source"
scope_id = "tests.python"
disposition = "measure"
metric_profile = "test-python-v2"
extensions = [".py", ".pyi"]
include = ["tests/**", "extensions/**/tests/**"]
exclude = []
owner = "ethos-quality"

[[carriers]]
carrier_id = "test-toml"
role = "test_source"
scope_id = "tests.toml"
disposition = "measure"
metric_profile = "test-toml-v2"
extensions = [".toml"]
include = ["tests/**", "extensions/**/tests/**"]
exclude = []
owner = "ethos-quality"

[[carriers]]
carrier_id = "test-json"
role = "test_source"
scope_id = "tests.json"
disposition = "measure"
metric_profile = "test-json-v2"
extensions = [".json"]
include = ["tests/**", "extensions/**/tests/**"]
exclude = []
owner = "ethos-quality"

[[carriers]]
carrier_id = "python-source"
role = "authored_behavioral_source"
scope_id = "product.python"
disposition = "measure"
metric_profile = "python-source-v2"
extensions = [".py", ".pyi"]
include = ["packages/**", "tools/**", "extensions/**"]
exclude = ["extensions/**/tests/**"]
owner = "ethos-product"

[[carriers]]
carrier_id = "shell-source"
role = "authored_behavioral_source"
scope_id = "tools.shell"
disposition = "measure"
metric_profile = "shell-source-v2"
extensions = [".sh", ".bash", ".zsh"]
include = ["tools/**"]
exclude = []
owner = "ethos-tooling"

[[carriers]]
carrier_id = "git-hook-source"
role = "authored_behavioral_source"
scope_id = "tools.git-hooks"
disposition = "measure"
metric_profile = "shell-source-v2"
extensions = []
include = [".githooks/**"]
exclude = []
owner = "ethos-tooling"

[[carriers]]
carrier_id = "toml-declarations"
role = "authored_declarative_source"
scope_id = "declarations.toml"
disposition = "measure"
metric_profile = "toml-source-v2"
extensions = [".toml"]
include = ["**"]
exclude = [
  "openspec/**",
  ".agents/**",
  "rules/**",
  "evolution/**",
  "evidence/**",
  "tests/**",
  "extensions/**/tests/**",
  "docs/**",
  "distributions/**",
  ".github/**",
  ".gitlab/**",
]
owner = "ethos-configuration"

[[carriers]]
carrier_id = "yaml-declarations"
role = "authored_declarative_source"
scope_id = "declarations.yaml"
disposition = "measure"
metric_profile = "yaml-source-v2"
extensions = [".yaml", ".yml"]
include = ["**"]
exclude = [
  "openspec/**",
  ".agents/**",
  "rules/**",
  "evolution/**",
  "evidence/**",
  "tests/**",
  "extensions/**/tests/**",
  "docs/**",
  "distributions/**",
  ".github/**",
  ".gitlab/**",
  ".gitlab-ci.yml",
]
owner = "ethos-configuration"

[[carriers]]
carrier_id = "json-declarations"
role = "authored_declarative_source"
scope_id = "declarations.json"
disposition = "measure"
metric_profile = "json-source-v2"
extensions = [".json"]
include = ["**"]
exclude = [
  "openspec/**",
  ".agents/**",
  "rules/**",
  "evolution/**",
  "evidence/**",
  "tests/**",
  "extensions/**/tests/**",
  "docs/**",
  "distributions/**",
  ".github/**",
  ".gitlab/**",
  "package-lock.json",
]
owner = "ethos-configuration"

[[carriers]]
carrier_id = "ini-declarations"
role = "authored_declarative_source"
scope_id = "declarations.ini"
disposition = "measure"
metric_profile = "ini-source-v2"
extensions = [".ini", ".cfg"]
include = ["**"]
exclude = []
owner = "ethos-configuration"

[[carriers]]
carrier_id = "diagram-declarations"
role = "authored_declarative_source"
scope_id = "declarations.diagram"
disposition = "measure"
metric_profile = "diagram-source-v2"
extensions = [".c4"]
include = ["**"]
exclude = []
owner = "ethos-architecture"

[[carriers]]
carrier_id = "repository-control-files"
role = "authored_declarative_source"
scope_id = "declarations.control"
disposition = "measure"
metric_profile = "control-source-v2"
extensions = []
include = ["**/.gitignore", "**/.shellcheckrc"]
exclude = [".ethos/state/**"]
owner = "ethos-repository"

[[carriers]]
carrier_id = "runtime-local"
role = "runtime_local"
scope_id = "runtime.local"
disposition = "exclude"
extensions = []
include = [".ethos/state/**"]
exclude = []
owner = "ethos-runtime"
exclusion_reason = "Runtime-local state is governed by lifecycle and hygiene contracts."

[[carriers]]
carrier_id = "vendor-locks"
role = "vendor_or_lock"
scope_id = "vendor.lock"
disposition = "exclude"
extensions = []
include = ["uv.lock", "package-lock.json"]
exclude = []
owner = "ethos-dependencies"
exclusion_reason = "Dependency lock resolution is governed by package-manager contracts."
