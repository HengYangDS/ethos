# system/routing.toml
# Subject resolver, stage map, and proof-set routing.
# The machine kernel's map from "what am I touching" to "which stage and proof applies".
# Loaded as a product system contract; the repository paradigm fixes the branch roles.

schema = "system/schemas/contracts/routing.schema.json"

# The one product loop.
[loop]
stages = ["status", "plan", "prove", "land", "publish"]
read_only = ["status"]
