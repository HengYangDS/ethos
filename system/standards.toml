id = "ethos-standards-registry"
schema_version = 1

[[adapter]]
id = "slsa"
mode = "local-projection"
lifecycle = "adapter"
reference = "https://slsa.dev/spec"
boundary = "Attestation and release facts may project to ETHOS-local SLSA-shaped fields without claiming SLSA conformance."
input_contract = "Generic proof Attestation plus release subject digest."
output_contract = "ETHOS provenance projection with SLSA-shaped fields."
fallback = "Keep unsigned Attestation JSON with HEAD and digest binding."
exit_strategy = "Remove the projection while preserving the Attestation schema."

[[adapter]]
id = "in_toto"
mode = "local-projection"
lifecycle = "adapter"
reference = "https://in-toto.io/"
boundary = "Wrap ETHOS Attestations as in-toto-shaped statement envelopes without claiming in-toto conformance."
input_contract = "ETHOS provenance envelope."
output_contract = "ETHOS-local in-toto-shaped attestation."
fallback = "Emit ETHOS provenance JSON without external envelope publication."
exit_strategy = "Drop envelope projection while keeping evidence digest binding."

[[adapter]]
id = "sigstore"
mode = "first-class-adapter"
lifecycle = "optional"
reference = "https://www.sigstore.dev/"
boundary = "Sign artifacts or evidence projections; do not own truth."
input_contract = "Release artifact digest or evidence digest."
output_contract = "Signature and transparency-log reference."
fallback = "Use local digest verification and Git-signed release tags."
exit_strategy = "Disable signing adapter without changing proof semantics."

[[adapter]]
id = "spdx"
mode = "local-projection"
lifecycle = "adapter"
reference = "https://spdx.dev/"
boundary = "Project release package metadata and lockfile facts without claiming SPDX conformance."
input_contract = "Workspace package metadata and lock data."
output_contract = "ETHOS lockfile-derived SPDX-lite SBOM projection."
fallback = "Keep package metadata and dependency lock evidence."
exit_strategy = "Remove SBOM projection without changing release readiness."
