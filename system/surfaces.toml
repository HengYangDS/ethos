# system/surfaces.toml
# Current product-surface contract.
# The CLI is NOT the semantic center. All surfaces consume the same contracts,
# schemas, and command JSON. Derived from the terminal design "Product Surfaces" table.

schema = "system/schemas/contracts/surfaces.schema.json"

[runtime]
inputs = [
  "DOCKER_HOST",
  "ETHOS_ACTOR",
  "ETHOS_CI_TOOL_CACHE_DIR",
  "ETHOS_HOUSEKEEPING_ROOTS",
  "ETHOS_INDEPENDENT_VERIFICATION_RECEIPT",
  "ETHOS_NPX_CACHE_DIR",
  "ETHOS_OPENSPEC_BIN",
  "ETHOS_TEST_BASETEMP",
  "ETHOS_TEST_DURATIONS",
  "ETHOS_TEST_EVIDENCE_DIR",
  "ETHOS_TEST_RUN_AS_GID",
  "ETHOS_TEST_RUN_AS_UID",
  "ETHOS_TEST_SHARDS",
  "ETHOS_TEST_ATTESTATION_STATE_DIR",
  "ETHOS_TEST_TIMEOUT_METHOD",
  "ETHOS_TEST_TIMEOUT_SECONDS",
  "ETHOS_TEST_WORKERS",
  "ETHOS_COVERAGE_LOCK_WAIT_SECONDS",
  "PATH",
  "PYTEST_CURRENT_TEST",
  "PYTEST_XDIST_WORKER",
  "TMPDIR",
  "USER",
]

[[surface]]
name = "cli"
purpose = "Human and script workflow."
carrier = "src/ethos"

[[surface]]
name = "skills"
purpose = "Agent workflow packages generated from repository truth."
carrier = ".agents/skills"
projection = "generated_host_projections"

[[surface]]
name = "distributions"
purpose = "Thin launchers and runner packages."
carrier = "distributions/"

# Host projection generation remains derived and optional.
# Generated projection output must carry a source digest and fail drift checks when stale.
[projection]
inputs = [".agents/skills/", "system/projections/", "system/surfaces.toml"]
output = "host_projection"
drift_check = "source_digest_required"
