# system/surfaces.toml
# Current product-surface contract.
# The CLI is NOT the semantic center. All surfaces consume the same contracts,
# root operation catalog, schemas, and command JSON. The command-plane specification and the PDC's First-Hour UX own their
# meaning.

schema = "system/schemas/contracts/surfaces.schema.json"

[runtime]
executables = ["git", "lsof", "ps", "ssh-keygen", "gh", "glab", "mise", "pre-commit", "python.exe", "gitleaks", "uv"]
inputs = [
  "CI",
  "COMSPEC",
  "DOCKER_HOST",
  "ETHOS_ACTOR",
  "ETHOS_CHANGE",
  "ETHOS_CI_PERSISTENT_TOOL_CACHE_DIR",
  "ETHOS_CI_SUPPLY_MANIFEST",
  "ETHOS_CI_TOOL_CACHE_DIR",
  "ETHOS_COMMIT_ALLOWED_SIGNERS",
  "ETHOS_COMMIT_TRUST_ANCHOR",
  "ETHOS_HOST_ADMISSION",
  "ETHOS_HOUSEKEEPING_ROOTS",
  "ETHOS_HOSTED_OBSERVATION_EXECUTE",
  "ETHOS_INDEPENDENT_VERIFICATION_RECEIPT",
  "ETHOS_NATIVE_OUTPUT_DIR",
  "ETHOS_NODE_PACKAGE_SUPPLY",
  "ETHOS_NPX_CACHE_DIR",
  "ETHOS_OPENSPEC_BIN",
  "ETHOS_PROOF_HOST_LOAD_LIMIT",
  "ETHOS_TEST_ATTESTATION_STATE_DIR",
  "GITHUB_STEP_SUMMARY",
  "GIT_AUTHOR_EMAIL",
  "GIT_AUTHOR_NAME",
  "GIT_COMMITTER_EMAIL",
  "GIT_COMMITTER_NAME",
  "GIT_CONFIG_COUNT",
  "GIT_CONFIG_GLOBAL",
  "GIT_CONFIG_NOSYSTEM",
  "GIT_CONFIG_SYSTEM",
  "GIT_INDEX_FILE",
  "PATH",
  "PYTEST_CURRENT_TEST",
  "PYTEST_XDIST_WORKER",
  "SYSTEMROOT",
  "SystemRoot",
  "TEMP",
  "TMP",
  "TMPDIR",
  "USER",
  "UV_CACHE_DIR",
  "WINDIR",
  "XDG_DATA_HOME",
]

[[surface]]
name = "cli"
purpose = "Human and script workflow."
carrier = "src/ethos"

[[surface]]
name = "skills"
purpose = "Agent workflow packages generated from repository truth."
carrier = ".agents/skills"
