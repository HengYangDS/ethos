[[tool]]
concern = "mcp_smoke"
tool = "ethos-mcp-smoke"
config = ".config/checks/mcp/smoke.toml"
artifacts = "build/evidence/agent/mcp/"
gate = "tools/ci/scripts/run-mcp-smoke.sh"
