# system/tools.toml
# Tool catalog: tool identity, maturity, profiles, gate mapping, config path,
# install strategy, evidence output. Decides WHY a tool runs; .config/ decides HOW.
#
# Profiles decide which gates run by default. Presence in the catalog does NOT
# make a tool mandatory for every repository.
# `planned = true` records a roadmap commitment, not a current proof gap. A
# planned tool becomes an active gate only after it has a config owner, reusable
# script or native gate owner, registry entry, CI projection, and proof coverage.
# Derived from the terminal design "Tool Catalog" table. This is the target
# catalog; gate implementations converge here in Phase E2 (quality-proof-ratchet).

schema = "system/schemas/contracts/tools.schema.json"

[[tool]]
concern = "python_format_lint"
tool = "ruff"
config = "ruff.toml + .config/checks/ruff/"
profile = "minimal"
gate = ".config/ci/scripts/run-python-lint.sh"

[[tool]]
concern = "tests"
tool = "pytest + pytest-xdist + pytest-timeout"
config = "pytest.ini + .config/checks/pytest/policy.toml"
artifacts = "build/evidence/quality/tests/"
profile = "minimal"
gate = ".config/ci/scripts/run-python-tests.sh"

[[tool]]
concern = "test_performance"
tool = "pytest-benchmark"
config = ".config/checks/pytest/policy.toml"
profile = "product"
planned = true

[[tool]]
concern = "test_reporting"
tool = "allure-pytest"
config = ".config/checks/pytest/policy.toml"
profile = "product"
planned = true

[[tool]]
concern = "python_typing"
tool = "ty"
config = ".config/checks/ty/"
profile = "product"
gate = "ethos quality types --json"

[[tool]]
concern = "import_boundaries"
tool = "import-linter"
config = ".config/checks/import-linter/"
profile = "product"

[[tool]]
concern = "python_sast"
tool = "bandit"
config = ".config/checks/bandit/"
profile = "product"

[[tool]]
concern = "links"
tool = "lychee"
config = ".config/checks/lychee/"
profile = "product"

[[tool]]
concern = "coverage"
tool = "coverage.py + pytest-cov"
config = ".config/checks/coverage/coverage.ini"
artifacts = "build/evidence/quality/tests/coverage/"
profile = "product"
gate = ".config/ci/scripts/run-python-tests.sh"

[[tool]]
concern = "python_docstrings"
tool = "ethos-docstrings-google"
config = ".config/checks/docstrings/policy.toml"
profile = "product"
gate = ".config/ci/scripts/run-docstring-coverage.sh"

[[tool]]
concern = "dependency_hygiene"
tool = "deptry"
config = ".config/checks/deptry/"
profile = "product"
planned = true

[[tool]]
concern = "repository_hygiene"
tool = "python stdlib + git ls-files"
config = ".config/ci/scripts/run-repository-hygiene.sh"
profile = "minimal"
gate = ".config/ci/scripts/run-repository-hygiene.sh"

[[tool]]
concern = "toml"
tool = "taplo"
config = ".config/checks/taplo/taplo.toml"
profile = "minimal"
gate = ".config/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "markdown_style"
tool = "markdownlint-cli2,mdformat"
config = ".config/checks/markdown/"
profile = "minimal"
planned = true

[[tool]]
concern = "prose"
tool = "vale,codespell"
config = ".config/checks/prose/"
profile = "product"
planned = true

[[tool]]
concern = "yaml"
tool = "yamllint"
config = ".config/checks/yaml/yamllint.yaml"
profile = "minimal"
gate = ".config/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "json_syntax"
tool = "python json"
config = ".config/ci/scripts/run-config-lint.sh"
profile = "minimal"
gate = ".config/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "json_schema"
tool = "check-jsonschema,jq"
config = "system/schemas/"
profile = "minimal"
planned = true

[[tool]]
concern = "local_ci_fallback"
tool = "ETHOS local-ci owner gate bundle"
config = ".config/ci/scripts/run-local-ci.sh"
artifacts = "build/evidence/quality/tests/"
profile = "minimal"
gate = ".config/ci/scripts/run-local-ci.sh"

[[tool]]
concern = "shell"
tool = "shellcheck"
config = ".config/checks/shell/.shellcheckrc"
profile = "product"
gate = ".config/ci/scripts/run-shell-lint.sh"

[[tool]]
concern = "docker"
tool = "hadolint"
config = ".config/checks/docker/"
profile = "distribution"
planned = true

[[tool]]
concern = "sql"
tool = "sqlfluff"
config = ".config/checks/sqlfluff/"
profile = "extension"
planned = true

[[tool]]
concern = "secrets"
tool = "gitleaks"
optional = "trufflehog"
config = ".gitleaks.toml"
profile = "product"
gate = ".config/ci/scripts/run-secrets-scan.sh"

[[tool]]
concern = "python_vuln"
tool = "pip-audit"
config = ".config/checks/security/"
profile = "security"
planned = true

[[tool]]
concern = "osv_vuln"
tool = "osv-scanner"
config = ".config/checks/security/"
profile = "security"
planned = true

[[tool]]
concern = "sbom"
tool = "syft"
config = ".config/release/"
profile = "release"
planned = true

[[tool]]
concern = "image_package_scan"
tool = "grype"
config = ".config/checks/security/"
profile = "release"
planned = true

[[tool]]
concern = "signing"
tool = "sigstore,cosign"
config = ".config/release/"
profile = "release"
planned = true

[[tool]]
concern = "attestation"
tool = "in-toto,slsa"
config = "evidence/attestations/"
profile = "release"
planned = true
