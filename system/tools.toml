# system/tools.toml
# Tool catalog: tool identity, maturity, profiles, gate mapping, config path,
# install strategy, evidence output. Decides WHY a tool runs; .config/ decides HOW.
#
# Profiles decide which gates run by default. Presence in the catalog does NOT
# make a tool mandatory for every repository.
# `planned = true` records a roadmap commitment, not a current proof gap. A
# planned tool becomes an active gate only after it has a config owner, reusable
# script or native gate owner, registry entry, CI projection, and proof coverage.
# Derived from the terminal design "Tool Catalog" table. This is the target
# catalog; gate implementations converge here in Phase E2 (quality-proof-ratchet).

schema = "system/schemas/contracts/tools.schema.json"

[[tool]]
concern = "python_format_lint"
tool = "ruff"
config = "ruff.toml + .config/checks/ruff/"
profile = "minimal"
gate = "tools/ci/scripts/run-python-lint.sh"

[[tool]]
concern = "tests"
tool = "pytest + pytest-xdist + pytest-timeout"
config = "pytest.ini + .config/checks/pytest/policy.toml"
artifacts = "build/evidence/quality/tests/"
profile = "minimal"
gate = "tools/ci/scripts/run-python-tests.sh"

[[tool]]
concern = "test_performance"
tool = "pytest-benchmark"
config = ".config/checks/pytest/policy.toml"
profile = "product"
planned = true

[[tool]]
concern = "test_reporting"
tool = "allure-pytest"
config = ".config/checks/pytest/policy.toml"
profile = "product"
planned = true

[[tool]]
concern = "python_typing"
tool = "ty"
config = ".config/checks/ty/"
profile = "product"
gate = "ethos quality types --json"

[[tool]]
concern = "import_boundaries"
tool = "import-linter"
config = ".config/checks/import-linter/"
profile = "product"
gate = "tools/ci/scripts/run-import-linter.sh"

[[tool]]
concern = "python_sast"
tool = "bandit"
config = ".config/checks/bandit/"
profile = "product"
gate = "tools/ci/scripts/run-bandit.sh"

[[tool]]
concern = "links"
tool = "lychee"
config = ".config/checks/lychee/"
profile = "product"
gate = "ethos quality markdown-links"

[[tool]]
concern = "coverage"
tool = "coverage.py + pytest-cov"
config = ".config/checks/coverage/coverage.ini"
artifacts = "build/evidence/quality/tests/coverage/"
profile = "product"
gate = "tools/ci/scripts/run-python-tests.sh"

[[tool]]
concern = "python_docstrings"
tool = "ethos-docstrings-google"
config = ".config/checks/docstrings/policy.toml"
profile = "product"
gate = "tools/ci/scripts/run-docstring-coverage.sh"

[[tool]]
concern = "python_module_layout"
tool = "ethos-module-layout"
config = ".config/checks/module-layout/policy.toml"
profile = "product"
gate = "tools/ci/scripts/run-module-layout.sh"

[[tool]]
concern = "dependency_hygiene"
tool = "deptry"
config = ".config/checks/deptry/"
profile = "product"
planned = true

[[tool]]
concern = "product_boundary"
tool = "ethos-product-boundary"
config = "packages/ethos/src/ethos/repository/policy/boundary/product.py"
profile = "product"
gate = "tools/ci/scripts/run-product-boundary.sh"

[[tool]]
concern = "repository_hygiene"
tool = "python stdlib + git ls-files"
config = "tools/ci/scripts/run-repository-hygiene.sh"
profile = "minimal"
gate = "tools/ci/scripts/run-repository-hygiene.sh"

[[tool]]
concern = "toml"
tool = "taplo"
config = ".config/checks/taplo/taplo.toml"
profile = "minimal"
gate = "tools/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "markdown_style"
tool = "markdownlint-cli2"
config = ".config/checks/markdown/.markdownlint-cli2.yaml"
profile = "product"
gate = "tools/ci/scripts/run-markdown-lint.sh"

[[tool]]
concern = "prose"
tool = "vale,codespell"
config = ".config/checks/prose/"
profile = "product"
planned = true

[[tool]]
concern = "yaml"
tool = "yamllint"
config = ".config/checks/yaml/yamllint.yaml"
profile = "minimal"
gate = "tools/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "json_syntax"
tool = "python json"
config = "tools/ci/scripts/run-config-lint.sh"
