[[tool]]
concern = "hosted_provider_observation"
tool = "gh,glab"
config = ".config/checks/ci/hosted-observation.toml"
artifacts = "build/evidence/hosted-ci/"
gate = "tools/ci/scripts/run-hosted-provider-observation.sh"
