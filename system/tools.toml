config = "tools/ci/scripts/download-file.sh"
artifacts = "build/cache/ci-tools/"
profile = "product"
gate = "tools/ci/scripts/install-gitleaks.sh and tools/ci/scripts/install-node.sh"

[[tool]]
concern = "local_ci_fallback"
tool = "ETHOS local-ci owner gate bundle"
config = "tools/ci/scripts/run-local-ci.sh"
artifacts = "build/evidence/quality/tests/"
profile = "minimal"
gate = "tools/ci/scripts/run-local-ci.sh"

[[tool]]
concern = "shell"
tool = "shellcheck"
config = ".config/checks/shell/.shellcheckrc"
profile = "product"
gate = "tools/ci/scripts/run-shell-lint.sh"

[[tool]]
concern = "docker"
