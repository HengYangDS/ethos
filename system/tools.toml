# system/tools.toml
# Tool catalog: tool identity, maturity, profiles, gate mapping, config path,
# install strategy, evidence output. Decides WHY a tool runs; .config/ decides HOW.
#
# Profiles decide which gates run by default. Presence in the catalog does NOT
# make a tool mandatory for every repository.
# This runtime catalog contains admitted executable mechanisms only. Future,
# deferred, and rejected alternatives live in the tooling roadmap until a
# time-bounded OpenSpec pilot owns real config, supply, runner, and evidence.

schema = "system/schemas/contracts/tools.schema.json"

[[tool]]
concern = "python_format_lint"
tool = "ruff"
config = "ruff.toml"
executables = ["ruff"]
profile = "minimal"
gate = "uv run --frozen --offline python -m nox -s lint"

[[tool]]
concern = "tests"
tool = "pytest + pytest-xdist + pytest-timeout"
config = ".config/checks/pytest/pytest.ini + .config/checks/pytest/policy.toml"
executables = ["pytest"]
artifacts = "build/evidence/quality/tests/"
profile = "minimal"
gate = "uv run --frozen --offline python -m nox -s tests"

[[tool]]
concern = "property_testing"
tool = "Hypothesis"
config = ".config/checks/pytest/policy.toml"
artifacts = "build/runtime/tool-cache/hypothesis/"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s tests"

[[tool]]
concern = "python_typing"
tool = "ty"
config = ".config/checks/ty/"
profile = "product"
gate = "ethos prove --gate python-types --json"

[[tool]]
concern = "import_boundaries"
tool = "import-linter"
config = ".config/checks/import-linter/"
executables = ["lint-imports"]
profile = "product"
gate = "uv run --frozen --offline python -m nox -s import_boundaries"

[[tool]]
concern = "python_sast"
tool = "ruff"
config = "ruff.toml"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s lint"

[[tool]]
concern = "links"
tool = "lychee"
config = ".config/checks/lychee/"
executables = ["lychee"]
profile = "product"
gate = "ethos prove --gate markdown-links; hosted: ethos prove --gate external-links"

[[tool]]
concern = "coverage"
tool = "coverage.py + pytest-cov"
config = ".config/checks/coverage/coverage.ini"
artifacts = "build/evidence/quality/tests/coverage/"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s tests"

[[tool]]
concern = "python_docstrings"
tool = "ethos-docstrings-google"
config = ".config/checks/docstrings/policy.toml"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s docstrings"

[[tool]]
concern = "python_module_layout"
tool = "ethos-module-layout"
config = ".config/checks/module-layout/policy.toml"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s module_layout"

[[tool]]
concern = "dependency_hygiene"
tool = "deptry"
config = ".config/checks/deptry/policy.toml"
artifacts = "build/evidence/quality/dependency/"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s dependencies"

[[tool]]
concern = "product_boundary"
tool = "ethos-product-boundary"
config = "src/ethos/repository/policy/boundary/product.py"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s product_boundary"

[[tool]]
concern = "repository_hygiene"
tool = "python stdlib + git ls-files"
config = ".config/checks/repository-hygiene/policy.toml"
executables = ["git"]
profile = "minimal"
gate = "uv run --frozen --offline python -m nox -s repository_hygiene"

[[tool]]
concern = "toml"
tool = "taplo"
config = ".config/checks/taplo/taplo.toml"
executables = ["taplo"]
profile = "minimal"
gate = "tools/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "markdown_style"
tool = "markdownlint-cli2"
config = ".config/checks/markdown/.markdownlint-cli2.yaml"
profile = "product"
gate = "tools/ci/scripts/run-markdown-lint.sh"

[[tool]]
concern = "prose"
tool = "codespell"
config = ".config/checks/prose/codespell.toml"
profile = "product"
gate = "uv run --frozen --offline python -m nox -s prose"

[[tool]]
concern = "yaml"
tool = "yamllint"
config = ".config/checks/yaml/yamllint.yaml"
profile = "minimal"
gate = "tools/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "json_format"
tool = "python stdlib json"
config = ".config/checks/json/format.toml"
profile = "minimal"
gate = "tools/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "json_schema"
tool = "check-jsonschema"
config = ".config/checks/schema/jsonschema.toml + system/schemas/"
profile = "minimal"
gate = "uv run --frozen --offline python -m nox -s schemas"

[[tool]]
concern = "hook_config"
tool = "pre-commit validate-config"
config = ".pre-commit-config.yaml"
executables = ["pre-commit"]
profile = "minimal"
gate = "tools/ci/scripts/run-config-lint.sh"

[[tool]]
concern = "ci_tool_supply"
tool = "curl + cached CI artifact installers"
config = "tools/ci/scripts/download-file.sh"
checksums = "pinned installer SHA-256 values"
executables = [
  "apt-get",
  "cp",
  "curl",
  "grep",
  "gunzip",
  "gzip",
  "install",
  "ln",
  "mkdir",
  "mv",
  "rm",
  "sha256sum",
  "ssh-keygen",
  "sleep",
  "tar",
  "xz",
]
artifacts = "build/runtime/tool-cache/ci-tools/"
profile = "product"
gate = "tools/ci/scripts/install-gitleaks.sh and tools/ci/scripts/install-node.sh"

[[tool]]
concern = "node_runtime_compatibility"
tool = "node + npm"
config = ".config/checks/node/runtime.toml"
executables = ["node", "npm", "npx"]
profile = "distribution"
gate = "tools/ci/scripts/run-node-compatibility.sh"

[[tool]]
concern = "local_ci_fallback"
tool = "ETHOS local-ci owner gate bundle"
config = "uv run --frozen --offline python -m nox -s local_ci + tools/ci/scripts/require-stable-head.sh"
executables = [
  "bash",
  "cat",
  "chmod",
  "chown",
  "dirname",
  "find",
  "kill",
  "ps",
  "python",
  "python3",
  "rmdir",
  "sed",
  "setpriv",
  "tail",
  "tr",
  "uv",
]
artifacts = "build/evidence/quality/tests/"
profile = "minimal"
gate = "uv run --frozen --offline python -m nox -s local_ci"

[[tool]]
concern = "python_build"
tool = "Nox + uv + Hatchling"
config = "noxfile.py + pyproject.toml + uv.lock"
executables = ["nox", "uv"]
artifacts = "build/artifacts/python/"
profile = "product-toolchain"
gate = "uv run --frozen --offline python -m nox -s build"

[[tool]]
concern = "local_install_smoke"
tool = "uv offline wheel installation smoke"
config = ".ethos/release.toml + noxfile.py + tools/ci/local_install_smoke.py"
artifacts = "build/evidence/local-install/"
profile = "release"
gate = "uv run --frozen --offline python -m nox -s install_smoke"

[[tool]]
concern = "shell"
tool = "shellcheck"
config = ".config/checks/shell/.shellcheckrc"
executables = ["shellcheck"]
profile = "product"
gate = "tools/ci/scripts/run-shell-lint.sh"

[[tool]]
concern = "secrets"
tool = "gitleaks"
config = ".gitleaks.toml"
executables = ["gitleaks"]
profile = "product"
gate = "tools/ci/scripts/run-secrets-scan.sh"

[[tool]]
concern = "python_vuln"
tool = "uv audit"
config = ".config/checks/security/audit.toml"
artifacts = "build/evidence/quality/security/"
gate = "uv run --frozen --offline python -m nox -s vulnerabilities"
profile = "security"

[[tool]]
concern = "sbom"
tool = "syft"
config = ".config/release/supply-chain.toml"
executables = ["syft"]
artifacts = "build/evidence/release/"
gate = "uv run --frozen --offline python -m nox -s supply_chain"
profile = "release"

[[tool]]
concern = "ci_template_consistency"
tool = "ethos-ci-template-sync"
config = ".config/ci/templates/hosted/ + .config/checks/ci/templates.toml"
references = ["docker", "github", "gitlab"]
gate = "uv run --frozen --offline python -m nox -s ci_templates"
profile = "provider"

[[tool]]
concern = "github_workflow_syntax"
tool = "actionlint"
config = ".config/checks/github/actionlint.toml"
executables = ["actionlint"]
gate = "tools/ci/scripts/run-actionlint.sh"
profile = "provider"

[[tool]]
concern = "github_local_emulator"
tool = "act"
config = ".config/checks/ci/templates.toml"
artifacts = "build/evidence/local-ci/github/"
gate = "tools/ci/scripts/run-github-local-emulator.sh"
profile = "provider"

[[tool]]
concern = "gitlab_local_emulator"
tool = "gitlab-ci-local"
config = ".config/checks/ci/templates.toml"
artifacts = "build/evidence/local-ci/gitlab/"
gate = "tools/ci/scripts/run-gitlab-local-emulator.sh"
profile = "provider"

[[tool]]
concern = "architecture_modeling"
tool = "LikeC4-like source -> Mermaid"
config = ".config/checks/architecture/"
artifacts = "docs/architecture/_generated/"
gate = "uv run --frozen --offline python -m nox -s architecture_projection"
profile = "architecture"

[[tool]]
concern = "architecture_projection_drift"
tool = "ethos-architecture-projection-drift"
config = ".config/checks/architecture/projection.toml"
gate = "uv run --frozen --offline python -m nox -s architecture_projection"
profile = "architecture"

[[tool]]
concern = "format_selection"
tool = "ethos-format-selection"
config = ".config/checks/format/selection.toml"
gate = "uv run --frozen --offline python -m nox -s format_selection"
profile = "product"

[[tool]]
concern = "generated_artifact_topology"
tool = "cel-expr-python + ethos-generated-artifacts"
config = "system/policies/generated-artifact-topology.toml + src/ethos/contracts/artifacts/topology.py"
artifacts = "build/evidence/generated-artifacts/"
gate = "ethos prove --gate generated-artifacts --json"
profile = "product"

[[tool]]
concern = "runbook_registry"
tool = "ethos-runbook-registry"
config = ".config/checks/runbook/registry.toml + docs/reference/runbook-registry.md"
gate = "uv run --frozen --offline python -m nox -s runbook_registry"
profile = "docs"

[[tool]]
concern = "hosted_provider_observation"
tool = "gh,glab"
config = ".config/checks/ci/hosted-observation.toml"
artifacts = "build/evidence/hosted-ci/"
gate = "tools/ci/scripts/run-hosted-provider-observation.sh"
profile = "provider"

[[tool]]
concern = "source_budget"
tool = "scc + ethos.measure"
config = ".config/checks/format/selection.toml"
profile = "product"
gate = "ethos prove --gate source-budget --json"
