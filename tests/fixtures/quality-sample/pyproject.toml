[project]
name = "quality-sample"
version = "0.1.0"
requires-python = ">=3.12,<3.15"

[tool.uv]
prerelease = "disallow"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-reportlog>=1.0.0", "ruff>=0.16.10"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample"]
