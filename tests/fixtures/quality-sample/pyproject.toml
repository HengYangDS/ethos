[project]
name = "quality-sample"
version = "0.1.0"
requires-python = ">=3.12,<3.15"

[tool.uv]
prerelease = "disallow"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-reportlog>=1.0.0", "ruff>=0.16.10"]

[build-system]
requires = ["uv_build>=0.13,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sample"
